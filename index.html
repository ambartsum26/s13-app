        function formatDate(dateStr) {

            if (!dateStr) return '';

            const parts = dateStr.split('-');

            if (parts.length === 3) {

                const sep = currentLang === 'fr' ? '/' : '.';

                return `${parts[2]}${sep}${parts[1]}${sep}${parts[0]}`;
            }

            return dateStr;
        }


        function parseInputDate(inputStr) {

            if (!inputStr) return null;

            const cleanStr = inputStr.trim();

            const sep = cleanStr.includes('/')
                ? '/'
                : (cleanStr.includes('.') ? '.' : null);

            if (sep) {

                const parts = cleanStr.split(sep);

                if (parts.length === 3) {

                    return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                }
            }

            return cleanStr;
        }


        function getCurrentDateFormatted() {

            const today = new Date();

            const day = String(today.getDate()).padStart(2, '0');
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const year = today.getFullYear();

            return `${year}-${month}-${day}`;
        }


        /*
         * ВАЖНО:
         * Создаём дату без UTC, чтобы не было проблем
         * со смещением часового пояса.
         */
        function parseLocalDate(dateStr) {

            if (!dateStr) return null;

            const parts = dateStr.split('-');

            if (parts.length !== 3) return null;

            const year = Number(parts[0]);
            const month = Number(parts[1]);
            const day = Number(parts[2]);

            const date = new Date(year, month - 1, day);

            if (
                date.getFullYear() !== year ||
                date.getMonth() !== month - 1 ||
                date.getDate() !== day
            ) {
                return null;
            }

            date.setHours(0, 0, 0, 0);

            return date;
        }


        /*
         * Возвращает дату, когда участок снова можно выдавать.
         *
         * Правило:
         * дата возврата + 1 год.
         */
        function getAvailableAgainDate(returnedAt) {

            const returnedDate = parseLocalDate(returnedAt);

            if (!returnedDate) return null;

            const availableDate = new Date(returnedDate);

            availableDate.setFullYear(
                availableDate.getFullYear() + 1
            );

            return availableDate;
        }


        /*
         * Сколько дней осталось до повторной выдачи.
         */
        function getDaysUntilAvailable(returnedAt) {

            const availableDate = getAvailableAgainDate(returnedAt);

            if (!availableDate) return null;

            const today = new Date();

            today.setHours(0, 0, 0, 0);

            const diff = availableDate.getTime() - today.getTime();

            return Math.max(
                0,
                Math.ceil(diff / (1000 * 60 * 60 * 24))
            );
        }


        /*
         * Проверяет, можно ли снова выдавать участок.
         */
        function isTerritoryAvailableAfterYear(returnedAt) {

            const availableDate = getAvailableAgainDate(returnedAt);

            if (!availableDate) return true;

            const today = new Date();

            today.setHours(0, 0, 0, 0);

            return today >= availableDate;
        }


        /*
         * Получаем последнюю завершённую выдачу.
         *
         * Не просто history[last], потому что в истории
         * могут находиться старые записи.
         */
        function getLastCompletedRecord(tObj) {

            if (!Array.isArray(tObj.history)) return null;

            const completed = tObj.history.filter(
                h => h && h.returnedAt
            );

            if (completed.length === 0) return null;

            return completed[completed.length - 1];
        }


        /*
         * Получаем последнюю запись истории.
         */
        function getLastHistoryRecord(tObj) {

            if (!Array.isArray(tObj.history)) return null;

            if (tObj.history.length === 0) return null;

            return tObj.history[tObj.history.length - 1];
        }

        let customDialogResolver = null;


        function showCustomDialog(title, fields) {

            return new Promise((resolve) => {

                customDialogResolver = resolve;

                document.getElementById(
                    'custom-dialog-title'
                ).innerText = title;

                const fieldsContainer =
                    document.getElementById('custom-dialog-fields');

                fieldsContainer.innerHTML = '';


                fields.forEach((f, idx) => {

                    const fieldWrapper =
                        document.createElement('div');

                    fieldWrapper.className =
                        'space-y-1';


                    const label =
                        document.createElement('label');

                    label.className =
                        'text-[10px] text-slate-400 font-bold uppercase tracking-wider block';

                    label.innerText = f.label;


                    const input =
                        document.createElement('input');

                    input.type = 'text';

                    input.id =
                        `custom-field-${idx}`;

                    input.value =
                        f.defaultValue || '';

                    input.placeholder =
                        f.placeholder || '';

                    input.className =
                        'w-full h-10 bg-slate-950 border border-slate-800 rounded-xl px-3 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 transition shadow-inner';


                    fieldWrapper.appendChild(label);
                    fieldWrapper.appendChild(input);

                    fieldsContainer.appendChild(fieldWrapper);
                });


                document.getElementById(
                    'custom-dialog-modal'
                ).classList.remove('hidden');

                document.getElementById(
                    'custom-dialog-modal'
                ).classList.add('flex');


                const firstInput =
                    document.getElementById('custom-field-0');

                if (firstInput) {
                    firstInput.focus();
                }

            });
        }


        window.closeCustomDialog = (isSuccess) => {

            document.getElementById(
                'custom-dialog-modal'
            ).classList.add('hidden');

            document.getElementById(
                'custom-dialog-modal'
            ).classList.remove('flex');


            if (!customDialogResolver) return;


            if (!isSuccess) {

                customDialogResolver(null);

            } else {

                const inputs =
                    document.querySelectorAll(
                        '#custom-dialog-fields input'
                    );

                const values =
                    Array.from(inputs).map(
                        inp => inp.value
                    );

                customDialogResolver(values);
            }


            customDialogResolver = null;
        };

        async function initApp() {

            try {

                const citiesSnapshot =
                    await getDocs(
                        collection(db, "cities")
                    );


                citiesData =
                    citiesSnapshot.docs.map(
                        d => ({
                            id: d.id,
                            ...d.data()
                        })
                    );


                const findCity =
                    (searchName) =>
                        citiesData.find(
                            c =>
                                c.name &&
                                c.name.normalize("NFC") ===
                                searchName.normalize("NFC")
                        );


                const cityMaps = {

                    "Valence":
                        "https://www.google.com/maps/d/edit?mid=1F--67sV9pTds54DmFxs1Lmz7SwRHlsw&ll=44.91635564862983%2C4.904553349999974&z=13",

                    "Guilherand-Granges":
                        "https://www.google.com/maps/d/viewer?mid=1HTtzXu4-uTSSwQPb9Ip1xKSrdVB0low",

                    "Saint-Marcel-lès-Valence":
                        "",

                    "Saint-Péray":
                        "",

                    "Tournon-sur-Rhône":
                        "",

                    "Romans-sur-Isère":
                        ""
                };


                for (
                    const [cityName, mapUrl]
                    of Object.entries(cityMaps)
                ) {

                    let existingCity =
                        findCity(cityName);


                    if (!existingCity) {

                        let territoriesList = [];


                        if (cityName === "Valence")
                            territoriesList = valenceTerritories;

                        if (cityName === "Guilherand-Granges")
                            territoriesList = guilherandTerritories;

                        if (cityName === "Saint-Marcel-lès-Valence")
                            territoriesList = saintMarcelTerritories;

                        if (cityName === "Saint-Péray")
                            territoriesList = saintPerayTerritories;

                        if (cityName === "Tournon-sur-Rhône")
                            territoriesList = tournonTerritories;

                        if (cityName === "Romans-sur-Isère")
                            territoriesList = romansTerritories;


                        const ref =
                            await addDoc(
                                collection(db, "cities"),
                                {
                                    name: cityName,
                                    mapUrl: mapUrl
                                }
                            );


                        for (
                            const item
                            of territoriesList
                        ) {

                            await addDoc(
                                collection(db, "territories"),
                                {
                                    cityId: ref.id,

                                    number: item.number,

                                    mapUrl:
                                        item.mapUrl || "",

                                    russianSpeakers:
                                        item.russianSpeakers || 0,

                                    history:
                                        item.history || []
                                }
                            );
                        }


                    } else {

                        if (
                            mapUrl &&
                            existingCity.mapUrl !== mapUrl
                        ) {

                            await updateDoc(
                                doc(
                                    db,
                                    "cities",
                                    existingCity.id
                                ),
                                {
                                    mapUrl: mapUrl
                                }
                            );
                        }
                    }
                }


                const updatedCitiesSnapshot =
                    await getDocs(
                        collection(db, "cities")
                    );


                citiesData =
                    updatedCitiesSnapshot.docs.map(
                        d => ({
                            id: d.id,
                            ...d.data()
                        })
                    );


                document.getElementById(
                    'db-status'
                ).innerHTML =
                    `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> ${t('db_connected').replace('● ', '')}`;


                if (
                    !activeCityId ||
                    !citiesData.find(
                        c => c.id === activeCityId
                    )
                ) {

                    activeCityId =
                        citiesData[0]?.id || null;
                }


                if (activeCityId) {

                    renderCities();

                    subscribeToTerritories();
                }


                onSnapshot(
                    collection(db, "cities"),
                    (snapshot) => {

                        citiesData =
                            snapshot.docs.map(
                                d => ({
                                    id: d.id,
                                    ...d.data()
                                })
                            );

                        renderCities();
                    }
                );


            } catch (error) {

                console.error(
                    "Firebase connection error:",
                    error
                );


                document.getElementById(
                    'db-status'
                ).innerHTML =
                    '<span class="w-2 h-2 rounded-full bg-rose-500"></span> ● Ошибка подключения';
            }
        }

        let unsubscribeTerritories = null;


        function subscribeToTerritories() {

            if (
                typeof unsubscribeTerritories === 'function'
            ) {

                unsubscribeTerritories();

                unsubscribeTerritories = null;
            }


            if (!activeCityId) return;


            const q =
                query(
                    collection(db, "territories"),

                    where(
                        "cityId",
                        "==",
                        activeCityId
                    )
                );


            unsubscribeTerritories =
                onSnapshot(
                    q,
                    (snapshot) => {

                        territoriesData =
                            snapshot.docs.map(
                                d => ({
                                    id: d.id,
                                    ...d.data()
                                })
                            );


                        territoriesData.sort(
                            (a, b) =>
                                parseInt(a.number) -
                                parseInt(b.number) ||
                                a.number.localeCompare(
                                    b.number
                                )
                        );


                        renderTerritories();


                        if (currentEditingTerritoryId) {

                            window.showHistory(
                                currentEditingTerritoryId
                            );
                        }
                    }
                );

        window.issueTerritory = async (id) => {

            const tObj =
                territoriesData.find(

            if (!tObj) return;


            /*
             * Проверяем, не находится ли участок
             * в годичном периоде ожидания.

            const lastCompleted =
                getLastCompletedRecord(tObj);


            if (
                lastCompleted &&
                !isTerritoryAvailableAfterYear(
                    lastCompleted.returnedAt

            ) {

                alert(
                    `${t('cannot_issue_waiting')}\n\n` +
                    `${t('last_return_label')} ${formatDate(lastCompleted.returnedAt)}\n` +
                    `${t('available_again_label')} ${formatDate(getAvailableAgainDate(lastCompleted.returnedAt).toISOString().slice(0, 10))}`
                );

                return;
            }


            const res =
                await showCustomDialog(
                    `${t('btn_issue')} - ${t('card_territory')} №${tObj.number}`,
                    [
                        {
                            label:
                                t('prompt_publisher_name'),

                            placeholder:

                        }

                );


            if (
                !res ||
                !res[0] ||
                !res[0].trim()
            ) return;


            const history =
                Array.isArray(tObj.history)
                    ? [...tObj.history]
                    : [];


            history.push({

                publisher:
                    res[0].trim(),

                issuedAt:
                    getCurrentDateFormatted(),

                returnedAt:

            });


            await updateDoc(
                doc(

                {
                    history

            );
        };

                    history.length - 1;


                /*

                 * После этого автоматически начинается

                history[lastIndex] = {

                    ...history[lastIndex],

                    returnedAt:

                };


                await updateDoc(
                    doc(

        function renderTerritories() {

            const grid =
                document.getElementById(
                    'grid'
                );


            grid.innerHTML = '';


            let free = 0;

            let busy = 0;

            let overdue = 0;

            let waiting = 0;


            territoriesData.forEach(
                (tObj, index) => {

                    /*
                     * Последняя запись истории.
                     */
                    const lastRec =
                        getLastHistoryRecord(
                            tObj
                        );


                    /*
                     * Если последняя запись ещё
                     * не возвращена — участок в обработке.
                     */
                    const isBusy =
                        lastRec &&
                        !lastRec.returnedAt;


                    /*
                     * Последняя завершённая выдача.
                     */
                    const lastCompleted =
                        getLastCompletedRecord(
                            tObj
                        );


                    /*
                     * Проверяем год ожидания.
                     *
                     * Это имеет смысл только для
                     * свободного участка.
                     */
                    let isWaiting = false;

                    let daysUntilAvailable = null;

                    let availableAgainDate = null;


                    if (
                        !isBusy &&
                        lastCompleted &&
                        lastCompleted.returnedAt
                    ) {

                        isWaiting =
                            !isTerritoryAvailableAfterYear(
                                lastCompleted.returnedAt
                            );


                        if (isWaiting) {

                            daysUntilAvailable =
                                getDaysUntilAvailable(
                                    lastCompleted.returnedAt
                                );


                            availableAgainDate =
                                getAvailableAgainDate(
                                    lastCompleted.returnedAt
                                );
                        }
                    }


                    /* =================================================
                       СТАТУС ВЫДАННОГО УЧАСТКА
                    ================================================= */

                    let days = 0;

                    let isOverdue = false;

                    let dueDateFormatted = '-';


                    if (
                        isBusy &&
                        lastRec.issuedAt
                    ) {

                        const parsedDate =
                            parseLocalDate(
                                lastRec.issuedAt
                            );


                        if (parsedDate) {

                            const today =
                                new Date();

                            today.setHours(
                                0,
                                0,
                                0,
                                0
                            );


                            days =
                                Math.floor(
                                    (
                                        today.getTime() -
                                        parsedDate.getTime()
                                    ) /
                                    (1000 * 60 * 60 * 24)
                                );


                            /*
                             * Срок обработки = 4 месяца.
                             */
                            const dueDate =
                                new Date(
                                    parsedDate
                                );


                            dueDate.setMonth(
                                dueDate.getMonth() + 4
                            );


                            const d =
                                String(
                                    dueDate.getDate()
                                ).padStart(2, '0');


                            const m =
                                String(
                                    dueDate.getMonth() + 1
                                ).padStart(2, '0');


                            const y =
                                dueDate.getFullYear();


                            const sep =
                                currentLang === 'fr'
                                    ? '/'
                                    : '.';


                            dueDateFormatted =
                                `${d}${sep}${m}${sep}${y}`;


                            if (
                                today > dueDate
                            ) {

                                isOverdue = true;
                            }
                        }
                    }


                    /*
                     * Счётчики.
                     *
                     * Жёлтые участки НЕ считаются свободными,
                     * потому что их сейчас нельзя выдавать.
                     */
                    if (isBusy) {

                        if (isOverdue) {

                            overdue++;

                        } else {

                            busy++;
                        }

                    } else if (isWaiting) {

                        waiting++;

                    } else {

                        free++;
                    }


                    /* =================================================
                       ЦВЕТ КАРТОЧКИ
                    ================================================= */

                    let badge = `
                        <span class="px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-emerald-950/60 text-emerald-300 border border-emerald-400/30">
                            ${t('status_free')}
                        </span>
                    `;


                    let cardStyle =
                        "bg-emerald-900/40 border-emerald-500/60 hover:border-emerald-400 shadow-xl shadow-emerald-950/40";


                    /*
                     * СИНИЙ — в обработке.
                     */
                    if (
                        isBusy &&
                        !isOverdue
                    ) {

                        badge = `
                            <span class="px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-blue-950/60 text-blue-300 border border-blue-400/30">
                                ${t('status_busy')}
                                (${days} ${t('days_text')})
                            </span>
                        `;


                        cardStyle =
                            "bg-blue-900/40 border-blue-500/60 hover:border-blue-400 shadow-xl shadow-blue-950/40";
                    }


                    /*
                     * КРАСНЫЙ — просрочен.
                     */
                    if (isOverdue) {

                        badge = `
                            <span class="px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-rose-950/60 text-rose-300 border border-rose-400/30">
                                ${t('status_overdue')}
                                (${days} ${t('days_text')})
                            </span>
                        `;


                        cardStyle =
                            "bg-rose-900/40 border-rose-500/70 hover:border-rose-400 shadow-2xl shadow-rose-950/50";
                    }


                    /*
                     * ЖЁЛТЫЙ — после возврата ещё
                     * не прошёл один год.
                     */
                    if (
                        !isBusy &&
                        isWaiting
                    ) {

                        badge = `
                            <span class="px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-amber-950/70 text-amber-300 border border-amber-400/40">
                                ${t('status_waiting')}
                            </span>
                        `;


                        cardStyle =
                            "bg-amber-900/40 border-amber-500/70 hover:border-amber-400 shadow-xl shadow-amber-950/40";
                    }


                    const ruCount =
                        tObj.russianSpeakers || 0;


                    const card =
                        document.createElement('div');


                    const delay =
                        Math.min(
                            index * 0.04,
                            0.5
                        );


                    card.className =
                        `backdrop-blur-2xl border ${cardStyle} rounded-3xl p-4 md:p-5 flex flex-col justify-between space-y-4 transition-all duration-300 hover:-translate-y-0.5 animate-fade-in`;


                    card.style.animationDelay =
                        `${delay}s`;


                    /* =================================================
                       ИНФОРМАЦИЯ ВНУТРИ КАРТОЧКИ
                    ================================================= */

                    let mainStatusHtml = '';


                    if (isBusy) {

                        mainStatusHtml = `

                            <p class="flex items-center gap-1.5 font-medium">

                                <i class="fa-solid fa-user text-white/80"></i>

                                <strong class="text-white">
                                    ${lastRec.publisher}
                                </strong>

                            </p>


                            <p class="text-[11px] text-slate-300/80">

                                <i class="fa-regular fa-calendar-check mr-1"></i>

                                ${t('due_date_label')}

                                <strong class="${isOverdue ? 'text-rose-400' : 'text-slate-200'}">
                                    ${dueDateFormatted}
                                </strong>

                            </p>
                        `;

                    } else if (isWaiting) {

                        const availableDateString =
                            availableAgainDate
                                ? `${availableAgainDate.getFullYear()}-${String(availableAgainDate.getMonth() + 1).padStart(2, '0')}-${String(availableAgainDate.getDate()).padStart(2, '0')}`
                                : '';


                        mainStatusHtml = `

                            <div class="space-y-2">

                                <p class="flex items-center gap-1.5 font-medium text-amber-200">

                                    <i class="fa-solid fa-hourglass-half text-amber-400"></i>

                                    <strong>
                                        ${t('status_waiting')}
                                    </strong>

                                </p>


                                <p class="text-[11px] text-amber-100/80">

                                    <i class="fa-regular fa-calendar-xmark mr-1"></i>

                                    ${t('last_return_label')}

                                    <strong class="text-amber-200">
                                        ${formatDate(lastCompleted.returnedAt)}
                                    </strong>

                                </p>


                                <p class="text-[11px] text-amber-100/80">

                                    <i class="fa-regular fa-calendar-check mr-1"></i>

                                    ${t('available_again_label')}

                                    <strong class="text-amber-200">
                                        ${formatDate(availableDateString)}
                                    </strong>

                                </p>


                                <div class="mt-2 p-2.5 rounded-xl bg-amber-950/50 border border-amber-400/20">

                                    <p class="text-[11px] text-amber-300 font-semibold">

                                        <i class="fa-solid fa-hourglass-half mr-1"></i>

                                        ${t('waiting_days_label')}

                                        <strong class="text-white">
                                            ${daysUntilAvailable}
                                        </strong>

                                        ${t('days_text')}

                                    </p>

                                </div>

                            </div>
                        `;

                    } else {

                        mainStatusHtml = `

                            <p class="text-slate-300/70 italic">
                                ${t('not_issued')}
                            </p>

                        `;
                    }


                    /*
                     * Кнопка выдачи.
                     */
                    let actionButton = '';


                    if (isBusy) {

                        actionButton = `

                            <button
                                onclick="returnTerritory('${tObj.id}')"
                                class="h-8 px-3.5 bg-black/40 hover:bg-black/60 text-white rounded-xl text-xs font-semibold transition border border-white/20 flex items-center justify-center">

                                ${t('btn_return')}

                            </button>
                        `;

                    } else if (isWaiting) {

                        actionButton = `

                            <button
                                disabled
                                title="${t('cannot_issue_waiting')}"
                                class="h-8 px-3.5 bg-amber-950/50 text-amber-300/60 rounded-xl text-xs font-bold border border-amber-400/20 flex items-center justify-center cursor-not-allowed">

                                <i class="fa-solid fa-lock mr-1.5"></i>

                                ${t('btn_issue')}

                            </button>
                        `;

                    } else {

                        actionButton = `

                            <button
                                onclick="issueTerritory('${tObj.id}')"
                                class="h-8 px-3.5 bg-white text-slate-950 hover:bg-slate-100 rounded-xl text-xs font-bold shadow-lg transition flex items-center justify-center">

                                ${t('btn_issue')}

                            </button>
                        `;
                    }


                    /* =================================================
                       HTML КАРТОЧКИ
                    ================================================= */

                    card.innerHTML = `

                        <div class="flex items-start justify-between gap-2">

                            <div>

                                <span class="text-[10px] text-slate-300/80 font-bold uppercase tracking-wider">

                                    ${t('card_territory')}

                                </span>

                                <h3 class="text-xl font-extrabold text-white tracking-tight">

                                    № ${tObj.number}

                                </h3>

                            </div>


                            ${badge}

                        </div>


                        <div class="space-y-2 text-xs text-slate-200">

                            ${mainStatusHtml}


                            <!-- Русскоговорящие -->

                            <p class="flex items-center gap-1.5 font-medium text-slate-300"
                               title="${t('label_russian_speakers')} ${ruCount}">

                                <i class="fa-solid fa-user-group text-sky-400"></i>

                                <strong class="text-white font-bold">
                                    ${ruCount}
                                </strong>

                            </p>


                            <!-- Карта -->

                            <div class="flex items-center gap-1.5 pt-1">

                                ${tObj.mapUrl ? `

                                    <a
                                        href="${tObj.mapUrl}"
                                        target="_blank"
                                        class="h-8 px-3 bg-black/30 hover:bg-black/50 text-white rounded-xl font-medium flex items-center gap-1.5 transition border border-white/10 shadow-sm text-xs">

                                        <i class="fa-solid fa-map"></i>

                                        ${t('card_map')}

                                    </a>


                                    <button
                                        onclick="copyTerritoryLink('${tObj.mapUrl}')"
                                        title="Скопировать ссылку"
                                        class="w-8 h-8 bg-black/30 hover:bg-black/50 text-white rounded-xl transition border border-white/10 shadow-sm flex items-center justify-center">

                                        <i class="fa-solid fa-copy text-xs"></i>

                                    </button>

                                ` : `

                                    <span class="text-[10px] text-slate-300/70 italic">

                                        ${t('no_map_link')}

                                    </span>

                                `}

                            </div>

                        </div>


                        <!-- Нижняя часть -->

                        <div class="pt-3 border-t border-white/10 flex items-center justify-between gap-2">

                            <div class="flex space-x-1">

                                <button
                                    onclick="openTerritoryMenu('${tObj.id}')"
                                    title="Управление участком"
                                    class="w-8 h-8 bg-black/30 hover:bg-black/50 text-white rounded-xl text-xs transition border border-white/10 flex items-center justify-center">

                                    <i class="fa-solid fa-pen"></i>

                                </button>


                                <button
                                    onclick="showHistory('${tObj.id}')"
                                    title="История"
                                    class="w-8 h-8 bg-black/30 hover:bg-black/50 text-white rounded-xl text-xs transition border border-white/10 flex items-center justify-center">

                                    <i class="fa-solid fa-clock-rotate-left"></i>

                                </button>

                            </div>


                            ${actionButton}

                        </div>

                    `;


                    grid.appendChild(card);

                }
            );


            /*
             * Обновляем статистику.
             */
            document.getElementById(
                'st-free'
            ).innerText = free;


            document.getElementById(
                'st-busy'
            ).innerText = busy;


            document.getElementById(
                'st-overdue'
            ).innerText = overdue;


            document.getElementById(
                'st-waiting'
            ).innerText = waiting;
        }


        /* =========================================================
           АВТОМАТИЧЕСКОЕ ОБНОВЛЕНИЕ СТАТУСОВ

           Раньше все карточки перерисовывались каждую минуту,
           из-за чего создавалось ощущение обновления страницы.

           Теперь интерфейс обновляется только один раз после
           наступления нового календарного дня. Этого достаточно:
           сроки и счётчики в приложении считаются по дням.

           Firebase-данные при этом НЕ меняются.
        ========================================================= */

        let dailyStatusRefreshTimer = null;

        function scheduleDailyStatusRefresh() {

            if (dailyStatusRefreshTimer) {
                clearTimeout(dailyStatusRefreshTimer);
            }

            const now = new Date();
            const nextDay = new Date(now);

            nextDay.setDate(nextDay.getDate() + 1);
            nextDay.setHours(0, 0, 1, 0);

            const delay = Math.max(1000, nextDay.getTime() - now.getTime());

            dailyStatusRefreshTimer = setTimeout(() => {

                if (territoriesData.length > 0) {
                    renderTerritories();
                }

                scheduleDailyStatusRefresh();

            }, delay);
        }

        scheduleDailyStatusRefresh();


        /* =========================================================
           ЗАПУСК
        ========================================================= */

        initApp();

    </script>

</body>
</html>
