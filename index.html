        function formatDate(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                return `${parts[2]}.${parts[1]}.${parts[0]}`;
            }
            return dateStr;
        }

        function parseInputDate(inputStr) {
            if (!inputStr) return null;
            const cleanStr = inputStr.trim();
            if (cleanStr.includes('.')) {
                const parts = cleanStr.split('.');
                if (parts.length === 3) {
                    return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                }
            }
            return cleanStr;
        }

        function getCurrentDateFormatted() {
            const today = new Date();
            const day = String(today.getDate()).padStart(2, '0');
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const year = today.getFullYear();
            return `${year}-${month}-${day}`;
        }

                    "Romans-sur-Isère": ""
                };

                    let existingCity = findCity(cityName);

                        let territoriesList = [];
                        if (cityName === "Valence") territoriesList = valenceTerritories;
                        if (cityName === "Guilherand-Granges") territoriesList = guilherandTerritories;

                        if (cityName === "Tournon-sur-Rhône") territoriesList = tournonTerritories;
                        if (cityName === "Romans-sur-Isère") territoriesList = romansTerritories;

                        const ref = await addDoc(collection(db, "cities"), { name: cityName, mapUrl: mapUrl });
                        for (const item of territoriesList) {
                            await addDoc(collection(db, "territories"), { cityId: ref.id, number: item.number, mapUrl: item.mapUrl || "", isArchived: false, history: item.history });

                        <div class="flex items-center gap-1">
                            <button onclick="editHistoryItem(${index})" title="Редактировать запись" class="w-8 h-8 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-xl transition border border-slate-800 flex items-center justify-center"><i class="fa-solid fa-pen text-xs"></i></button>
                            <button onclick="deleteHistoryItem(${index})" title="Удалить запись" class="w-8 h-8 bg-slate-900 hover:bg-rose-950/40 text-rose-400 rounded-xl transition border border-slate-800 flex items-center justify-center"><i class="fa-solid fa-trash text-xs"></i></button>
                        </div>
                    `;
                    listContainer.appendChild(itemDiv);
                });
            }

            document.getElementById('history-modal').classList.remove('hidden');
            document.getElementById('history-modal').classList.add('flex');
        };

        window.closeHistoryModal = () => {
            currentEditingTerritoryId = null;
            document.getElementById('history-modal').classList.add('hidden');
            document.getElementById('history-modal').classList.remove('flex');
        };

        window.editHistoryItem = async (index) => {
            const tObj = territoriesData.find(item => item.id === currentEditingTerritoryId);
            if (!tObj || !tObj.history[index]) return;
            const h = tObj.history[index];

            const res = await showCustomDialog(`${t('history_title')} #${index + 1}`, [
                { label: t('prompt_edit_publisher'), defaultValue: h.publisher },
                { label: t('prompt_edit_issued_date'), defaultValue: formatDate(h.issuedAt) },
                { label: t('prompt_edit_returned_date'), defaultValue: formatDate(h.returnedAt) }
            ]);

            if (!res) return;

            const newIssuedFormatted = parseInputDate(res[1]);
            const newReturnedFormatted = parseInputDate(res[2]);

            tObj.history[index] = {
                publisher: res[0].trim(),
                issuedAt: newIssuedFormatted || h.issuedAt,
                returnedAt: newReturnedFormatted !== null && newReturnedFormatted !== '' ? newReturnedFormatted : null
            };

            await updateDoc(doc(db, "territories", tObj.id), { history: tObj.history });
            if (currentEditingTerritoryId) window.showHistory(currentEditingTerritoryId);
        };

        window.deleteHistoryItem = async (index) => {
            const tObj = territoriesData.find(item => item.id === currentEditingTerritoryId);
            if (!tObj || !tObj.history[index]) return;

            const confirmed = await showCustomConfirm(`${t('prompt_delete_history')}${index + 1} (${tObj.history[index].publisher})?`);
            if (confirmed) {
                tObj.history.splice(index, 1);
                await updateDoc(doc(db, "territories", tObj.id), { history: tObj.history });
                if (currentEditingTerritoryId) window.showHistory(currentEditingTerritoryId);
            }
        };

        window.copyTerritoryLink = (url) => {
            if (!url) return;
            navigator.clipboard.writeText(url).catch(err => console.error(err));
        };

        function renderCities() {
            const container = document.getElementById('cities-container');
            
            container.innerHTML = '';
            citiesData.forEach(c => {
                const btn = document.createElement('button');
                btn.dataset.cityId = c.id;
                btn.title = c.name;
                btn.innerText = c.name;
                btn.onclick = () => { 
                    if (activeCityId !== c.id) {
                        activeCityId = c.id; 
                        updateActiveCityStyles(); 
                        subscribeToTerritories(); 
                        updateActiveCityMapLink();
                    }
                };
                container.appendChild(btn);
            });
            
            updateActiveCityStyles();
            updateActiveCityMapLink();
        }

        function updateActiveCityMapLink() {
            const activeCity = citiesData.find(c => c.id === activeCityId);
            const mapLinkBtn = document.getElementById('map-link');
            if (activeCity && activeCity.mapUrl && activeCity.mapUrl.trim() !== '' && activeCity.mapUrl !== '#') {
                mapLinkBtn.href = activeCity.mapUrl;
                mapLinkBtn.style.display = 'flex';
            } else {
                mapLinkBtn.style.display = 'none';
            }
        }

        function updateActiveCityStyles() {
            const container = document.getElementById('cities-container');
            Array.from(container.children).forEach(btn => {
                const cId = btn.dataset.cityId;
                const basePill = "h-10 px-3 rounded-xl text-xs font-semibold transition flex items-center justify-center border truncate shadow-sm";
                
                if (cId === activeCityId) {
                    btn.className = `${basePill} bg-indigo-600 text-white border-indigo-500 shadow-indigo-600/30`;
                } else {
                    btn.className = `${basePill} bg-slate-900/90 text-slate-300 hover:text-white hover:bg-slate-800 border-slate-800/80`;
                }
            });
        }

        function renderTerritories() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            let free = 0, busy = 0, overdue = 0;

            territoriesData.forEach((tObj, index) => {
                const lastRec = tObj.history && tObj.history.length > 0 ? tObj.history[tObj.history.length - 1] : null;
                const isBusy = lastRec && !lastRec.returnedAt;
                
                let days = 0, isOverdue = false;
                if (isBusy && lastRec.issuedAt) {
                    const parsedDate = new Date(lastRec.issuedAt);
                    if (!isNaN(parsedDate.getTime())) {
                        days = Math.floor((new Date() - parsedDate) / (1000 * 60 * 60 * 24));
                        if (days > 120) isOverdue = true;
                    }
                }

                if (!isBusy) free++; else if (isOverdue) overdue++; else busy++;

                let badge = `<span class="px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-emerald-950/60 text-emerald-300 border border-emerald-400/30">${t('status_free')}</span>`;
                let cardStyle = "bg-emerald-900/40 border-emerald-500/60 hover:border-emerald-400 shadow-xl shadow-emerald-950/40";
                
                if (isBusy && !isOverdue) {
                    badge = `<span class="px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-blue-950/60 text-blue-300 border border-blue-400/30">${t('status_busy')} (${days} ${t('days_text')})</span>`;
                    cardStyle = "bg-blue-900/40 border-blue-500/60 hover:border-blue-400 shadow-xl shadow-blue-950/40";
                }
                if (isOverdue) {
                    badge = `<span class="px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-rose-950/60 text-rose-300 border border-rose-400/30">${t('status_overdue')} (${days} ${t('days_text')})</span>`;
                    cardStyle = "bg-rose-900/40 border-rose-500/70 hover:border-rose-400 shadow-2xl shadow-rose-950/50";
                }

                const card = document.createElement('div');
                const delay = Math.min(index * 0.04, 0.5);
                card.className = `backdrop-blur-2xl border ${cardStyle} rounded-3xl p-4 md:p-5 flex flex-col justify-between space-y-4 transition-all duration-300 hover:-translate-y-0.5 animate-fade-in`;
                card.style.animationDelay = `${delay}s`;

                card.innerHTML = `
                    <div class="flex items-start justify-between gap-2">
                        <div>
                            <span class="text-[10px] text-slate-300/80 font-bold uppercase tracking-wider">${t('card_territory')}</span>
                            <h3 class="text-xl font-extrabold text-white tracking-tight">№ ${tObj.number}</h3>
                        </div>
                        ${badge}
                    </div>
                    
                    <div class="space-y-2 text-xs text-slate-200">
                        ${isBusy ? `<p class="flex items-center gap-1.5 font-medium"><i class="fa-solid fa-user text-white/80"></i> <strong class="text-white">${lastRec.publisher}</strong></p>` : `<p class="text-slate-300/70 italic">${t('not_issued')}</p>`}
                        
                        <div class="flex items-center gap-1.5 pt-1">
                            ${tObj.mapUrl ? `
                                <a href="${tObj.mapUrl}" target="_blank" class="h-8 px-3 bg-black/30 hover:bg-black/50 text-white rounded-xl font-medium flex items-center gap-1.5 transition border border-white/10 shadow-sm text-xs">
                                    <i class="fa-solid fa-map"></i> ${t('card_map')}
                                </a>
                                <button onclick="copyTerritoryLink('${tObj.mapUrl}')" title="Скопировать ссылку" class="w-8 h-8 bg-black/30 hover:bg-black/50 text-white rounded-xl transition border border-white/10 shadow-sm flex items-center justify-center">
                                    <i class="fa-solid fa-copy text-xs"></i>
                                </button>
                            ` : `
                                <span class="text-[10px] text-slate-300/70 italic">${t('no_map_link')}</span>
                            `}
                        </div>
                    </div>

                    <div class="pt-3 border-t border-white/10 flex items-center justify-between gap-2">
                        <div class="flex space-x-1">
                            <button onclick="openTerritoryMenu('${tObj.id}')" title="Управление участком" class="w-8 h-8 bg-black/30 hover:bg-black/50 text-white rounded-xl text-xs transition border border-white/10 flex items-center justify-center"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="showHistory('${tObj.id}')" title="История и ссылка" class="w-8 h-8 bg-black/30 hover:bg-black/50 text-white rounded-xl text-xs transition border border-white/10 flex items-center justify-center"><i class="fa-solid fa-clock-rotate-left"></i></button>
                        </div>
                        ${!isBusy 
                            ? `<button onclick="issueTerritory('${tObj.id}')" class="h-8 px-3.5 bg-white text-slate-950 hover:bg-slate-100 rounded-xl text-xs font-bold shadow-lg transition flex items-center justify-center">${t('btn_issue')}</button>`
                            : `<button onclick="returnTerritory('${tObj.id}')" class="h-8 px-3.5 bg-black/40 hover:bg-black/60 text-white rounded-xl text-xs font-semibold transition border border-white/20 flex items-center justify-center">${t('btn_return')}</button>`
                        }
                    </div>
                `;
                grid.appendChild(card);
            });

            document.getElementById('st-free').innerText = free;
            document.getElementById('st-busy').innerText = busy;
            document.getElementById('st-overdue').innerText = overdue;
        }

        initApp();
    </script>
</body>
</html>
