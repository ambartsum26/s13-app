<!DOCTYPE html>
<html lang="ru" id="html-root" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ассистент по участкам</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={darkMode:'class'};</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root{
            --bg:#07100e;
            --surface:#0d1815;
            --surface-2:#101e1a;
            --surface-3:#14241f;
            --line:#20372f;
            --muted:#82938d;
            --text:#f6f8f7;
            --acid:#b8ff2c;
            --acid-soft:rgba(184,255,44,.09);
        }
        *{box-sizing:border-box}
        html{background:var(--bg);color-scheme:dark}
        body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 72% -10%,rgba(184,255,44,.07),transparent 32%),linear-gradient(180deg,#07100e,#081310 58%,#060e0c);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
        button,a,input{font:inherit}
        button{cursor:pointer}
        .scrollbar-none::-webkit-scrollbar{display:none}.scrollbar-none{scrollbar-width:none}
        .glass-panel{background:linear-gradient(145deg,rgba(15,29,25,.98),rgba(9,20,17,.97));border:1px solid var(--line);box-shadow:0 18px 60px rgba(0,0,0,.24)}
        .app-shell{width:min(1760px,100%);min-height:100vh;margin:auto;display:grid;grid-template-columns:280px minmax(0,1fr);gap:0}
        #sidebar{min-height:100vh;border-right:1px solid #1b3029;background:linear-gradient(180deg,#0a1512,#07100e);padding:22px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:45}
        .brand{display:flex;align-items:center;gap:12px;padding:4px 6px 26px}
        .brand-mark{width:42px;height:42px;border-radius:12px;background:var(--acid);color:#07100e;display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 10px 32px rgba(184,255,44,.12)}
        #app-title{font-size:13px;line-height:1.15;font-weight:900;letter-spacing:.045em}
        #db-status{font-size:10px;color:#91b980;margin-top:5px;display:flex;align-items:center;gap:6px}
        .nav-stack{display:flex;flex-direction:column;gap:6px}
        .sidebar-btn{width:100%;height:46px;padding:0 13px;border-radius:12px;border:1px solid transparent;background:transparent;color:#93a49e;display:flex;align-items:center;gap:11px;font-size:12px;font-weight:750;transition:.18s ease}
        .sidebar-btn i{width:18px;text-align:center;color:#667c74}
        .sidebar-btn:hover{background:rgba(184,255,44,.07);color:#fff;border-color:rgba(184,255,44,.13);transform:translateX(2px)}
        .sidebar-btn.nav-active{background:rgba(184,255,44,.1);color:var(--acid);border-color:rgba(184,255,44,.23);box-shadow:inset 3px 0 var(--acid)}
        .sidebar-btn.nav-active i{color:var(--acid)}
        #cities-container{margin:6px 0 7px 29px;padding-left:10px;border-left:1px solid #244138;display:flex;flex-direction:column;gap:3px}
        #cities-container.hidden{display:none}
        #cities-container button{min-height:34px;padding:7px 9px;border:1px solid transparent;border-radius:9px;background:transparent;color:#70857d;text-align:left;font-size:11px;font-weight:650;transition:.18s}
        #cities-container button:hover{background:rgba(184,255,44,.08);color:#fff;border-color:rgba(184,255,44,.14)}
        #cities-container button.bg-indigo-600{background:rgba(184,255,44,.09)!important;color:var(--acid)!important;border-color:rgba(184,255,44,.2)!important}
        .sidebar-foot{margin-top:auto;padding:18px 6px 3px;color:#50645d;font-size:10px}
        .mobile-topbar{display:none}
        .content-shell{min-width:0;padding:22px 24px 34px}
        .desktop-topbar{height:58px;display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-bottom:18px}
        [data-language-toggle]{position:relative;width:88px;height:38px;border-radius:11px;border:1px solid #294239;background:#091411;padding:4px;display:flex;align-items:center;justify-content:space-between;overflow:hidden}
        #lang-slider{position:absolute;inset:4px auto 4px 4px;width:calc(50% - 4px);border-radius:8px;background:var(--acid)!important;transition:.25s;box-shadow:none!important}
        [data-language-toggle] span{position:relative;z-index:1;width:50%;text-align:center;font-size:10px;font-weight:850;color:#9cb0a9}[data-language-toggle] span:first-of-type{color:#07100e}
        main{min-width:0}
        main>section{animation:screenIn .22s ease}
        @keyframes screenIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
        button:not([data-language-toggle]),a#map-link,a.mini-btn,.copy-map-btn{border:1px solid #315047!important;background:transparent!important;color:#dce7e3!important;box-shadow:none!important;transition:.18s ease!important}
        button:not([data-language-toggle]):not(:disabled):hover,a#map-link:hover,a.mini-btn:hover,.copy-map-btn:hover{background:var(--acid)!important;border-color:var(--acid)!important;color:#07100e!important;box-shadow:0 12px 28px rgba(184,255,44,.12)!important;transform:translateY(-1px)}
        button:disabled{opacity:.35!important;cursor:not-allowed}
        .square-btn,.copy-map-btn{width:32px;height:32px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center}.mini-btn,.action-btn{height:32px;padding:0 11px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:750}
        #home-page{min-height:0!important}
        #home-page .glass-panel{border-radius:18px!important;background:linear-gradient(145deg,#0d1a17,#091512)!important;border-color:#1e362e!important}
        #home-page section.grid>div.glass-panel{min-height:108px;padding:17px!important}
        #home-page section.flex>button{background:#0b1714!important;border-color:#28443a!important;border-radius:14px!important}
        #home-page section.flex>button:hover{background:rgba(184,255,44,.1)!important;color:#fff!important;border-color:rgba(184,255,44,.3)!important}
        #city-controls{border-radius:18px!important;padding:17px 18px!important;margin-bottom:13px;background:transparent!important;border:none!important;box-shadow:none!important}
        #active-city-title{font-size:25px!important;line-height:1.05;font-weight:900!important;letter-spacing:-.025em}
        #city-controls>div:last-child{align-items:center}
        #city-menu{background:#101d19!important;border:1px solid #2a463c!important;border-radius:14px!important;padding:6px!important;box-shadow:0 26px 70px rgba(0,0,0,.48)!important}
        #city-menu button{border:0!important;width:100%;justify-content:flex-start!important;text-align:left!important;padding:10px 11px!important;border-radius:9px!important}
        #territories-page>section.glass-panel{border-radius:17px!important;padding:14px!important;margin-bottom:15px}
        #territories-page>section.glass-panel>div:first-child{display:grid!important;grid-template-columns:repeat(4,minmax(110px,1fr));gap:8px!important;flex:1}
        #territories-page>section.glass-panel>div:first-child>div{height:62px!important;border-radius:12px!important;padding:10px 12px!important;background:#0a1512!important;box-shadow:none!important}
        #territories-page>section.glass-panel>div:first-child>div>div:first-child{width:30px!important;height:30px!important;border-radius:9px!important}
        #grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px!important}
        #grid>article{min-height:230px!important;border-radius:16px!important;padding:15px!important;box-shadow:0 15px 34px rgba(0,0,0,.18)!important;position:relative;overflow:hidden;transition:.2s ease!important}
        #grid>article:hover{transform:translateY(-3px)!important;box-shadow:0 22px 44px rgba(0,0,0,.28)!important}
        #grid>article[class*="bg-emerald-900"]{background:#10241c!important;border-color:#2d7553!important}
        #grid>article[class*="bg-blue-900"]{background:#101f31!important;border-color:#315f91!important}
        #grid>article[class*="bg-rose-900"]{background:#291417!important;border-color:#8b3d48!important}
        #grid>article[class*="bg-amber-900"]{background:#2a2312!important;border-color:#8b7436!important}
        #grid>article h3{font-size:28px!important;line-height:1!important;letter-spacing:-.035em}
        #grid>article .badge{font-size:9px!important;padding:5px 8px!important;border-radius:7px!important;background:rgba(5,12,10,.35)!important}
        #publishers-page{max-width:980px}
        #publishers-page>.glass-panel{border-radius:18px!important;padding:18px!important;margin-bottom:12px}
        #publishers-title{font-size:24px!important;font-weight:900!important;letter-spacing:-.02em}
        #publishers-search,#publisher-picker-search,#dialog-fields input{height:44px!important;background:#08120f!important;border:1px solid #294239!important;border-radius:11px!important;color:#eff6f3!important;outline:none!important}
        #publishers-search:focus,#publisher-picker-search:focus,#dialog-fields input:focus{border-color:var(--acid)!important;box-shadow:0 0 0 3px rgba(184,255,44,.07)!important}
        #publishers-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px!important}
        #publishers-list>div{min-height:58px;background:#0c1815!important;border:1px solid #213a32!important;border-radius:13px!important;padding:11px 12px!important;box-shadow:none!important}
        #publishers-list>div:hover{background:#10201b!important;border-color:rgba(184,255,44,.28)!important}
        #dialog-modal,#confirm-modal,#history-modal,#publisher-picker-modal{background:rgba(3,8,7,.82)!important;backdrop-filter:blur(12px)!important}
        #dialog-modal>.glass-panel,#confirm-modal>.glass-panel,#history-modal>.glass-panel,#publisher-picker-modal>.glass-panel{background:linear-gradient(180deg,#101e1a,#091411)!important;border:1px solid #2a453b!important;border-radius:18px!important;box-shadow:0 30px 90px rgba(0,0,0,.55)!important}
        #history-list>div{background:#0a1512!important;border:1px solid #203830!important;border-radius:12px!important}
        #publisher-picker-list button{border-radius:11px!important;background:#0a1512!important;border-color:#213a32!important}
        .animate-fade-in{opacity:0;animation:cardIn .35s ease forwards}@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
        ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:#07100e}::-webkit-scrollbar-thumb{background:#29443a;border:2px solid #07100e;border-radius:99px}
        @media(max-width:1280px){.app-shell{grid-template-columns:245px minmax(0,1fr)}#grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
        @media(max-width:1023px){
            body{padding:0 0 env(safe-area-inset-bottom)}
            .app-shell{display:block;min-height:100vh}
            .desktop-topbar{display:none}
            .mobile-topbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;position:sticky;top:0;z-index:55;background:rgba(7,16,14,.92);backdrop-filter:blur(16px);border-bottom:1px solid #1c312a}
            .mobile-left{display:flex;align-items:center;gap:9px}.mobile-logo{width:36px;height:36px;border-radius:10px;background:var(--acid);color:#07100e;display:flex;align-items:center;justify-content:center}.mobile-name{font-size:11px;font-weight:900;letter-spacing:.035em}
            #sidebar{display:none;position:fixed;z-index:70;top:0;left:0;bottom:0;width:min(84vw,320px);height:100vh;min-height:100vh;padding:18px 16px;box-shadow:30px 0 90px rgba(0,0,0,.55);transform:translateX(-104%);transition:transform .2s ease}
            #sidebar.mobile-open{display:flex!important;transform:translateX(0)}
            #sidebar.mobile-open::after{content:"";position:fixed;left:100%;top:0;width:100vw;height:100vh;background:rgba(0,0,0,.55);pointer-events:none}
            .content-shell{padding:14px 12px 24px}
            #home-page{display:flex;flex-direction:column;gap:12px!important}
            #home-page section.grid.grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}
            #home-page section.grid.grid-cols-2>div{min-height:88px!important;padding:13px!important;border-radius:14px!important}
            #home-page section.grid.xl\:grid-cols-2{grid-template-columns:1fr!important;gap:10px!important}
            #home-page section.flex{margin-right:-12px;padding-right:12px;gap:8px!important}
            #home-page section.flex>button{min-width:145px!important;padding:10px 11px!important}
            #city-controls{padding:7px 2px 12px!important;margin:0!important;align-items:center!important}
            #active-city-title{font-size:21px!important}
            #city-controls>div:last-child{margin-left:auto;width:auto!important}
            #territories-page>section.glass-panel{padding:10px!important;border-radius:14px!important}
            #territories-page>section.glass-panel>div:first-child{grid-template-columns:repeat(2,minmax(0,1fr));width:100%}
            #territories-page>section.glass-panel>div:last-child{width:100%;justify-content:flex-end;margin-top:5px}
            #grid{grid-template-columns:1fr!important;gap:10px!important}
            #grid>article{min-height:0!important;border-radius:14px!important;padding:14px!important}
            #publishers-page{max-width:none}
            #publishers-page>.glass-panel{padding:14px!important;border-radius:14px!important}
            #publishers-list{grid-template-columns:1fr!important}
            #dialog-modal,#confirm-modal,#history-modal,#publisher-picker-modal{padding:12px!important}
            #dialog-modal>.glass-panel,#confirm-modal>.glass-panel,#history-modal>.glass-panel,#publisher-picker-modal>.glass-panel{width:100%!important;max-width:none!important;max-height:calc(100vh - 24px)!important;border-radius:16px!important}
        }
        @media(max-width:520px){
            .mobile-name{display:none}
            [data-language-toggle]{width:76px;height:36px}
            #home-page section.grid.grid-cols-2>div .text-2xl{font-size:1.3rem!important}
            #territories-page>section.glass-panel>div:first-child>div{min-width:0!important;padding:9px!important}
            #grid>article h3{font-size:25px!important}
        }
    </style>
</head>
<body>
    <div class="mobile-topbar">
        <div class="mobile-left">
            <button onclick="toggleMobileSidebar()" aria-label="Меню" class="w-9 h-9 rounded-xl"><i class="fa-solid fa-bars"></i></button>
            <div class="mobile-logo"><i class="fa-solid fa-location-dot"></i></div>
            <div class="mobile-name">S13 TERRITORY</div>
        </div>
        <button data-language-toggle onclick="toggleLanguage()" title="Сменить язык / Changer de langue">
            <div id="lang-slider" class="bg-emerald-500"></div><span>RU</span><span>FR</span>
        </button>
    </div>

    <div class="app-shell">
        <aside id="sidebar">
            <div class="brand">
                <div class="brand-mark"><i class="fa-solid fa-location-dot"></i></div>
                <div class="min-w-0"><h1 id="app-title">АССИСТЕНТ ПО УЧАСТКАМ</h1><p id="db-status"><span class="w-2 h-2 rounded-full bg-emerald-400"></span>Подключение...</p></div>
            </div>
            <nav class="nav-stack">
                <button id="nav-home" onclick="showHomePage()" class="sidebar-btn"><i class="fa-solid fa-house"></i><span id="nav-home-label">Главная</span></button>
                <div>
                    <button id="nav-territories" onclick="toggleTerritoriesMenu()" class="sidebar-btn"><i class="fa-solid fa-map-location-dot"></i><span id="nav-territories-label" class="flex-1 text-left">Участки</span><i id="territory-chevron" class="fa-solid fa-chevron-down text-[9px] transition-transform"></i></button>
                    <div id="cities-container" class="hidden"></div>
                </div>
                <button id="nav-publishers" onclick="showPublishersPage()" class="sidebar-btn"><i class="fa-solid fa-users"></i><span id="nav-publishers-label">Возвещатели</span></button>
            </nav>
            <div class="sidebar-foot">S-13 · Territory assistant</div>
        </aside>

        <div class="content-shell">
            <div class="desktop-topbar">
                <button data-language-toggle onclick="toggleLanguage()" title="Сменить язык / Changer de langue">
                    <div id="lang-slider" class="bg-emerald-500"></div><span>RU</span><span>FR</span>
                </button>
            </div>

            <main>
                <section id="home-page"></section>

                <section id="territories-page" class="hidden">
                    <div id="city-controls" class="hidden flex-wrap items-center justify-between gap-3">
                        <div class="min-w-0"><p class="hidden">Текущий город</p><h2 id="active-city-title"></h2></div>
                        <div class="flex gap-2">
                            <button onclick="addCity()" class="h-10 px-3 rounded-xl text-xs font-bold"><i class="fa-solid fa-plus mr-1.5"></i><span id="btn-add-city-label">Город</span></button>
                            <div id="city-menu-wrap" class="relative">
                                <button onclick="editCityMenu()" class="h-10 w-10 rounded-xl"><i class="fa-solid fa-pen"></i><span id="btn-edit-city-label" class="hidden">Изменить город</span></button>
                                <div id="city-menu" class="hidden absolute right-0 w-64 text-xs z-50">
                                    <button onclick="renameCity();editCityMenu()"><i class="fa-solid fa-signature w-5 mr-1"></i>Название</button>
                                    <button onclick="editCityMap();editCityMenu()"><i class="fa-solid fa-earth-americas w-5 mr-1"></i>Ссылка на карту</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <section class="glass-panel flex flex-wrap items-center justify-between gap-3">
                        <div class="text-xs">
                            <div class="flex items-center gap-2 border border-emerald-500/20"><div class="bg-emerald-500/15 text-emerald-400 flex items-center justify-center"><i class="fa-solid fa-circle-check text-[10px]"></i></div><div><span id="stat-free-label" class="text-[9px] block uppercase tracking-wider text-slate-400">Свободно</span><b id="st-free" class="text-emerald-400 text-lg">0</b></div></div>
                            <div class="flex items-center gap-2 border border-blue-500/20"><div class="bg-blue-500/15 text-blue-400 flex items-center justify-center"><i class="fa-solid fa-clock text-[10px]"></i></div><div><span id="stat-busy-label" class="text-[9px] block uppercase tracking-wider text-slate-400">В обработке</span><b id="st-busy" class="text-blue-400 text-lg">0</b></div></div>
                            <div class="flex items-center gap-2 border border-rose-500/20"><div class="bg-rose-500/15 text-rose-400 flex items-center justify-center"><i class="fa-solid fa-triangle-exclamation text-[10px]"></i></div><div><span id="stat-overdue-label" class="text-[9px] block uppercase tracking-wider text-slate-400">Просрочено</span><b id="st-overdue" class="text-rose-400 text-lg">0</b></div></div>
                            <div class="flex items-center gap-2 border border-amber-500/20"><div class="bg-amber-500/15 text-amber-400 flex items-center justify-center"><i class="fa-solid fa-hourglass-half text-[10px]"></i></div><div><span id="stat-waiting-label" class="text-[9px] block uppercase tracking-wider text-slate-400">Ожидание</span><b id="st-waiting" class="text-amber-400 text-lg">0</b></div></div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="exportOfficialRegister()" title="S-13" class="w-10 h-10 rounded-xl"><i class="fa-solid fa-download"></i></button>
                            <a id="map-link" href="#" target="_blank" class="h-10 px-3 rounded-xl text-xs font-bold items-center gap-1.5"><i class="fa-solid fa-map-location-dot"></i><span id="map-label">Карта</span></a>
                            <button onclick="addTerritory()" class="h-10 px-3 rounded-xl text-xs font-bold"><i class="fa-solid fa-plus mr-1.5"></i><span id="add-territory-label">Участок</span></button>
                        </div>
                    </section>
                    <section id="grid"></section>
                </section>

                <section id="publishers-page" class="hidden">
                    <div class="glass-panel">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                            <div><p class="hidden">База данных</p><h2 id="publishers-title">Возвещатели</h2><p class="hidden"><span id="publishers-count">0</span> <span id="pub-base-label">в базе</span></p></div>
                            <button onclick="addPublisher()" class="h-10 px-3 rounded-xl text-xs font-bold"><i class="fa-solid fa-user-plus mr-1.5"></i><span id="publisher-add-label">Добавить</span></button>
                        </div>
                        <div class="relative"><i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i><input id="publishers-search" oninput="renderPublishers()" class="w-full pl-9 pr-3 text-xs" placeholder="Поиск"></div>
                    </div>
                    <div id="publishers-list" class="mt-3"></div>
                </section>
            </main>
        </div>
    </div>

    <div id="dialog-modal" class="fixed inset-0 hidden items-center justify-center p-4 z-[70]"><div class="glass-panel max-w-md w-full p-5"><div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-800/80"><h3 id="dialog-title" class="font-bold"></h3><button onclick="closeDialog(false)" class="square-btn"><i class="fa-solid fa-xmark"></i></button></div><div id="dialog-fields" class="space-y-3"></div><div class="flex justify-end gap-2 mt-5 pt-4 border-t border-slate-800/80"><button onclick="closeDialog(false)" class="h-10 px-4 rounded-xl text-xs">Отмена</button><button onclick="closeDialog(true)" class="h-10 px-5 rounded-xl text-xs font-bold">ОК</button></div></div></div>
    <div id="confirm-modal" class="fixed inset-0 hidden items-center justify-center p-4 z-[80]"><div class="glass-panel max-w-sm w-full p-5"><div class="w-10 h-10 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 flex items-center justify-center mb-4"><i class="fa-solid fa-triangle-exclamation"></i></div><p id="confirm-text" class="text-sm text-slate-200 mb-5 leading-relaxed"></p><div class="flex justify-end gap-2"><button onclick="closeConfirm(false)" class="h-10 px-4 rounded-xl text-xs">Отмена</button><button onclick="closeConfirm(true)" class="h-10 px-4 rounded-xl text-xs font-bold">Подтвердить</button></div></div></div>
    <div id="history-modal" class="fixed inset-0 hidden items-center justify-center p-4 z-[70]"><div class="glass-panel max-w-lg w-full p-5"><div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-800/80"><h3 id="history-title" class="font-bold"></h3><button onclick="closeHistory()" class="square-btn"><i class="fa-solid fa-xmark"></i></button></div><div id="history-list" class="space-y-2 max-h-[60vh] overflow-y-auto pr-1"></div></div></div>
    <div id="publisher-picker-modal" class="fixed inset-0 hidden items-center justify-center p-4 z-[80]"><div class="glass-panel max-w-md w-full p-5"><div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-800/80"><h3 id="publisher-picker-title" class="font-bold">Возвещатель</h3><button onclick="closePicker()" class="square-btn"><i class="fa-solid fa-xmark"></i></button></div><div class="relative mb-3"><i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i><input id="publisher-picker-search" oninput="renderPicker()" class="w-full pl-9 pr-3 text-xs" placeholder="Поиск"></div><div id="publisher-picker-list" class="space-y-2 max-h-[52vh] overflow-y-auto pr-1"></div></div></div>

    <script type="module" src="./app.js"></script>
    <script>
    (function(){
        const grid=document.getElementById('grid');if(!grid)return;
        async function copyText(text){if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return}const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}
        function enhance(){[...grid.querySelectorAll(':scope > article')].forEach((card,i)=>{if(!card.classList.contains('animate-fade-in')){card.classList.add('animate-fade-in');card.style.animationDelay=`${Math.min(i*.045,.5)}s`}});grid.querySelectorAll('a.mini-btn[href]').forEach(a=>{const w=a.parentElement;if(!w)return;w.classList.add('flex','items-center','gap-1.5','flex-wrap');let b=w.querySelector('.copy-map-btn');if(!b){b=document.createElement('button');b.type='button';b.className='copy-map-btn';b.innerHTML='<i class="fa-solid fa-copy text-xs"></i>';w.appendChild(b);b.addEventListener('click',async()=>{try{await copyText(a.href);b.innerHTML='<i class="fa-solid fa-check text-xs"></i>';setTimeout(()=>b.innerHTML='<i class="fa-solid fa-copy text-xs"></i>',1000)}catch(e){console.error(e)}})}b.title=document.documentElement.lang==='fr'?'Copier le lien':'Скопировать ссылку'})}
        new MutationObserver(enhance).observe(grid,{childList:true,subtree:true});enhance();
    })();
    </script>
