        function formatDate(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            return parts.length === 3 ? `${parts[2]}.${parts[1]}.${parts[0]}` : dateStr;
        }

        function parseInputDate(inputStr) {
            if (!inputStr) return null;
            const cleanStr = inputStr.trim();
            if (cleanStr.includes('.')) {
                const parts = cleanStr.split('.');
                if (parts.length === 3) return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
            }
            return cleanStr;
        }

        function getCurrentDateFormatted() {
            const today = new Date();
            return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

        function t(key) { return translations[currentLang][key] || key; }

        window.toggleLanguage = () => {
            currentLang = currentLang === 'ru' ? 'fr' : 'ru';
            document.getElementById('html-root').lang = currentLang;
            const slider = document.getElementById('lang-slider');
            if (currentLang === 'fr') {
                slider.classList.remove('translate-x-0', 'bg-emerald-500');
                slider.classList.add('translate-x-[calc(100%+4px)]', 'bg-rose-500');
            } else {
                slider.classList.remove('translate-x-[calc(100%+4px)]', 'bg-rose-500');
                slider.classList.add('translate-x-0', 'bg-emerald-500');
            }
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang][key]) el.innerText = translations[currentLang][key];
            });
            if (citiesData.length > 0) renderCities();
            if (territoriesData.length > 0) renderTerritories();
        };

            isAdmin = !!user;
            document.querySelectorAll(".admin-only").forEach(el => el.classList.toggle("hidden", !isAdmin));

            document.getElementById("logout-btn").classList.toggle("hidden", !isAdmin);

            if (citiesData.length === 0) {
                initApp();
            } else {
                renderTerritories();
            }
        });

        async function initApp() {
            try {
                const citiesSnapshot = await getDocs(collection(db, "cities"));
                citiesData = citiesSnapshot.docs.map(d => ({ id: d.id, ...d.data() }));

                document.getElementById('db-status').innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> ${t('db_connected').replace('● ', '')}`;

                if (citiesData.length > 0) {
                    activeCityId = citiesData[0].id;
                    renderCities();
                    subscribeToTerritories();
                }

                onSnapshot(collection(db, "cities"), (snapshot) => {
                    citiesData = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    renderCities();
                });
            } catch (error) {
                console.error("Firebase Auth/DB Error:", error);
                document.getElementById('db-status').innerHTML = '<span class="w-2 h-2 rounded-full bg-rose-500"></span> Ошибка подключения';
            }
        }

        let unsubscribeTerritories = null;
        function subscribeToTerritories() {
            if (unsubscribeTerritories) unsubscribeTerritories();
            if (!activeCityId) return;

            const q = query(collection(db, "territories"), where("cityId", "==", activeCityId));
            unsubscribeTerritories = onSnapshot(q, (snapshot) => {
                territoriesData = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                territoriesData.sort((a, b) => parseInt(a.number) - parseInt(b.number) || a.number.localeCompare(b.number));
                renderTerritories();
            }, (error) => {
                console.error("Firestore Listen Error:", error);
            });
        }

        // Авторизация
        window.handleLogin = async () => {
            const res = await showCustomDialog(t('btn_login'), [
                { label: t('prompt_login_email'), placeholder: 'admin@example.com' },
                { label: t('prompt_login_password'), type: 'password' }
            ]);
            if (!res || !res[0] || !res[1]) return;
            try {
                await signInWithEmailAndPassword(auth, res[0].trim(), res[1].trim());
            } catch (err) {
                alert("Ошибка входа: " + err.message);
            }
        };

        window.handleLogout = async () => {
            try { await signOut(auth); } catch (err) { console.error(err); }
        };

        // UI Диалоги
        let customDialogResolver = null;
        function showCustomDialog(title, fields) {
            return new Promise((resolve) => {
                customDialogResolver = resolve;
                document.getElementById('custom-dialog-title').innerText = title;
                const fieldsContainer = document.getElementById('custom-dialog-fields');
                fieldsContainer.innerHTML = '';

                fields.forEach((f, idx) => {
                    const fieldWrapper = document.createElement('div');
                    fieldWrapper.className = 'space-y-1';
                    fieldWrapper.innerHTML = `
                        <label class="text-[10px] text-slate-400 font-bold uppercase tracking-wider block">${f.label}</label>
                        <input type="${f.type || 'text'}" id="custom-field-${idx}" value="${f.defaultValue || ''}" placeholder="${f.placeholder || ''}" class="w-full h-10 bg-slate-950 border border-slate-800 rounded-xl px-3 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 transition shadow-inner">
                    `;
                    fieldsContainer.appendChild(fieldWrapper);
                });

                document.getElementById('custom-dialog-modal').classList.remove('hidden');
                document.getElementById('custom-dialog-modal').classList.add('flex');
            });
        }

        window.closeCustomDialog = (isSuccess) => {
            document.getElementById('custom-dialog-modal').classList.add('hidden');
            document.getElementById('custom-dialog-modal').classList.remove('flex');
            if (!customDialogResolver) return;
            if (!isSuccess) {
                customDialogResolver(null);
            } else {
                const inputs = document.querySelectorAll('#custom-dialog-fields input');
                customDialogResolver(Array.from(inputs).map(inp => inp.value));
            }
            customDialogResolver = null;
        };

        let customConfirmResolver = null;
        function showCustomConfirm(message) {
            return new Promise((resolve) => {
                customConfirmResolver = resolve;
                document.getElementById('custom-confirm-message').innerText = message;
                document.getElementById('custom-confirm-modal').classList.remove('hidden');
                document.getElementById('custom-confirm-modal').classList.add('flex');
            });
        }

        window.closeCustomConfirm = (result) => {
            document.getElementById('custom-confirm-modal').classList.add('hidden');
            document.getElementById('custom-confirm-modal').classList.remove('flex');
            if (customConfirmResolver) customConfirmResolver(result);
            customConfirmResolver = null;
        };

        // Операции с базой данных (с защитой try...catch)
        window.addCity = async () => {
            if (!isAdmin) return;
            const res = await showCustomDialog(t('btn_city'), [
                { label: t('prompt_new_city') },
                { label: t('prompt_new_city_map') }
            ]);
            if (!res || !res[0]?.trim()) return;
            try {
                await addDoc(collection(db, "cities"), { name: res[0].trim(), mapUrl: res[1]?.trim() || '#' });
            } catch (e) { alert("Ошибка при добавлении: " + e.message); }
        };

        window.addTerritory = async () => {
            if (!isAdmin || !activeCityId) return;
            const res = await showCustomDialog(t('btn_territory'), [
                { label: t('prompt_new_territory_num') },
                { label: t('prompt_new_territory_map') }
            ]);
            if (!res || !res[0]?.trim()) return;
            try {
                await addDoc(collection(db, "territories"), {
                    cityId: activeCityId,
                    number: res[0].trim(),
                    mapUrl: res[1]?.trim() || '',
                    russianCount: 0,
                    history: []
                });
            } catch (e) { alert("Ошибка сохранения: " + e.message); }
        };

        window.issueTerritory = async (id) => {
            if (!isAdmin) return;
            const tObj = territoriesData.find(item => item.id === id);
            if (!tObj) return;
            const res = await showCustomDialog(`${t('btn_issue')} №${tObj.number}`, [{ label: t('prompt_publisher_name') }]);
            if (!res || !res[0]?.trim()) return;
            
            try {
                const history = [...(tObj.history || []), { publisher: res[0].trim(), issuedAt: getCurrentDateFormatted(), returnedAt: null }];
                await updateDoc(doc(db, "territories", id), { history });
            } catch (e) { alert("Недостаточно прав для операции."); }
        };

        window.returnTerritory = async (id) => {
            if (!isAdmin) return;
            const tObj = territoriesData.find(item => item.id === id);
            if (!tObj || !tObj.history?.length) return;
            try {
                const history = [...tObj.history];
                history[history.length - 1].returnedAt = getCurrentDateFormatted();
                await updateDoc(doc(db, "territories", id), { history });
            } catch (e) { alert("Ошибка обновления записи."); }
        };

        // Отрисовка
        function renderCities() {
            const container = document.getElementById('cities-container');
            container.innerHTML = '';
            citiesData.forEach(c => {
                const btn = document.createElement('button');
                btn.className = `h-10 px-3 rounded-xl text-xs font-semibold transition flex items-center justify-center border truncate shadow-sm ${c.id === activeCityId ? 'bg-indigo-600 text-white border-indigo-500 shadow-indigo-600/30' : 'bg-slate-900/90 text-slate-300 hover:text-white border-slate-800/80'}`;
                btn.innerText = c.name;
                btn.onclick = () => {
                    activeCityId = c.id;
                    renderCities();
                    subscribeToTerritories();
                };
                container.appendChild(btn);
            });
            const activeCity = citiesData.find(c => c.id === activeCityId);
            const mapBtn = document.getElementById('map-link');
            if (activeCity?.mapUrl && activeCity.mapUrl !== '#') {
                mapBtn.href = activeCity.mapUrl;
                mapBtn.style.display = 'flex';
            } else {
                mapBtn.style.display = 'none';
            }
        }

        function renderTerritories() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            let free = 0, busy = 0, overdue = 0;

            territoriesData.forEach((tObj) => {
                const lastRec = tObj.history && tObj.history.length > 0 ? tObj.history[tObj.history.length - 1] : null;
                const isBusy = lastRec && !lastRec.returnedAt;
                
                let days = 0, isOverdue = false;
                if (isBusy && lastRec.issuedAt) {
                    const parsedDate = new Date(lastRec.issuedAt);
                    if (!isNaN(parsedDate.getTime())) {
                        days = Math.floor((new Date() - parsedDate) / (1000 * 60 * 60 * 24));
                        if (days > 120) isOverdue = true;
                    }
                }

                if (!isBusy) free++; else if (isOverdue) overdue++; else busy++;

                let badge = `<span class="px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-emerald-950/60 text-emerald-300 border border-emerald-400/30">${t('status_free')}</span>`;
                let cardStyle = "bg-emerald-900/40 border-emerald-500/60 hover:border-emerald-400 shadow-xl";
                
                if (isBusy && !isOverdue) {
                    badge = `<span class="px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-blue-950/60 text-blue-300 border border-blue-400/30">${t('status_busy')} (${days} ${t('days_text')})</span>`;
                    cardStyle = "bg-blue-900/40 border-blue-500/60 hover:border-blue-400 shadow-xl";
                }
                if (isOverdue) {
                    badge = `<span class="px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-rose-950/60 text-rose-300 border border-rose-400/30">${t('status_overdue')} (${days} ${t('days_text')})</span>`;
                    cardStyle = "bg-rose-900/40 border-rose-500/70 hover:border-rose-400 shadow-2xl";
                }

                const card = document.createElement('div');
                card.className = `backdrop-blur-2xl border ${cardStyle} rounded-3xl p-4 md:p-5 flex flex-col justify-between space-y-4 transition-all duration-300 hover:-translate-y-0.5 animate-fade-in`;
                card.innerHTML = `
                    <div class="flex items-start justify-between gap-2">
                        <div>
                            <span class="text-[10px] text-slate-300/80 font-bold uppercase tracking-wider">${t('card_territory')}</span>
                            <h3 class="text-xl font-extrabold text-white tracking-tight">№ ${tObj.number}</h3>
                        </div>
                        ${badge}
                    </div>
                    <div class="space-y-2 text-xs text-slate-200">
                        ${isBusy ? `<p class="flex items-center gap-1.5 font-medium"><i class="fa-solid fa-user text-white/80"></i> <strong class="text-white">${lastRec.publisher}</strong></p>` : `<p class="text-slate-300/70 italic">${t('not_issued')}</p>`}
                        <div class="flex items-center justify-between gap-1.5 pt-1">
                            ${tObj.mapUrl ? `<a href="${tObj.mapUrl}" target="_blank" class="h-8 px-3 bg-black/30 text-white rounded-xl font-medium flex items-center gap-1.5 transition border border-white/10 text-xs"><i class="fa-solid fa-map"></i> ${t('card_map')}</a>` : `<span class="text-[10px] text-slate-300/70 italic">${t('no_map_link')}</span>`}
                            <span class="text-[11px] text-sky-400 font-semibold bg-sky-950/40 px-2 py-1 rounded-lg border border-sky-500/20"><i class="fa-solid fa-user mr-1 text-[10px]"></i>${tObj.russianCount || 0}</span>
                        </div>
                    </div>
                    <div class="pt-3 border-t border-white/10 flex items-center justify-between gap-2">
                        <button onclick="showHistory('${tObj.id}')" title="История" class="w-8 h-8 bg-black/30 text-white rounded-xl text-xs transition border border-white/10 flex items-center justify-center"><i class="fa-solid fa-clock-rotate-left"></i></button>
                        ${isAdmin ? (!isBusy ? `<button onclick="issueTerritory('${tObj.id}')" class="h-8 px-3.5 bg-white text-slate-950 rounded-xl text-xs font-bold shadow-lg flex items-center justify-center">${t('btn_issue')}</button>` : `<button onclick="returnTerritory('${tObj.id}')" class="h-8 px-3.5 bg-black/40 text-white rounded-xl text-xs font-semibold border border-white/20 flex items-center justify-center">${t('btn_return')}</button>`) : ''}
                    </div>
                `;
                grid.appendChild(card);
            });

            document.getElementById('st-free').innerText = free;
            document.getElementById('st-busy').innerText = busy;
            document.getElementById('st-overdue').innerText = overdue;
        }

        window.showHistory = (id) => {
            currentEditingTerritoryId = id;
            const tObj = territoriesData.find(item => item.id === id);
            if (!tObj) return;

            document.getElementById('modal-title').innerText = `${t('history_modal_title')} №${tObj.number}`;
            const listContainer = document.getElementById('modal-history-list');
            listContainer.innerHTML = tObj.history?.length ? '' : `<p class="text-xs text-slate-400 italic py-2">${t('history_empty')}</p>`;

            tObj.history?.forEach((h, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'bg-slate-950/80 border border-slate-800 p-2.5 rounded-2xl flex items-center justify-between gap-2 text-xs';
                itemDiv.innerHTML = `
                    <div>
                        <p class="font-bold text-white"><span class="text-indigo-400">#${index + 1}</span> ${h.publisher}</p>
                        <p class="text-slate-400 text-[11px]">${t('issued_by')} ${formatDate(h.issuedAt)} | ${t('returned_by')} ${formatDate(h.returnedAt) || t('in_progress')}</p>
                    </div>
                `;
                listContainer.appendChild(itemDiv);
            });

            document.getElementById('history-modal').classList.remove('hidden');
            document.getElementById('history-modal').classList.add('flex');
        };

        window.closeHistoryModal = () => {
            document.getElementById('history-modal').classList.add('hidden');
            document.getElementById('history-modal').classList.remove('flex');
        };
    </script>
</body>
</html>
