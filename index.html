<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учёт территорий - Автоматическая база данных</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans p-4 md:p-6">

    <!-- ВЕРХНЯЯ ПАНЕЛЬ: Управление городами -->
    <header class="max-w-6xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-6 shadow-xl flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-indigo-600/30">
                <i class="fa-solid fa-folder-tree"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight">Учёт Участков (Firebase)</h1>
                <p class="text-xs text-emerald-400 font-medium" id="db-status">● Подключение к базе данных...</p>
            </div>
        </div>

        <!-- Список городов (папки) -->
        <div class="flex items-center gap-2 overflow-x-auto py-1" id="cities-container"></div>

        <!-- Кнопки управления -->
        <div class="flex items-center gap-2">
            <button onclick="addCity()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-lg border border-slate-700 transition">
                <i class="fa-solid fa-folder-plus text-indigo-400 mr-1"></i> Новый город
            </button>
            
            <div class="relative">
                <button onclick="toggleCityMenu(event)" title="Настройки города" class="p-2 bg-slate-800 hover:bg-slate-700 text-xs rounded-lg border border-slate-700 text-slate-300 hover:text-white transition">
                    <i class="fa-solid fa-gear"></i>
                </button>
                
                <div id="city-dropdown-menu" class="hidden absolute right-0 mt-2 w-56 bg-slate-900 border border-slate-800 rounded-xl shadow-2xl py-1.5 z-50 text-xs">
                    <button onclick="editCityName(); closeCityMenu();" class="w-full text-left px-4 py-2 hover:bg-slate-800 text-slate-200 flex items-center gap-2.5 transition">
                        <i class="fa-solid fa-pen text-indigo-400 w-4"></i> Изменить название
                    </button>
                    <button onclick="editCityMap(); closeCityMenu();" class="w-full text-left px-4 py-2 hover:bg-slate-800 text-slate-200 flex items-center gap-2.5 transition">
                        <i class="fa-solid fa-map-location-dot text-emerald-400 w-4"></i> Ссылка на карту города
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="max-w-6xl mx-auto space-y-6">
        <!-- Статистика и быстрые действия -->
        <section class="flex flex-wrap items-center justify-between gap-4 bg-slate-900 border border-slate-800 p-4 rounded-2xl">
            <div class="flex items-center space-x-4 text-xs">
                <span>🟢 Свободно: <strong id="st-free" class="text-white">0</strong></span>
                <span>🔵 В обработке: <strong id="st-busy" class="text-white">0</strong></span>
                <span>🔴 Просрочено: <strong id="st-overdue" class="text-white">0</strong></span>
            </div>

            <div class="flex flex-wrap items-center gap-2">
                <a id="map-link" href="#" target="_blank" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold transition flex items-center gap-1.5 shadow-md">
                    <i class="fa-solid fa-map"></i> Карта города
                </a>
                <button onclick="addTerritory()" class="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold rounded-lg transition shadow-md">
                    <i class="fa-solid fa-plus mr-1 text-indigo-400"></i> Добавить участок
                </button>
            </div>
        </section>

        <!-- Сетка участков выбранного города -->
        <section id="grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></section>
    </main>

    <!-- МОДАЛЬНОЕ ОКНО ИСТОРИИ -->
    <div id="history-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 id="modal-title" class="font-bold text-base text-white">История участка</h3>
                <button onclick="closeHistoryModal()" class="text-slate-400 hover:text-white text-sm">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="bg-slate-950 border border-slate-800 p-3 rounded-xl space-y-2">
                <label class="text-[10px] text-indigo-400 font-bold uppercase block">Ссылка на онлайн-карту участка</label>
                <div class="flex gap-2">
                    <input type="text" id="modal-territory-map-url" placeholder="https://..." class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                    <button onclick="saveTerritoryMapUrl()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg transition">Сохранить</button>
                </div>
            </div>

            <div class="space-y-1">
                <h4 class="text-xs font-bold text-slate-300">Хронология выдач:</h4>
                <div id="modal-history-list" class="space-y-3 max-h-[40vh] overflow-y-auto pr-1"></div>
            </div>

            <div class="flex justify-end pt-2 border-t border-slate-800">
                <button onclick="closeHistoryModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-lg">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- FIREBASE СКРИПТ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, collection, addDoc, updateDoc, doc, onSnapshot, query, where 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAGWi3iNv1bROpOULUwh20XSsLokFYrzx8",
            authDomain: "fir-13-app.firebaseapp.com",
            projectId: "fir-13-app",
            storageBucket: "fir-13-app.firebasestorage.app",
            messagingSenderId: "1080215970738",
            appId: "1:1080215970738:web:2d66b3b8a9ea26f1e6baab",
            measurementId: "G-70HBSY6MC6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let activeCityId = null;
        let citiesData = [];
        let territoriesData = [];
        let currentEditingTerritoryId = null;

        // Инициализация реального времени для городов
        function initApp() {
            onSnapshot(collection(db, "cities"), (snapshot) => {
                citiesData = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                document.getElementById('db-status').innerText = '● База данных активна';

                if (citiesData.length > 0 && (!activeCityId || !citiesData.find(c => c.id === activeCityId))) {
                    activeCityId = citiesData[0].id;
                }

                renderCities();
                subscribeToTerritories();
            });
        }

        // Подписка на участки конкретного города в реальном времени (подколлекция)
        let unsubscribeTerritories = null;
        function subscribeToTerritories() {
            if (unsubscribeTerritories) unsubscribeTerritories();
            if (!activeCityId) return;

            const q = query(
                collection(db, "cities", activeCityId, "territories"), 
                where("isArchived", "==", false)
            );

            unsubscribeTerritories = onSnapshot(q, (snapshot) => {
                territoriesData = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                territoriesData.sort((a, b) => parseInt(a.number) - parseInt(b.number) || a.number.localeCompare(b.number));
                renderTerritories();
                
                if (currentEditingTerritoryId) {
                    window.showHistory(currentEditingTerritoryId);
                }
            });
        }

        // Управление меню города
        window.toggleCityMenu = (event) => {
            event.stopPropagation();
            document.getElementById('city-dropdown-menu').classList.toggle('hidden');
        };
        window.closeCityMenu = () => {
            const menu = document.getElementById('city-dropdown-menu');
            if (menu) menu.classList.add('hidden');
        };
        document.addEventListener('click', () => closeCityMenu());

        // Добавление нового города (папки)
        window.addCity = async () => {
            const name = prompt('Название нового города:');
            if (!name || !name.trim()) return;
            const mapUrl = prompt('Ссылка на общую карту города (необязательно):', '');
            
            await addDoc(collection(db, "cities"), { 
                name: name.trim(),
                mapUrl: mapUrl ? mapUrl.trim() : ''
            });
        };

        window.editCityName = async () => {
            const city = citiesData.find(c => c.id === activeCityId);
            if (!city) return;
            const newName = prompt('Новое название города:', city.name);
            if (!newName || !newName.trim()) return;
            await updateDoc(doc(db, "cities", activeCityId), { name: newName.trim() });
        };

        window.editCityMap = async () => {
            const city = citiesData.find(c => c.id === activeCityId);
            if (!city) return;
            const newUrl = prompt('Ссылка на карту города:', city.mapUrl || '');
            if (newUrl === null) return;
            await updateDoc(doc(db, "cities", activeCityId), { mapUrl: newUrl.trim() });
        };

        // Добавление участка в папку активного города
        window.addTerritory = async () => {
            const num = prompt('Номер участка (например: 1, 15-А):');
            if (!num || !num.trim()) return;
            const mapUrl = prompt('Ссылка на онлайн-карту участка (необязательно):', '');

            await addDoc(collection(db, "cities", activeCityId, "territories"), {
                number: num.trim(),
                mapUrl: mapUrl ? mapUrl.trim() : '',
                isArchived: false,
                history: []
            });
        };

        window.editTerritory = async (id) => {
            const t = territoriesData.find(item => item.id === id);
            const newNum = prompt('Новый номер участка:', t.number);
            if (newNum !== null && newNum.trim() !== '') {
                await updateDoc(doc(db, "cities", activeCityId, "territories", id), { number: newNum.trim() });
            }
        };

        window.archiveTerritory = async (id) => {
            const t = territoriesData.find(item => item.id === id);
            if (confirm(`Удалить/архивировать участок №${t.number}?`)) {
                await updateDoc(doc(db, "cities", activeCityId, "territories", id), { isArchived: true });
            }
        };

        // Выдача участка (автоматическая дата)
        window.issueTerritory = async (id) => {
            const name = prompt('ФИО возвещателя:');
            if (!name || !name.trim()) return;
            const t = territoriesData.find(item => item.id === id);
            const history = t.history || [];
            
            history.push({
                publisher: name.trim(),
                issuedAt: new Date().toISOString().split('T')[0],
                returnedAt: null
            });
            
            await updateDoc(doc(db, "cities", activeCityId, "territories", id), { history });
        };

        // Сдача участка (автоматическая дата возврата)
        window.returnTerritory = async (id) => {
            const t = territoriesData.find(item => item.id === id);
            const history = t.history || [];
            if (history.length > 0) {
                history[history.length - 1].returnedAt = new Date().toISOString().split('T')[0];
                await updateDoc(doc(db, "cities", activeCityId, "territories", id), { history });
            }
        };

        // Модальное окно истории
        window.showHistory = (id) => {
            currentEditingTerritoryId = id;
            const t = territoriesData.find(item => item.id === id);
            if (!t) return;

            document.getElementById('modal-title').innerText = `Участок №${t.number} — История`;
            document.getElementById('modal-territory-map-url').value = t.mapUrl || '';

            const listContainer = document.getElementById('modal-history-list');
            listContainer.innerHTML = '';

            if (!t.history || t.history.length === 0) {
                listContainer.innerHTML = '<p class="text-xs text-slate-500 italic py-2">История пуста.</p>';
            } else {
                t.history.forEach((h, index) => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'bg-slate-950 border border-slate-800 p-3 rounded-xl flex items-center justify-between gap-2 text-xs';
                    itemDiv.innerHTML = `
                        <div class="space-y-1">
                            <p class="font-bold text-white"><span class="text-indigo-400">#${index + 1}</span> ${h.publisher}</p>
                            <p class="text-slate-400">Выдан: <span class="text-slate-200">${h.issuedAt}</span> | Сдан: <span class="${h.returnedAt ? 'text-emerald-400' : 'text-amber-400 font-semibold'}">${h.returnedAt || 'У возвещателя'}</span></p>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="deleteHistoryItem(${index})" title="Удалить запись" class="p-1.5 bg-slate-800 hover:bg-rose-900/40 text-rose-400 rounded"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                    listContainer.appendChild(itemDiv);
                });
            }

            document.getElementById('history-modal').classList.add('flex');
            document.getElementById('history-modal').classList.remove('hidden');
        };

        window.closeHistoryModal = () => {
            currentEditingTerritoryId = null;
            document.getElementById('history-modal').classList.add('hidden');
            document.getElementById('history-modal').classList.remove('flex');
        };

        window.saveTerritoryMapUrl = async () => {
            if (!currentEditingTerritoryId) return;
            const newUrl = document.getElementById('modal-territory-map-url').value;
            await updateDoc(doc(db, "cities", activeCityId, "territories", currentEditingTerritoryId), {
                mapUrl: newUrl.trim()
            });
        };

        window.deleteHistoryItem = async (index) => {
            const t = territoriesData.find(item => item.id === currentEditingTerritoryId);
            if (!t || !t.history[index]) return;
            if (confirm('Удалить эту запись из истории?')) {
                t.history.splice(index, 1);
                await updateDoc(doc(db, "cities", activeCityId, "territories", t.id), { history: t.history });
            }
        };

        window.copyLink = (url) => {
            if (url) navigator.clipboard.writeText(url);
        };

        // Рендер интерфейса городов
        function renderCities() {
            const container = document.getElementById('cities-container');
            container.innerHTML = '';
            
            citiesData.forEach(c => {
                const btn = document.createElement('button');
                btn.className = `px-3 py-1.5 rounded-lg text-xs font-medium transition ${c.id === activeCityId ? 'bg-indigo-600 text-white font-semibold shadow-md' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`;
                btn.innerText = c.name;
                btn.onclick = () => { activeCityId = c.id; renderCities(); subscribeToTerritories(); };
                container.appendChild(btn);

                if (c.id === activeCityId) {
                    const mapBtn = document.getElementById('map-link');
                    if (c.mapUrl) {
                        mapBtn.href = c.mapUrl;
                        mapBtn.style.display = 'flex';
                    } else {
                        mapBtn.style.display = 'none';
                    }
                }
            });
        }

        // Рендер участков
        function renderTerritories() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            let free = 0, busy = 0, overdue = 0;

            if (territoriesData.length === 0) {
                grid.innerHTML = '<p class="text-xs text-slate-500 italic col-span-full py-6 text-center">В этом городе пока нет участков. Нажмите «Добавить участок».</p>';
            }

            territoriesData.forEach(t => {
                const lastRec = t.history && t.history.length > 0 ? t.history[t.history.length - 1] : null;
                const isBusy = lastRec && !lastRec.returnedAt;
                
                let days = 0, isOverdue = false;
                if (isBusy) {
                    days = Math.floor((new Date() - new Date(lastRec.issuedAt)) / (1000 * 60 * 60 * 24));
                    if (days > 120) isOverdue = true;
                }

                if (!isBusy) free++; else if (isOverdue) overdue++; else busy++;

                let badge = '<span class="px-2 py-0.5 rounded text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Свободен</span>';
                if (isBusy && !isOverdue) badge = `<span class="px-2 py-0.5 rounded text-[10px] bg-blue-500/10 text-blue-400 border border-blue-500/20">У возвещателя (${days} дн.)</span>`;
                if (isOverdue) badge = `<span class="px-2 py-0.5 rounded text-[10px] bg-rose-500/10 text-rose-400 border border-rose-500/20">Просрочен (${days} дн.)</span>`;

                const card = document.createElement('div');
                card.className = 'bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col justify-between space-y-3';
                card.innerHTML = `
                    <div class="flex items-start justify-between">
                        <div>
                            <span class="text-[10px] text-indigo-400 font-bold uppercase">Участок</span>
                            <h3 class="text-lg font-bold text-white">№ ${t.number}</h3>
                        </div>
                        ${badge}
                    </div>
                    
                    <div class="space-y-1.5 text-xs text-slate-400">
                        ${isBusy ? `<p><i class="fa-solid fa-user text-slate-500 mr-1"></i> <strong>${lastRec.publisher}</strong></p>` : '<p class="text-slate-600 italic">Никому не выдан</p>'}
                        
                        <div class="flex items-center gap-1.5 pt-1">
                            ${t.mapUrl ? `
                                <a href="${t.mapUrl}" target="_blank" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-indigo-400 rounded font-medium flex items-center gap-1 transition"><i class="fa-solid fa-map-location-dot"></i> Карта</a>
                                <button onclick="copyLink('${t.mapUrl}')" title="Копировать ссылку" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded transition"><i class="fa-solid fa-copy"></i></button>
                            ` : `<span class="text-[10px] text-slate-600 italic">Карта не привязана</span>`}
                        </div>
                    </div>

                    <div class="pt-2 border-t border-slate-800 flex items-center justify-between gap-1">
                        <div class="flex space-x-1">
                            <button onclick="editTerritory('${t.id}')" title="Изменить номер" class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="showHistory('${t.id}')" title="История" class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs"><i class="fa-solid fa-clock-rotate-left"></i></button>
                            <button onclick="archiveTerritory('${t.id}')" title="Удалить" class="p-1.5 bg-slate-800 hover:bg-rose-900/40 text-rose-400 rounded text-xs"><i class="fa-solid fa-trash"></i></button>
                        </div>
                        ${!isBusy 
                            ? `<button onclick="issueTerritory('${t.id}')" class="px-3 py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded text-xs font-semibold">Выдать</button>`
                            : `<button onclick="returnTerritory('${t.id}')" class="px-3 py-1 bg-slate-800 hover:bg-emerald-600 text-slate-200 hover:text-white rounded text-xs font-semibold">Сдать</button>`
                        }
                    </div>
                `;
                grid.appendChild(card);
            });

            document.getElementById('st-free').innerText = free;
            document.getElementById('st-busy').innerText = busy;
            document.getElementById('st-overdue').innerText = overdue;
        }

        // Запуск при загрузке страницы
        initApp();
    </script>
</body>
</html>
