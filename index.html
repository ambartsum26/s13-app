<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учёт территорий (Firebase)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans p-4 md:p-6">

    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <header class="max-w-6xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-6 shadow-xl flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-indigo-600/30">
                <i class="fa-solid fa-cloud"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight">Помощник по участкам</h1>
                <p class="text-xs text-emerald-400 font-medium" id="db-status">● Подключение к Firebase...</p>
            </div>
        </div>

        <!-- Переключатель городов -->
        <div class="flex items-center gap-2 overflow-x-auto py-1" id="cities-container"></div>

        <!-- Кнопки управления городами -->
        <div class="flex items-center gap-2">
            <button onclick="addCity()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-lg border border-slate-700 transition">
                <i class="fa-solid fa-plus text-indigo-400 mr-1"></i> Город
            </button>
            <button onclick="editCity()" title="Переименовать город" class="p-2 bg-slate-800 hover:bg-slate-700 text-xs rounded-lg border border-slate-700">
                <i class="fa-solid fa-pen"></i>
            </button>
        </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="max-w-6xl mx-auto space-y-6">

        <!-- Карта города -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-bold text-sm text-slate-300" id="city-title">Карта</h2>
                <a id="city-map-link" href="#" target="_blank" class="text-xs text-indigo-400 hover:underline">Открыть в Google Maps <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
            </div>
            <div class="w-full h-48 bg-slate-950 rounded-xl overflow-hidden border border-slate-800">
                <iframe id="city-iframe" class="w-full h-full border-0" src=""></iframe>
            </div>
        </section>

        <!-- Статистика и Действия -->
        <section class="flex flex-wrap items-center justify-between gap-4 bg-slate-900 border border-slate-800 p-4 rounded-2xl">
            <div class="flex items-center space-x-4 text-xs">
                <span>🟢 Свободно: <strong id="st-free" class="text-white">0</strong></span>
                <span>🔵 На руках: <strong id="st-busy" class="text-white">0</strong></span>
                <span>🔴 Просрочено: <strong id="st-overdue" class="text-white">0</strong></span>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="quickImport()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-lg border border-slate-700 transition">
                    <i class="fa-solid fa-file-import mr-1"></i> Быстрый импорт
                </button>
                <button onclick="addTerritory()" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-xs font-semibold rounded-lg transition shadow-md">
                    <i class="fa-solid fa-plus mr-1"></i> Участок
                </button>
            </div>
        </section>

        <!-- Сетка карточек -->
        <section id="grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></section>
    </main>

    <!-- FIREBASE SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, collection, addDoc, updateDoc, doc, onSnapshot, query, where 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ ВСТАВЬ СВОИ ДАННЫЕ ИЗ КОНСОЛИ FIREBASE ⚠️
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let activeCityId = null;
        let citiesData = [];
        let territoriesData = [];

        function initApp() {
            onSnapshot(collection(db, "cities"), (snapshot) => {
                citiesData = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                document.getElementById('db-status').innerText = '● Firebase подключен';

                if (citiesData.length === 0) {
                    addDoc(collection(db, "cities"), { name: "Valence", mapUrl: "" });
                    return;
                }

                if (!activeCityId || !citiesData.find(c => c.id === activeCityId)) {
                    activeCityId = citiesData[0].id;
                }

                renderCities();
                subscribeToTerritories();
            });
        }

        let unsubscribeTerritories = null;
        function subscribeToTerritories() {
            if (unsubscribeTerritories) unsubscribeTerritories();

            const q = query(
                collection(db, "territories"), 
                where("cityId", "==", activeCityId),
                where("isArchived", "==", false)
            );

            unsubscribeTerritories = onSnapshot(q, (snapshot) => {
                territoriesData = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                renderTerritories();
            });
        }

        // --- УПРАВЛЕНИЕ ГОРОДАМИ ---
        window.addCity = async () => {
            const name = prompt('Название нового города:');
            if (!name) return;
            const docRef = await addDoc(collection(db, "cities"), { name: name.trim(), mapUrl: "" });
            activeCityId = docRef.id;
        };

        window.editCity = async () => {
            const city = citiesData.find(c => c.id === activeCityId);
            if (!city) return;
            const newName = prompt('Новое название города:', city.name);
            if (newName) {
                await updateDoc(doc(db, "cities", activeCityId), { name: newName.trim() });
            }
        };

        // --- УПРАВЛЕНИЕ УЧАСТКАМИ ---
        window.addTerritory = async () => {
            const num = prompt('Номер участка (например: 01 или 12-А):');
            if (!num) return;
            const map = prompt('Ссылка на карту участка (необязательно):', '');

            await addDoc(collection(db, "territories"), {
                cityId: activeCityId,
                number: num.trim(),
                mapUrl: map ? map.trim() : "",
                isArchived: false,
                history: []
            });
        };

        window.editTerritory = async (id) => {
            const t = territoriesData.find(item => item.id === id);
            const newNum = prompt('Новый номер участка:', t.number);
            if (newNum !== null && newNum.trim() !== '') {
                const newMap = prompt('Ссылка на карту:', t.mapUrl || '');
                await updateDoc(doc(db, "territories", id), {
                    number: newNum.trim(),
                    mapUrl: newMap !== null ? newMap.trim() : (t.mapUrl || "")
                });
            }
        };

        window.archiveTerritory = async (id) => {
            const t = territoriesData.find(item => item.id === id);
            if (confirm(`Архивировать участок №${t.number}?`)) {
                await updateDoc(doc(db, "territories", id), { isArchived: true });
            }
        };

        window.issueTerritory = async (id) => {
            const name = prompt('ФИО возвещателя, которому выдаётся участок:');
            if (!name) return;
            const t = territoriesData.find(item => item.id === id);
            const history = t.history || [];
            history.push({
                publisher: name.trim(),
                issuedAt: new Date().toISOString().split('T')[0],
                returnedAt: null
            });
            await updateDoc(doc(db, "territories", id), { history });
        };

        window.returnTerritory = async (id) => {
            const t = territoriesData.find(item => item.id === id);
            const history = t.history || [];
            if (history.length > 0) {
                history[history.length - 1].returnedAt = new Date().toISOString().split('T')[0];
                await updateDoc(doc(db, "territories", id), { history });
            }
        };

        window.showHistory = (id) => {
            const t = territoriesData.find(item => item.id === id);
            if (!t.history || t.history.length === 0) return alert(`История участка №${t.number} пуста.`);

            let text = `История участка №${t.number}:\n\n`;
            t.history.forEach((h, i) => {
                text += `${i + 1}. ${h.publisher} | Выдан: ${h.issuedAt} | Сдан: ${h.returnedAt || 'НА РУКАХ'}\n`;
            });
            alert(text);
        };

        window.quickImport = async () => {
            const input = prompt('Вставьте список номеров участков через запятую или с новой строки:');
            if (!input) return;
            const numbers = input.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
            
            let added = 0;
            for (const num of numbers) {
                const exists = territoriesData.some(t => t.number === num);
                if (!exists) {
                    await addDoc(collection(db, "territories"), {
                        cityId: activeCityId,
                        number: num,
                        mapUrl: "",
                        isArchived: false,
                        history: []
                    });
                    added++;
                }
            }
            alert(`Успешно добавлено участков в базу: ${added}`);
        };

        // --- ОТРИСОВКА ---
        function renderCities() {
            const container = document.getElementById('cities-container');
            container.innerHTML = '';
            citiesData.forEach(c => {
                const btn = document.createElement('button');
                btn.className = `px-3 py-1.5 rounded-lg text-xs font-medium transition ${c.id === activeCityId ? 'bg-indigo-600 text-white font-semibold' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`;
                btn.innerText = c.name;
                btn.onclick = () => { activeCityId = c.id; renderCities(); subscribeToTerritories(); };
                container.appendChild(btn);
            });

            const current = citiesData.find(c => c.id === activeCityId);
            if (current) {
                document.getElementById('city-title').innerText = `Карта города: ${current.name}`;
                document.getElementById('city-iframe').src = current.mapUrl || `https://maps.google.com/maps?q=${encodeURIComponent(current.name)}&t=&z=13&ie=UTF8&iwloc=&output=embed`;
            }
        }

        function renderTerritories() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            let free = 0, busy = 0, overdue = 0;

            territoriesData.forEach(t => {
                const lastRec = t.history && t.history.length > 0 ? t.history[t.history.length - 1] : null;
                const isBusy = lastRec && !lastRec.returnedAt;
                
                let days = 0, isOverdue = false;
                if (isBusy) {
                    days = Math.floor((new Date() - new Date(lastRec.issuedAt)) / (1000 * 60 * 60 * 24));
                    if (days > 120) isOverdue = true;
                }

                if (!isBusy) free++; else if (isOverdue) overdue++; else busy++;

                let badge = '<span class="px-2 py-0.5 rounded text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Свободен</span>';
                if (isBusy && !isOverdue) badge = `<span class="px-2 py-0.5 rounded text-[10px] bg-blue-500/10 text-blue-400 border border-blue-500/20">На руках (${days} дн.)</span>`;
                if (isOverdue) badge = `<span class="px-2 py-0.5 rounded text-[10px] bg-rose-500/10 text-rose-400 border border-rose-500/20">Просрочен (${days} дн.)</span>`;

                const card = document.createElement('div');
                card.className = 'bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col justify-between space-y-3';
                card.innerHTML = `
                    <div class="flex items-start justify-between">
                        <div>
                            <span class="text-[10px] text-indigo-400 font-bold uppercase">Участок</span>
                            <h3 class="text-lg font-bold text-white">№ ${t.number}</h3>
                        </div>
                        ${badge}
                    </div>
                    <div class="text-xs text-slate-400 min-h-[32px]">
                        ${isBusy ? `<p><i class="fa-solid fa-user text-slate-500 mr-1"></i> <strong>${lastRec.publisher}</strong></p>` : '<p class="text-slate-600 italic">Никому не выдан</p>'}
                    </div>
                    <div class="pt-2 border-t border-slate-800 flex items-center justify-between gap-1">
                        <div class="flex space-x-1">
                            <button onclick="editTerritory('${t.id}')" title="Редактировать" class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button onclick="showHistory('${t.id}')" title="История" class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs">
                                <i class="fa-solid fa-clock-rotate-left"></i>
                            </button>
                            <button onclick="archiveTerritory('${t.id}')" title="В архив" class="p-1.5 bg-slate-800 hover:bg-rose-900/40 text-rose-400 rounded text-xs">
                                <i class="fa-solid fa-box-archive"></i>
                            </button>
                        </div>
                        ${!isBusy 
                            ? `<button onclick="issueTerritory('${t.id}')" class="px-3 py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded text-xs font-semibold">Выдать</button>`
                            : `<button onclick="returnTerritory('${t.id}')" class="px-3 py-1 bg-slate-800 hover:bg-emerald-600 text-slate-200 hover:text-white rounded text-xs font-semibold">Сдать</button>`
                        }
                    </div>
                `;
                grid.appendChild(card);
            });

            document.getElementById('st-free').innerText = free;
            document.getElementById('st-busy').innerText = busy;
            document.getElementById('st-overdue').innerText = overdue;
        }

        initApp();
    </script>
</body>
</html>
