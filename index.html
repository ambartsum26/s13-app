<body class="bg-slate-950 text-slate-100 min-h-screen font-sans p-4 md:p-6">

    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <header class="max-w-6xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-6 shadow-xl flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-indigo-600/30">
                <i class="fa-solid fa-cloud"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight" data-i18n="app_title">Помощник по участкам</h1>
                <p class="text-xs text-emerald-400 font-medium" id="db-status">● Подключение к Firebase...</p>
            </div>
        </div>

        <!-- Переключатель городов -->
        <div class="flex items-center gap-2 overflow-x-auto py-1" id="cities-container"></div>

        <!-- Кнопки управления городами и Язык -->
        <div class="flex items-center gap-2">
            <!-- КНОПКА ПЕРЕКЛЮЧЕНИЯ ЯЗЫКА -->
            <button onclick="toggleLanguage()" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-lg border border-slate-700 text-indigo-400 transition" id="lang-btn">
                FR
            </button>

            <button onclick="addCity()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-lg border border-slate-700 transition">
                <i class="fa-solid fa-plus text-indigo-400 mr-1"></i> <span data-i18n="btn_city">Город</span>
            </button>
            
            <!-- Кнопка с выпадающим меню (карандаш) -->
            <div class="relative">
                <button onclick="toggleCityMenu(event)" title="Управление городом" class="p-2 bg-slate-800 hover:bg-slate-700 text-xs rounded-lg border border-slate-700 text-slate-300 hover:text-white transition">
                    <i class="fa-solid fa-pen"></i>
                </button>
                
                <!-- Выпадающее меню -->
                <div id="city-dropdown-menu" class="hidden absolute right-0 mt-2 w-56 bg-slate-900 border border-slate-800 rounded-xl shadow-2xl py-1.5 z-50 text-xs">
                    <button onclick="editCityName(); closeCityMenu();" class="w-full text-left px-4 py-2 hover:bg-slate-800 text-slate-200 flex items-center gap-2.5 transition">
                        <i class="fa-solid fa-signature text-indigo-400 w-4"></i> <span data-i18n="menu_edit_city">Изменить название</span>
                    </button>
                    <button onclick="editCityMap(); closeCityMenu();" class="w-full text-left px-4 py-2 hover:bg-slate-800 text-slate-200 flex items-center gap-2.5 transition">
                        <i class="fa-solid fa-map-location-dot text-emerald-400 w-4"></i> <span data-i18n="menu_edit_map">Изменить ссылку на карту</span>
                    </button>
                </div>
            </div>
        </div>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="max-w-6xl mx-auto space-y-6">

        <section class="flex flex-wrap items-center justify-between gap-4 bg-slate-900 border border-slate-800 p-4 rounded-2xl">
            <div class="flex items-center space-x-4 text-xs">
                <span><span data-i18n="st_free_label">🟢 Свободно</span>: <strong id="st-free" class="text-white">0</strong></span>
                <span><span data-i18n="st_busy_label">🔵 В обработке</span>: <strong id="st-busy" class="text-white">0</strong></span>
                <span><span data-i18n="st_overdue_label">🔴 Просрочено</span>: <strong id="st-overdue" class="text-white">0</strong></span>
            </div>

            <div class="flex flex-wrap items-center gap-2">
                <!-- Динамическая кнопка общей карты города -->
                <a id="map-link" href="#" target="_blank" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-semibold transition flex items-center gap-1.5 shadow-md">
                    <i class="fa-solid fa-location-dot"></i> <span data-i18n="btn_general_map">Общая карта</span>
                </a>
                <button onclick="addTerritory()" class="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold rounded-lg transition shadow-md">
                    <i class="fa-solid fa-plus mr-1 text-indigo-400"></i> <span data-i18n="btn_territory">Участок</span>
                </button>
            </div>
        </section>

        <!-- Сетка карточек -->
        <section id="grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></section>
    </main>

    <!-- МОДАЛЬНОЕ ОКНО ИСТОРИИ И ССЫЛКИ -->
    <div id="history-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 id="modal-title" class="font-bold text-base text-white" data-i18n="modal_title">Управление участком</h3>
                <button onclick="closeHistoryModal()" class="text-slate-400 hover:text-white text-sm">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Блок настройки персональной ссылки участка -->
            <div class="bg-slate-950 border border-slate-800 p-3 rounded-xl space-y-2">
                <label class="text-[10px] text-indigo-400 font-bold uppercase block" data-i18n="modal_map_label">Ссылка на карту участка</label>
                <div class="flex gap-2">
                    <input type="text" id="modal-territory-map-url" placeholder="https://www.google.com/maps/d/..." class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">

                </div>
            </div>

            <div class="space-y-1">

            </div>

            <div class="flex justify-end pt-2 border-t border-slate-800">
                <button onclick="closeHistoryModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-lg" data-i18n="btn_close">Закрыть</button>
            </div>
        </div>

        function initApp() {
            onSnapshot(collection(db, "cities"), async (snapshot) => {
                citiesData = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                document.getElementById('db-status').innerText = t('db_connected');

                let valenceCity = citiesData.find(c => c.name === "Valence");
                if (!valenceCity) {
                    const valenceRef = await addDoc(collection(db, "cities"), { 
                        name: "Valence",
                        mapUrl: "https://www.google.com/maps/d/edit?mid=1F--67sV9pTds54DmFxs1Lmz7SwRHlsw&ll=44.91635564862983%2C4.904553349999974&z=13"
                    });
                    for (const item of valenceTerritories) {
                        await addDoc(collection(db, "territories"), {
                            cityId: valenceRef.id,
                            number: item.number,
                            mapUrl: item.mapUrl || "",
                            isArchived: false,
                            history: item.history
                        });
                    }
                    return; 
                }

                let guilherandCity = citiesData.find(c => c.name === "Guilherand-Granges");
                if (!guilherandCity) {
                    const guilherandRef = await addDoc(collection(db, "cities"), { 
                        name: "Guilherand-Granges",
                        mapUrl: "https://www.google.com/maps/d/viewer?mid=1HTtzXu4-uTSSwQPb9Ip1xKSrdVB0low"
                    });
                    for (const item of guilherandTerritories) {
                        await addDoc(collection(db, "territories"), {
                            cityId: guilherandRef.id,
                            number: item.number,
                            mapUrl: item.mapUrl || "",
                            isArchived: false,
                            history: item.history
                        });
                    }
                    return; 
                }

                let saintMarcelCity = citiesData.find(c => c.name === "Saint-Marcel-lès-Valence");
                if (!saintMarcelCity) {
                    const saintMarcelRef = await addDoc(collection(db, "cities"), { 
                        name: "Saint-Marcel-lès-Valence",
                        mapUrl: ""
                    });
                    for (const item of saintMarcelTerritories) {
                        await addDoc(collection(db, "territories"), {
                            cityId: saintMarcelRef.id,
                            number: item.number,
                            mapUrl: item.mapUrl || "",
                            isArchived: false,
                            history: item.history
                        });
                    }
                    return; 
                }

                if (!activeCityId || !citiesData.find(c => c.id === activeCityId)) {
                    activeCityId = citiesData[0].id;
                }

                renderCities();
                subscribeToTerritories();
            });
        }

        let unsubscribeTerritories = null;
        function subscribeToTerritories() {
            if (unsubscribeTerritories) unsubscribeTerritories();

            const q = query(
                collection(db, "territories"), 
                where("cityId", "==", activeCityId),
                where("isArchived", "==", false)
            );

            unsubscribeTerritories = onSnapshot(q, (snapshot) => {
                territoriesData = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                territoriesData.sort((a, b) => parseInt(a.number) - parseInt(b.number) || a.number.localeCompare(b.number));
                renderTerritories();
                
                if (currentEditingTerritoryId) {
                    window.showHistory(currentEditingTerritoryId);
                }
            });
        }

        window.toggleCityMenu = (event) => {
            event.stopPropagation();
            const menu = document.getElementById('city-dropdown-menu');
            menu.classList.toggle('hidden');
        };

        window.closeCityMenu = () => {
            const menu = document.getElementById('city-dropdown-menu');
            if (menu) menu.classList.add('hidden');
        };

        document.addEventListener('click', () => {
            closeCityMenu();
        });

        window.addCity = async () => {
            const name = prompt(t('prompt_new_city'));
            if (!name || !name.trim()) return;
            const mapLink = prompt(t('prompt_new_city_map'), 'https://www.google.com/maps/d/');
            await addDoc(collection(db, "cities"), { 
                name: name.trim(),
                mapUrl: mapLink ? mapLink.trim() : '#'
            });
        };

        window.editCityName = async () => {
            const city = citiesData.find(c => c.id === activeCityId);
            if (!city) return;
            const newName = prompt(t('prompt_edit_city_name'), city.name);
            if (!newName || newName.trim() === '') return;

            await updateDoc(doc(db, "cities", activeCityId), { 
                name: newName.trim()
            });
        };

        window.editCityMap = async () => {
            const city = citiesData.find(c => c.id === activeCityId);
            if (!city) return;
            const newMapUrl = prompt(t('prompt_edit_city_map'), city.mapUrl || '');
            if (newMapUrl === null) return;

            await updateDoc(doc(db, "cities", activeCityId), { 
                mapUrl: newMapUrl.trim()
            });
        };

        window.addTerritory = async () => {
            const num = prompt(t('prompt_new_territory_num'));
            if (!num) return;
            const mapLink = prompt(t('prompt_new_territory_map'), '');

            await addDoc(collection(db, "territories"), {
                cityId: activeCityId,
                number: num.trim(),
                mapUrl: mapLink ? mapLink.trim() : '',
                isArchived: false,
                history: []
            });
        };

        window.editTerritory = async (id) => {
            const tObj = territoriesData.find(item => item.id === id);
            const newNum = prompt(t('prompt_edit_territory_num'), tObj.number);
            if (newNum !== null && newNum.trim() !== '') {
                await updateDoc(doc(db, "territories", id), {
                    number: newNum.trim()
                });
            }
        };

        window.archiveTerritory = async (id) => {
            const tObj = territoriesData.find(item => item.id === id);
            if (confirm(`${t('prompt_archive_confirm')}№${tObj.number}?`)) {
                await updateDoc(doc(db, "territories", id), { isArchived: true });
            }
        };

        window.issueTerritory = async (id) => {
            const name = prompt(t('prompt_publisher_name'));
            if (!name) return;
            const tObj = territoriesData.find(item => item.id === id);
            const history = tObj.history || [];
            history.push({
                publisher: name.trim(),
                issuedAt: new Date().toISOString().split('T')[0],
                returnedAt: null
            });
            await updateDoc(doc(db, "territories", id), { history });
        };

        window.returnTerritory = async (id) => {
            const tObj = territoriesData.find(item => item.id === id);
            const history = tObj.history || [];
            if (history.length > 0) {
                history[history.length - 1].returnedAt = new Date().toISOString().split('T')[0];
                await updateDoc(doc(db, "territories", id), { history });
            }
        };

        window.showHistory = (id) => {
            currentEditingTerritoryId = id;
            const tObj = territoriesData.find(item => item.id === id);
            if (!tObj) return;

            document.getElementById('modal-title').innerText = `${t('modal_title')} №${tObj.number}`;
            document.getElementById('modal-territory-map-url').value = tObj.mapUrl || '';

            const listContainer = document.getElementById('modal-history-list');
            listContainer.innerHTML = '';

            if (!tObj.history || tObj.history.length === 0) {
                listContainer.innerHTML = `<p class="text-xs text-slate-500 italic py-2">${t('history_empty')}</p>`;
            } else {
                tObj.history.forEach((h, index) => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'bg-slate-950 border border-slate-800 p-3 rounded-xl flex items-center justify-between gap-2 text-xs';
                    itemDiv.innerHTML = `
                        <div class="space-y-1">
                            <p class="font-bold text-white"><span class="text-indigo-400">#${index + 1}</span> ${h.publisher}</p>
                            <p class="text-slate-400">${t('issued_by')} <span class="text-slate-200">${h.issuedAt}</span> | ${t('returned_by')} <span class="${h.returnedAt ? 'text-emerald-400' : 'text-amber-400 font-semibold'}">${h.returnedAt || t('in_progress')}</span></p>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="editHistoryItem(${index})" title="Редактировать запись" class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button onclick="deleteHistoryItem(${index})" title="Удалить запись" class="p-1.5 bg-slate-800 hover:bg-rose-900/40 text-rose-400 rounded">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    `;
                    listContainer.appendChild(itemDiv);
                });
            }

            document.getElementById('history-modal').classList.remove('hidden');
            document.getElementById('history-modal').classList.add('flex');
        };

        window.closeHistoryModal = () => {
            currentEditingTerritoryId = null;
            document.getElementById('history-modal').classList.add('hidden');
            document.getElementById('history-modal').classList.remove('flex');
        };

        window.saveTerritoryMapUrl = async () => {
            if (!currentEditingTerritoryId) return;
            const newUrl = document.getElementById('modal-territory-map-url').value;
            await updateDoc(doc(db, "territories", currentEditingTerritoryId), {
                mapUrl: newUrl.trim()
            });
        };

        window.editHistoryItem = async (index) => {
            const tObj = territoriesData.find(item => item.id === currentEditingTerritoryId);
            if (!tObj || !tObj.history[index]) return;
            const h = tObj.history[index];

            const newPub = prompt(t('prompt_edit_publisher'), h.publisher);
            if (newPub === null) return;

            const newIssued = prompt(t('prompt_edit_issued_date'), h.issuedAt);
            if (newIssued === null) return;

            const newReturned = prompt(t('prompt_edit_returned_date'), h.returnedAt || '');
            if (newReturned === null) return;

            tObj.history[index] = {
                publisher: newPub.trim(),
                issuedAt: newIssued.trim(),
                returnedAt: newReturned.trim() !== '' ? newReturned.trim() : null
            };

            await updateDoc(doc(db, "territories", tObj.id), { history: tObj.history });
        };

        window.deleteHistoryItem = async (index) => {
            const tObj = territoriesData.find(item => item.id === currentEditingTerritoryId);
            if (!tObj || !tObj.history[index]) return;

            if (confirm(`${t('prompt_delete_history')}${index + 1} (${tObj.history[index].publisher})?`)) {
                tObj.history.splice(index, 1);
                await updateDoc(doc(db, "territories", tObj.id), { history: tObj.history });
            }
        };

        window.copyTerritoryLink = (url, num) => {
            if (!url) return;
            navigator.clipboard.writeText(url).catch(err => {
                console.error('Ошибка копирования: ', err);
            });
        };

        function renderCities() {
            const container = document.getElementById('cities-container');
            container.innerHTML = '';
            citiesData.forEach(c => {
                const btn = document.createElement('button');
                btn.className = `px-3 py-1.5 rounded-lg text-xs font-medium transition ${c.id === activeCityId ? 'bg-indigo-600 text-white font-semibold' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`;
                btn.innerText = c.name;
                btn.onclick = () => { activeCityId = c.id; renderCities(); subscribeToTerritories(); };
                container.appendChild(btn);

                if (c.id === activeCityId) {
                    const mapLinkBtn = document.getElementById('map-link');
                    if (c.mapUrl) {
                        mapLinkBtn.href = c.mapUrl;
                        mapLinkBtn.style.display = 'flex';
                    } else {
                        mapLinkBtn.style.display = 'none';
                    }
                }
            });
        }

        function renderTerritories() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            let free = 0, busy = 0, overdue = 0;

            territoriesData.forEach(tObj => {
                const lastRec = tObj.history && tObj.history.length > 0 ? tObj.history[tObj.history.length - 1] : null;
                const isBusy = lastRec && !lastRec.returnedAt;
                
                let days = 0, isOverdue = false;
                if (isBusy) {
                    days = Math.floor((new Date() - new Date(lastRec.issuedAt)) / (1000 * 60 * 60 * 24));
                    if (days > 120) isOverdue = true;
                }

                if (!isBusy) free++; else if (isOverdue) overdue++; else busy++;

                let badge = `<span class="px-2 py-0.5 rounded text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">${t('status_free')}</span>`;
                if (isBusy && !isOverdue) badge = `<span class="px-2 py-0.5 rounded text-[10px] bg-blue-500/10 text-blue-400 border border-blue-500/20">${t('status_busy')} (${days} ${t('days_text')})</span>`;
                if (isOverdue) badge = `<span class="px-2 py-0.5 rounded text-[10px] bg-rose-500/10 text-rose-400 border border-rose-500/20">${t('status_overdue')} (${days} ${t('days_text')})</span>`;

                const card = document.createElement('div');
                card.className = 'bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col justify-between space-y-3';
                card.innerHTML = `
                    <div class="flex items-start justify-between">
                        <div>
                            <span class="text-[10px] text-indigo-400 font-bold uppercase">${t('card_territory')}</span>
                            <h3 class="text-lg font-bold text-white">№ ${tObj.number}</h3>
                        </div>
                        ${badge}
                    </div>
                    
                    <div class="space-y-1.5 text-xs text-slate-400">
                        ${isBusy ? `<p><i class="fa-solid fa-user text-slate-500 mr-1"></i> <strong>${lastRec.publisher}</strong></p>` : `<p class="text-slate-600 italic">${t('not_issued')}</p>`}
                        
                        <div class="flex items-center gap-1.5 pt-1">
                            ${tObj.mapUrl ? `
                                <a href="${tObj.mapUrl}" target="_blank" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-indigo-400 hover:text-indigo-300 rounded font-medium flex items-center gap-1 transition">
                                    <i class="fa-solid fa-map"></i> ${t('card_map')}
                                </a>
                                <button onclick="copyTerritoryLink('${tObj.mapUrl}', '${tObj.number}')" title="Скопировать ссылку для возвещателя" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white rounded transition">
                                    <i class="fa-solid fa-copy"></i>
                                </button>
                            ` : `
                                <span class="text-[10px] text-slate-600 italic">${t('no_map_link')}</span>
                            `}
                        </div>
                    </div>

                    <div class="pt-2 border-t border-slate-800 flex items-center justify-between gap-1">
                        <div class="flex space-x-1">
                            <button onclick="editTerritory('${tObj.id}')" title="Редактировать номер" class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button onclick="showHistory('${tObj.id}')" title="История и ссылка" class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs">
                                <i class="fa-solid fa-clock-rotate-left"></i>
                            </button>
                            <button onclick="archiveTerritory('${tObj.id}')" title="В архив" class="p-1.5 bg-slate-800 hover:bg-rose-900/40 text-rose-400 rounded text-xs">
                                <i class="fa-solid fa-box-archive"></i>
                            </button>
                        </div>
                        ${!isBusy 
                            ? `<button onclick="issueTerritory('${tObj.id}')" class="px-3 py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded text-xs font-semibold">${t('btn_issue')}</button>`
                            : `<button onclick="returnTerritory('${tObj.id}')" class="px-3 py-1 bg-slate-800 hover:bg-emerald-600 text-slate-200 hover:text-white rounded text-xs font-semibold">${t('btn_return')}</button>`
                        }
                    </div>
                `;
                grid.appendChild(card);
            });

            document.getElementById('st-free').innerText = free;
            document.getElementById('st-busy').innerText = busy;
            document.getElementById('st-overdue').innerText = overdue;
        }

        initApp();
    </script>
</body>
</html>
