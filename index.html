<!DOCTYPE html>
<html lang="ru" id="html-root" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ассистент по участкам</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={darkMode:'class'};</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root{
            --dz-page:#171720;
            --dz-shell:#363646;
            --dz-sidebar:#303040;
            --dz-main:#404050;
            --dz-panel:#535361;
            --dz-panel-2:#5c5c69;
            --dz-panel-dark:#292936;
            --dz-line:rgba(255,255,255,.08);
            --dz-text:#f7f7fb;
            --dz-muted:#b3b3bf;
            --dz-muted-2:#858593;
            --dz-lime:#d8ff22;
            --dz-cyan:#28d9d5;
            --dz-red:#ff6978;
            --dz-yellow:#ffc94a;
            --dz-violet:#746bd7;
            --dz-free:#d8ff22;
            --dz-busy:#28d9d5;
            --dz-overdue:#ff6978;
            --dz-waiting:#ffc94a;
        }

        *{box-sizing:border-box}
        html{background:var(--dz-page);color-scheme:dark}
        body{margin:0;min-height:100vh;background:var(--dz-page);color:var(--dz-text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}
        button,a,input{font:inherit}
        button{cursor:pointer}
        .hidden{display:none!important}
        .scrollbar-none::-webkit-scrollbar{display:none}.scrollbar-none{scrollbar-width:none}

        .dz-app{
            width:min(1540px,calc(100% - 32px));
            min-height:calc(100vh - 32px);
            margin:16px auto;
            display:grid;
            grid-template-columns:188px minmax(0,1fr);
            overflow:hidden;
            border-radius:13px;
            background:var(--dz-main);
            border:1px solid rgba(255,255,255,.055);
            box-shadow:0 28px 90px rgba(0,0,0,.34);
        }

        /* SIDEBAR — narrow and dense like the reference */
        #sidebar{
            min-height:calc(100vh - 34px);
            background:var(--dz-sidebar);
            border-right:1px solid rgba(255,255,255,.045);
            padding:17px 11px 13px;
            display:flex;
            flex-direction:column;
            position:relative;
            z-index:60;
        }
        .dz-brand{height:54px;display:flex;align-items:flex-start;justify-content:space-between;padding:2px 7px 13px}
        .dz-brand-copy{min-width:0}
        .dz-wordmark{font-size:16px;line-height:1;font-weight:800;letter-spacing:-.06em;color:white;text-transform:lowercase;margin-bottom:5px}
        #app-title{display:block;font-size:7px;line-height:1.2;color:#aaaab6;font-weight:600;letter-spacing:.035em;max-width:132px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        #db-status{font-size:7px;color:#9c9ca8;display:flex;align-items:center;gap:4px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        #db-status span{width:5px!important;height:5px!important;flex:0 0 5px}
        .dz-grid-logo{display:grid;grid-template-columns:repeat(2,5px);gap:2px;margin-top:1px}.dz-grid-logo i{display:block;width:5px;height:5px;border-radius:1px;background:#e9e9ef}

        .dz-nav{display:flex;flex-direction:column;gap:4px;margin-top:8px}
        .sidebar-btn{
            width:100%;height:31px;border:0!important;border-radius:6px!important;background:transparent!important;color:#c5c5cf!important;
            display:flex;align-items:center;gap:8px;padding:0 8px!important;font-size:8px;font-weight:600;box-shadow:none!important;transition:.16s ease!important
        }
        .sidebar-btn i{width:13px;text-align:center;font-size:8px;color:#b0b0bb}
        .sidebar-btn:hover{background:#484857!important;color:white!important;transform:none!important}
        .sidebar-btn.nav-active{background:var(--dz-lime)!important;color:#25252d!important;font-weight:700!important}
        .sidebar-btn.nav-active i{color:#25252d!important}
        #cities-container{margin:3px 0 4px 18px;padding-left:6px;border-left:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:2px}
        #cities-container button{min-height:25px;width:100%;border:0!important;border-radius:5px!important;background:transparent!important;color:#a4a4af!important;text-align:left;padding:4px 7px!important;font-size:7px!important;font-weight:500!important;box-shadow:none!important}
        #cities-container button:hover{background:#474755!important;color:white!important;transform:none!important}
        #cities-container button.bg-indigo-600{background:#555563!important;color:var(--dz-lime)!important}
        .dz-side-promo{margin-top:auto;background:linear-gradient(135deg,#9fa2d8,#7d83c0);border-radius:7px;padding:9px;color:#f8f8ff;min-height:52px;font-size:6px;line-height:1.35;position:relative;overflow:hidden}
        .dz-side-promo:after{content:"";position:absolute;width:42px;height:42px;border-radius:50%;right:-11px;bottom:-16px;background:rgba(255,255,255,.14)}
        .dz-side-promo b{display:block;font-size:7px;margin-bottom:2px}

        /* MAIN */
        .dz-content{min-width:0;background:var(--dz-main);padding:10px 12px 18px}
        .dz-topbar{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 2px 8px;gap:8px}
        .dz-top-left,.dz-top-right{display:flex;align-items:center;gap:6px}
        .dz-top-pill{height:22px;padding:0 8px;border-radius:5px;border:0;background:#555563;color:#d9d9e1;display:flex;align-items:center;gap:5px;font-size:6px;font-weight:600}
        .dz-top-pill i{font-size:6px;color:#d8ff22}
        .dz-icon-btn{width:22px;height:22px;border-radius:5px;border:0!important;background:#555563!important;color:#e6e6ec!important;display:flex;align-items:center;justify-content:center;font-size:7px;box-shadow:none!important}
        .dz-avatar{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#fff,#b8b8c3);display:flex;align-items:center;justify-content:center;color:#393946;font-size:8px;font-weight:800;border:2px solid #626270}

        [data-language-toggle]{position:relative;width:52px;height:22px;border:0;border-radius:5px;background:#555563;padding:2px;display:flex;align-items:center;justify-content:space-between;overflow:hidden;box-shadow:none!important}
        [data-language-toggle] .dz-lang-slider,#lang-slider{position:absolute;left:2px;top:2px;bottom:2px;width:calc(50% - 2px);background:var(--dz-lime)!important;border-radius:4px;transition:.22s ease}
        [data-language-toggle] span{position:relative;z-index:1;width:50%;text-align:center;font-size:6px;font-weight:800;color:#b9b9c3}
        [data-language-toggle] span:first-of-type{color:#282830}

        main{min-width:0}
        main>section{animation:dzScreen .2s ease}
        @keyframes dzScreen{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

        /* generic buttons */
        button:not([data-language-toggle]),a#map-link,a.mini-btn,.copy-map-btn{box-shadow:none;transition:.14s ease}
        .square-btn,.copy-map-btn{width:24px;height:24px;border-radius:5px;border:0!important;background:#656573!important;color:#f0f0f4!important;display:inline-flex;align-items:center;justify-content:center;font-size:7px}
        .square-btn:hover,.copy-map-btn:hover{background:var(--dz-lime)!important;color:#24242c!important;transform:none!important}
        .mini-btn,.action-btn{height:25px;padding:0 8px;border-radius:5px;border:0!important;background:#666674!important;color:#f2f2f6!important;font-size:7px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
        .mini-btn:hover,.action-btn:hover{background:var(--dz-lime)!important;color:#27272f!important;transform:none!important}
        button:disabled{opacity:.38!important;cursor:not-allowed!important}

        /* HOME — Main dashboard composition */
        #home-page{min-height:0!important}
        .dz-dashboard{display:flex;flex-direction:column;gap:10px}
        .dz-overview-board{display:grid;grid-template-columns:minmax(0,1fr) 178px;gap:9px}
        .dz-overview-main{display:grid;grid-template-columns:260px minmax(0,1fr);grid-template-rows:auto 1fr;gap:9px}
        .dz-kpi-strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;grid-column:1;grid-row:1}
        .dz-kpi{height:75px;background:var(--dz-panel);border-radius:7px;padding:10px;position:relative;overflow:hidden;color:white;border:0!important}
        .dz-kpi span{font-size:6px;color:#d0d0d7;display:flex;align-items:center;gap:5px;font-weight:600}.dz-kpi span i{font-size:7px}
        .dz-kpi strong{display:block;font-size:22px;line-height:1;margin-top:8px;font-weight:700;letter-spacing:-.045em}
        .dz-kpi-line{height:2px;width:24px;margin-top:9px;border-radius:5px;background:#a8a8b2}
        .dz-kpi-free .dz-kpi-line{background:var(--dz-free)}.dz-kpi-busy{background:var(--dz-cyan);color:#27272f}.dz-kpi-busy span{color:#34343d}.dz-kpi-busy .dz-kpi-line{background:#f4ff62}
        .dz-kpi-overdue .dz-kpi-line{background:var(--dz-red)}.dz-kpi-waiting .dz-kpi-line{background:var(--dz-yellow)}
        .dz-kpi-busy strong{color:#23232b}

        .dz-total-card{grid-column:2;grid-row:1 / span 2;background:var(--dz-lime);color:#26262e;border-radius:7px;padding:13px;min-height:160px;position:relative;overflow:hidden}
        .dz-total-card>span{font-size:7px;font-weight:600;opacity:.72}.dz-total-card>strong{display:block;font-size:32px;line-height:1;font-weight:800;letter-spacing:-.055em;margin-top:11px}
        .dz-sparkline{height:49px;display:flex;align-items:flex-end;gap:4px;margin-top:15px;padding-right:8px}.dz-sparkline i{width:3px;border-radius:4px;background:#5c6416;display:block}.dz-sparkline i:nth-child(1){height:11px}.dz-sparkline i:nth-child(2){height:18px}.dz-sparkline i:nth-child(3){height:15px}.dz-sparkline i:nth-child(4){height:28px}.dz-sparkline i:nth-child(5){height:26px}.dz-sparkline i:nth-child(6){height:38px}.dz-sparkline i:nth-child(7){height:42px}
        .dz-total-foot{position:absolute;left:13px;right:13px;bottom:12px;display:flex;align-items:flex-end;justify-content:space-between;border-top:1px solid rgba(38,38,46,.15);padding-top:8px}.dz-total-foot b{font-size:15px}.dz-total-foot small{font-size:6px;opacity:.65}

        .dz-activity-card{grid-column:2;grid-row:1 / span 2;background:var(--dz-panel);border-radius:7px;padding:10px;min-height:160px}
        .dz-section-head,.dz-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.dz-section-head span,.dz-panel-head span{font-size:7px;font-weight:700}.dz-section-head b{font-size:8px;color:#d5d5dd}.dz-panel-head i{font-size:7px;color:#c9c9d1}
        .dz-city-bars{display:flex;flex-direction:column;gap:7px}
        .dz-city-bar{border:0!important;background:transparent!important;padding:0!important;color:white!important;text-align:left!important;box-shadow:none!important;transform:none!important}
        .dz-city-bar-head{display:flex;align-items:center;justify-content:space-between;font-size:6px;color:#d7d7de;margin-bottom:4px}.dz-city-bar-head b{font-size:6px;color:#a8a8b3}
        .dz-city-meter{height:7px;border-radius:4px;background:#41414f;display:flex;overflow:hidden}.dz-city-meter i{height:100%;display:block}.dz-city-meter .free{background:var(--dz-free)}.dz-city-meter .busy{background:var(--dz-busy)}.dz-city-meter .overdue{background:var(--dz-overdue)}.dz-city-meter .waiting{background:var(--dz-waiting)}

        .dz-lower-grid{display:grid;grid-template-columns:1.05fr .8fr 1.25fr;gap:9px}
        .dz-panel{background:var(--dz-panel);border-radius:7px;padding:10px;min-height:145px}
        .dz-alert-row,.dz-soon-row{width:100%;height:31px;border:0!important;border-radius:5px!important;background:#626270!important;color:white!important;display:grid;align-items:center;gap:6px;padding:0 7px!important;text-align:left!important;margin-bottom:5px;box-shadow:none!important;transform:none!important}
        .dz-alert-row{grid-template-columns:18px minmax(0,1fr) auto}.dz-alert-index{width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#4b4b59;font-size:5px;color:#c8c8d0}.dz-alert-row b,.dz-soon-row b,.dz-recent-row b{font-size:6px;font-weight:600}.dz-alert-row small,.dz-soon-row small,.dz-recent-row small{display:block;font-size:5px;color:#bdbdc6;margin-top:1px}.dz-alert-row em,.dz-soon-row em,.dz-recent-row em{font-style:normal;font-size:5px;color:#d8ff22;white-space:nowrap}
        .dz-soon-row{grid-template-columns:minmax(0,1fr) auto}.dz-soon-row:hover,.dz-alert-row:hover{background:var(--dz-lime)!important;color:#292931!important}.dz-soon-row:hover em,.dz-alert-row:hover em{color:#292931}
        .dz-recent-row{height:31px;border-radius:5px;background:#626270;display:grid;grid-template-columns:7px minmax(0,1fr) auto;align-items:center;gap:7px;padding:0 7px;margin-bottom:5px}.dz-recent-dot{width:5px;height:5px;border-radius:50%;background:var(--dz-cyan)}
        .dz-empty{font-size:6px;color:#a9a9b3;padding:8px 2px}

        /* TERRITORIES — event-card language from the reference */
        #territories-page{display:flex;flex-direction:column;gap:9px}
        #city-controls{min-height:40px;background:transparent!important;border:0!important;box-shadow:none!important;padding:0 1px!important;display:flex;align-items:center!important}
        #active-city-title{font-size:14px!important;line-height:1;font-weight:700!important;letter-spacing:-.03em;color:white}
        #city-controls button{height:24px!important;min-width:24px;border:0!important;border-radius:5px!important;background:#575765!important;color:#eeeef2!important;font-size:7px!important;padding:0 7px!important;box-shadow:none!important}
        #city-controls button:hover{background:var(--dz-lime)!important;color:#282830!important;transform:none!important}
        #city-menu{top:calc(100% + 5px)!important;bottom:auto!important;right:0!important;width:145px!important;background:#555563!important;border:0!important;border-radius:7px!important;padding:5px!important;box-shadow:0 18px 45px rgba(0,0,0,.35)!important}
        #city-menu button{height:27px!important;width:100%!important;justify-content:flex-start!important;text-align:left!important;background:transparent!important;border-radius:5px!important}
        #city-menu button:hover{background:var(--dz-lime)!important;color:#282830!important}

        #territories-page>section.glass-panel{background:transparent!important;border:0!important;box-shadow:none!important;padding:0!important;display:flex!important;gap:8px!important;align-items:stretch!important}
        #territories-page>section.glass-panel>div:first-child{display:grid!important;grid-template-columns:repeat(4,minmax(95px,1fr));gap:7px!important;flex:1!important}
        #territories-page>section.glass-panel>div:first-child>div{height:49px!important;border-radius:6px!important;border:0!important;background:var(--dz-panel)!important;padding:7px 8px!important;box-shadow:none!important;display:flex!important;align-items:center!important;gap:7px!important}
        #territories-page>section.glass-panel>div:first-child>div>div:first-child{width:22px!important;height:22px!important;border-radius:5px!important}
        #territories-page>section.glass-panel>div:first-child span{font-size:5px!important;color:#c4c4cd!important}.dz-stat-number,#territories-page>section.glass-panel>div:first-child b{font-size:13px!important;line-height:1!important}
        #territories-page>section.glass-panel>div:last-child{display:flex!important;gap:5px!important;align-items:center!important}
        #territories-page>section.glass-panel>div:last-child>*,#map-link{height:49px!important;border:0!important;border-radius:6px!important;background:#555563!important;color:#ececf1!important;font-size:7px!important;min-width:45px;padding:0 10px!important;box-shadow:none!important}
        #territories-page>section.glass-panel>div:last-child>*:hover,#map-link:hover{background:var(--dz-lime)!important;color:#292930!important;transform:none!important}

        #grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px!important}
        #grid>article{min-height:174px!important;border:0!important;border-radius:7px!important;padding:10px!important;box-shadow:none!important;position:relative;overflow:hidden;transition:.16s ease!important}
        #grid>article:hover{transform:translateY(-2px)!important;box-shadow:0 12px 24px rgba(0,0,0,.18)!important}
        #grid>article[class*="bg-emerald-900"]{background:var(--dz-free)!important;color:#292930!important}
        #grid>article[class*="bg-blue-900"]{background:var(--dz-busy)!important;color:#292930!important}
        #grid>article[class*="bg-rose-900"]{background:var(--dz-overdue)!important;color:#292930!important}
        #grid>article[class*="bg-amber-900"]{background:var(--dz-waiting)!important;color:#292930!important}
        #grid>article .text-slate-400,#grid>article .text-slate-300,#grid>article .text-amber-100\/80,#grid>article .text-amber-300,#grid>article .text-sky-400{color:rgba(41,41,48,.66)!important}
        #grid>article h3{font-size:22px!important;line-height:1!important;color:#292930!important;letter-spacing:-.055em;margin-top:3px}
        #grid>article .badge{background:rgba(41,41,48,.12)!important;color:#292930!important;border:0!important;border-radius:5px!important;font-size:5px!important;padding:4px 6px!important}
        #grid>article>div:nth-of-type(2){font-size:7px!important;color:#292930!important;line-height:1.35!important}
        #grid>article>div:last-child{border-top:1px solid rgba(41,41,48,.15)!important;padding-top:8px!important}
        #grid>article .square-btn,#grid>article .copy-map-btn,#grid>article .mini-btn,#grid>article .action-btn,#grid>article button:not(:disabled){background:rgba(41,41,48,.15)!important;color:#292930!important;border:0!important}
        #grid>article .square-btn:hover,#grid>article .copy-map-btn:hover,#grid>article .mini-btn:hover,#grid>article .action-btn:hover,#grid>article button:not(:disabled):hover{background:#292930!important;color:white!important;transform:none!important}
        #grid>article .mini-btn{height:23px!important;border-radius:5px!important}

        /* PUBLISHERS — leaderboard composition */
        #publishers-page{max-width:none}
        #publishers-page>.glass-panel{background:transparent!important;border:0!important;box-shadow:none!important;padding:0!important;margin-bottom:8px!important}
        #publishers-title{font-size:13px!important;font-weight:700!important;letter-spacing:-.025em}
        #publishers-page>.glass-panel>div:first-child{margin-bottom:7px!important}
        #publisher-add-label{font-size:7px}
        #publishers-page button{border:0!important;border-radius:5px!important;background:#565664!important;color:white!important;box-shadow:none!important}
        #publishers-page button:hover{background:var(--dz-lime)!important;color:#292930!important;transform:none!important}
        #publishers-search,#publisher-picker-search,#dialog-fields input{height:31px!important;background:#555563!important;border:0!important;border-radius:5px!important;color:white!important;font-size:7px!important;outline:none!important;box-shadow:none!important}
        #publishers-search::placeholder,#publisher-picker-search::placeholder,#dialog-fields input::placeholder{color:#aaaab5!important}
        #publishers-search:focus,#publisher-picker-search:focus,#dialog-fields input:focus{box-shadow:0 0 0 1px var(--dz-lime)!important}
        #publishers-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px!important;align-items:start}
        #publishers-list>div{min-height:70px;background:var(--dz-panel)!important;border:0!important;border-radius:7px!important;padding:9px!important;box-shadow:none!important;display:flex!important;align-items:center!important;gap:8px!important;position:relative}
        #publishers-list>div:nth-child(n+4){grid-column:1/-1;min-height:35px;border-radius:5px!important;padding:5px 8px!important;background:#60606d!important}
        #publishers-list>div>b{font-size:7px!important}.dz-publisher-rank{width:22px;height:22px;border-radius:50%;background:#444451;color:#d8ff22;display:flex;align-items:center;justify-content:center;font-size:6px;font-weight:800;flex:0 0 22px}.dz-publisher-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#d8ff22,#28d9d5);border:2px solid #777785;color:#2c2c34;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;flex:0 0 28px}
        #publishers-list>div:nth-child(1){background:var(--dz-lime)!important;color:#292930!important}#publishers-list>div:nth-child(1) .dz-publisher-rank{background:#292930;color:var(--dz-lime)}
        #publishers-list>div:nth-child(2){background:#666674!important}#publishers-list>div:nth-child(3){background:#666674!important}
        #publishers-list>div>div:last-child{margin-left:auto}

        /* POPUPS */
        #dialog-modal,#confirm-modal,#history-modal,#publisher-picker-modal{background:rgba(18,18,25,.76)!important;backdrop-filter:blur(7px)!important}
        #dialog-modal>.glass-panel,#confirm-modal>.glass-panel,#history-modal>.glass-panel,#publisher-picker-modal>.glass-panel{background:var(--dz-sidebar)!important;border:0!important;border-radius:8px!important;box-shadow:0 28px 70px rgba(0,0,0,.48)!important;padding:13px!important}
        #dialog-modal h3,#history-modal h3,#publisher-picker-modal h3{font-size:9px!important}
        #dialog-modal .border-slate-800\/80,#history-modal .border-slate-800\/80,#publisher-picker-modal .border-slate-800\/80{border-color:rgba(255,255,255,.07)!important}
        #dialog-fields label>span{font-size:6px!important;color:#b2b2bc!important;letter-spacing:.02em!important;text-transform:none!important}
        #history-list>div{background:var(--dz-panel)!important;border:0!important;border-radius:6px!important;padding:8px!important;font-size:7px!important}
        #history-list p{font-size:6px!important;color:#c0c0c9!important}
        #publisher-picker-list button{height:31px!important;border:0!important;border-radius:5px!important;background:var(--dz-panel)!important;color:white!important;font-size:7px!important;padding:0 8px!important}
        #publisher-picker-list button:hover{background:var(--dz-lime)!important;color:#292930!important}

        .animate-fade-in{opacity:0;animation:dzCard .27s ease forwards}@keyframes dzCard{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
        ::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-track{background:#292936}::-webkit-scrollbar-thumb{background:#666674;border-radius:10px}

        /* MOBILE — phone layout from the reference, not compressed desktop */
        .dz-mobile-head{display:none}
        @media(max-width:1023px){
            body{background:var(--dz-sidebar);padding:0;min-height:100dvh}
            .dz-app{display:block;width:100%;min-height:100dvh;margin:0;border:0;border-radius:0;background:var(--dz-sidebar);box-shadow:none;overflow:visible}
            .dz-content{padding:0 12px 22px;background:var(--dz-sidebar)}
            .dz-topbar{display:none}
            .dz-mobile-head{height:56px;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;position:sticky;top:0;z-index:55;background:rgba(48,48,64,.96);backdrop-filter:blur(12px);margin:0 -12px 10px;padding:0 12px}
            .dz-mobile-menu{width:30px;height:30px;border:0!important;background:transparent!important;color:#eeeef3!important;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0!important;box-shadow:none!important}
            .dz-mobile-menu:hover{background:transparent!important;color:var(--dz-lime)!important;transform:none!important}
            .dz-mobile-wordmark{text-align:center;font-size:15px;font-weight:800;letter-spacing:-.06em;text-transform:lowercase}
            .dz-mobile-lang{justify-self:end;width:30px!important;height:30px!important;border-radius:7px!important;background:#555563!important;padding:0!important;display:flex!important;align-items:center!important;justify-content:center!important;color:white!important}
            .dz-mobile-lang .dz-lang-slider,.dz-mobile-lang>div{display:none!important}.dz-mobile-lang span{display:none!important}.dz-mobile-lang:after{content:attr(data-current-lang);font-size:7px;font-weight:800;color:white}

            #sidebar{display:flex!important;position:fixed;left:0;top:0;bottom:0;width:190px;min-height:100dvh;transform:translateX(-103%);transition:transform .2s ease;box-shadow:25px 0 70px rgba(0,0,0,.45);z-index:80}
            #sidebar.mobile-open{transform:translateX(0)}
            body.drawer-open:after{content:"";position:fixed;inset:0;background:rgba(14,14,20,.62);z-index:70}

            /* mobile homepage: top two cards + bright total + chart, like reference */
            .dz-dashboard{gap:8px!important}
            .dz-overview-board{display:grid;grid-template-columns:1fr;gap:8px}
            .dz-overview-main{display:contents}
            .dz-kpi-strip{grid-column:1;grid-row:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
            .dz-kpi{height:70px;border-radius:7px;padding:10px}.dz-kpi strong{font-size:22px;margin-top:8px}.dz-kpi span{font-size:6px}
            .dz-kpi-overdue,.dz-kpi-waiting{display:none}
            .dz-total-card{grid-column:1;grid-row:2;min-height:124px;border-radius:7px;padding:12px}.dz-total-card>strong{font-size:31px}.dz-sparkline{position:absolute;right:13px;top:22px;width:80px;height:52px;margin:0}.dz-total-foot{bottom:11px}
            .dz-activity-card{grid-column:1;grid-row:3;min-height:175px;border-radius:7px;padding:10px;background:var(--dz-panel)}
            .dz-city-bars{gap:9px}.dz-city-meter{height:9px}
            .dz-lower-grid{grid-template-columns:1fr;gap:8px}.dz-panel{min-height:auto;border-radius:7px;padding:10px}.dz-alert-row,.dz-soon-row,.dz-recent-row{height:36px}

            #territories-page{gap:7px}
            #city-controls{min-height:34px;padding:0!important}
            #active-city-title{font-size:12px!important}
            #territories-page>section.glass-panel{display:block!important}
            #territories-page>section.glass-panel>div:first-child{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px!important}
            #territories-page>section.glass-panel>div:first-child>div{height:45px!important}
            #territories-page>section.glass-panel>div:last-child{margin-top:6px;justify-content:flex-end!important}
            #territories-page>section.glass-panel>div:last-child>*,#map-link{height:31px!important;min-width:31px!important}
            #grid{grid-template-columns:1fr!important;gap:8px!important}
            #grid>article{min-height:148px!important;padding:10px!important;border-radius:7px!important}
            #grid>article h3{font-size:24px!important}

            #publishers-page>.glass-panel{padding:0!important}
            #publishers-list{grid-template-columns:1fr!important;gap:6px!important}
            #publishers-list>div,#publishers-list>div:nth-child(n+4){grid-column:auto;min-height:42px;border-radius:6px!important;background:var(--dz-panel)!important;padding:7px!important;color:white!important}
            #publishers-list>div:nth-child(1){background:var(--dz-lime)!important;color:#292930!important}
            #publishers-list>div:nth-child(1) .square-btn{background:rgba(41,41,48,.15)!important;color:#292930!important}

            #dialog-modal,#confirm-modal,#history-modal,#publisher-picker-modal{padding:10px!important}
            #dialog-modal>.glass-panel,#confirm-modal>.glass-panel,#history-modal>.glass-panel,#publisher-picker-modal>.glass-panel{width:100%!important;max-width:none!important;max-height:calc(100dvh - 20px)!important;border-radius:8px!important}
        }

        @media(min-width:1024px) and (max-width:1240px){
            .dz-app{grid-template-columns:170px minmax(0,1fr)}
            #grid{grid-template-columns:repeat(3,minmax(0,1fr))}
            .dz-overview-main{grid-template-columns:225px minmax(0,1fr)}
        }
        @media(min-width:1500px){#grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
    </style>
</head>
<body>
    <div class="dz-app">
        <aside id="sidebar">
            <div class="dz-brand">
                <div class="dz-brand-copy">
                    <div class="dz-wordmark">s13</div>
                    <h1 id="app-title">АССИСТЕНТ ПО УЧАСТКАМ</h1>
                    <p id="db-status"><span class="rounded-full bg-emerald-400"></span>Подключение...</p>
                </div>
                <div class="dz-grid-logo" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
            </div>

            <nav class="dz-nav">
                <button id="nav-home" onclick="showHomePage()" class="sidebar-btn"><i class="fa-solid fa-house"></i><span id="nav-home-label">Главная</span></button>
                <div>
                    <button id="nav-territories" onclick="toggleTerritoriesMenu()" class="sidebar-btn"><i class="fa-solid fa-map-location-dot"></i><span id="nav-territories-label" class="flex-1 text-left">Участки</span><i id="territory-chevron" class="fa-solid fa-chevron-down text-[6px] transition-transform"></i></button>
                    <div id="cities-container" class="hidden"></div>
                </div>
                <button id="nav-publishers" onclick="showPublishersPage()" class="sidebar-btn"><i class="fa-solid fa-users"></i><span id="nav-publishers-label">Возвещатели</span></button>
            </nav>

            <div class="dz-side-promo"><b>S-13</b>Управление участками и историей выдач в одном месте.</div>
        </aside>

        <div class="dz-content">
            <div class="dz-mobile-head">
                <button onclick="toggleMobileSidebar()" class="dz-mobile-menu" aria-label="Меню"><span class="dz-grid-logo"><i></i><i></i><i></i><i></i></span></button>
                <div class="dz-mobile-wordmark">s13</div>
                <button data-language-toggle class="dz-mobile-lang" data-current-lang="RU" onclick="toggleLanguage()" title="Сменить язык / Changer de langue"><div class="dz-lang-slider"></div><span>RU</span><span>FR</span></button>
            </div>

            <div class="dz-topbar">
                <div class="dz-top-left">
                    <div class="dz-top-pill"><i class="fa-solid fa-table-cells"></i>S-13</div>
                    <div class="dz-top-pill"><i class="fa-solid fa-circle-check"></i><span id="desktop-status-copy">online</span></div>
                </div>
                <div class="dz-top-right">
                    <button class="dz-icon-btn" title="Статус"><i class="fa-regular fa-bell"></i></button>
                    <button data-language-toggle onclick="toggleLanguage()" title="Сменить язык / Changer de langue"><div id="lang-slider" class="dz-lang-slider"></div><span>RU</span><span>FR</span></button>
                    <div class="dz-avatar">S</div>
                </div>
            </div>

            <main>
                <section id="home-page"></section>

                <section id="territories-page" class="hidden">
                    <div id="city-controls" class="hidden flex-wrap items-center justify-between gap-2">
                        <div class="min-w-0"><p class="hidden">Текущий город</p><h2 id="active-city-title"></h2></div>
                        <div class="flex gap-1">
                            <button onclick="addCity()"><i class="fa-solid fa-plus mr-1"></i><span id="btn-add-city-label">Город</span></button>
                            <div id="city-menu-wrap" class="relative">
                                <button onclick="editCityMenu()"><i class="fa-solid fa-pen"></i><span id="btn-edit-city-label" class="hidden">Изменить город</span></button>
                                <div id="city-menu" class="hidden absolute z-50 text-xs">
                                    <button onclick="renameCity();editCityMenu()"><i class="fa-solid fa-signature w-4 mr-1"></i>Название</button>
                                    <button onclick="editCityMap();editCityMenu()"><i class="fa-solid fa-earth-americas w-4 mr-1"></i>Ссылка на карту</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <section class="glass-panel flex flex-wrap items-center justify-between">
                        <div class="text-xs">
                            <div class="border border-emerald-500/20"><div class="bg-emerald-500/15 text-emerald-400 flex items-center justify-center"><i class="fa-solid fa-circle-check"></i></div><div><span id="stat-free-label" class="block uppercase">Свободно</span><b id="st-free" class="text-emerald-400">0</b></div></div>
                            <div class="border border-blue-500/20"><div class="bg-blue-500/15 text-blue-400 flex items-center justify-center"><i class="fa-solid fa-clock"></i></div><div><span id="stat-busy-label" class="block uppercase">В обработке</span><b id="st-busy" class="text-blue-400">0</b></div></div>
                            <div class="border border-rose-500/20"><div class="bg-rose-500/15 text-rose-400 flex items-center justify-center"><i class="fa-solid fa-triangle-exclamation"></i></div><div><span id="stat-overdue-label" class="block uppercase">Просрочено</span><b id="st-overdue" class="text-rose-400">0</b></div></div>
                            <div class="border border-amber-500/20"><div class="bg-amber-500/15 text-amber-400 flex items-center justify-center"><i class="fa-solid fa-hourglass-half"></i></div><div><span id="stat-waiting-label" class="block uppercase">Ожидание</span><b id="st-waiting" class="text-amber-400">0</b></div></div>
                        </div>
                        <div>
                            <button onclick="exportOfficialRegister()" title="S-13"><i class="fa-solid fa-download"></i></button>
                            <a id="map-link" href="#" target="_blank" class="items-center gap-1"><i class="fa-solid fa-map-location-dot"></i><span id="map-label">Карта</span></a>
                            <button onclick="addTerritory()"><i class="fa-solid fa-plus mr-1"></i><span id="add-territory-label">Участок</span></button>
                        </div>
                    </section>

                    <section id="grid"></section>
                </section>

                <section id="publishers-page" class="hidden">
                    <div class="glass-panel">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                            <div><p class="hidden">База данных</p><h2 id="publishers-title">Возвещатели</h2><p class="hidden"><span id="publishers-count">0</span> <span id="pub-base-label">в базе</span></p></div>
                            <button onclick="addPublisher()" class="h-8 px-3"><i class="fa-solid fa-user-plus mr-1"></i><span id="publisher-add-label">Добавить</span></button>
                        </div>
                        <div class="relative mt-2"><i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-[7px] text-slate-300"></i><input id="publishers-search" oninput="renderPublishers()" class="w-full pl-8 pr-3" placeholder="Поиск"></div>
                    </div>
                    <div id="publishers-list" class="mt-2"></div>
                </section>
            </main>
        </div>
    </div>

    <div id="dialog-modal" class="fixed inset-0 hidden items-center justify-center p-4 z-[90]"><div class="glass-panel max-w-md w-full"><div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-800/80"><h3 id="dialog-title" class="font-bold"></h3><button onclick="closeDialog(false)" class="square-btn"><i class="fa-solid fa-xmark"></i></button></div><div id="dialog-fields" class="space-y-2"></div><div class="flex justify-end gap-1 mt-4 pt-3 border-t border-slate-800/80"><button onclick="closeDialog(false)" class="mini-btn">Отмена</button><button onclick="closeDialog(true)" class="mini-btn">ОК</button></div></div></div>

    <div id="confirm-modal" class="fixed inset-0 hidden items-center justify-center p-4 z-[100]"><div class="glass-panel max-w-sm w-full"><div class="w-8 h-8 rounded-md bg-rose-500/15 text-rose-300 flex items-center justify-center mb-3"><i class="fa-solid fa-triangle-exclamation text-xs"></i></div><p id="confirm-text" class="text-[8px] text-slate-200 mb-4 leading-relaxed"></p><div class="flex justify-end gap-1"><button onclick="closeConfirm(false)" class="mini-btn">Отмена</button><button onclick="closeConfirm(true)" class="mini-btn">Подтвердить</button></div></div></div>

    <div id="history-modal" class="fixed inset-0 hidden items-center justify-center p-4 z-[90]"><div class="glass-panel max-w-lg w-full"><div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-800/80"><h3 id="history-title" class="font-bold"></h3><button onclick="closeHistory()" class="square-btn"><i class="fa-solid fa-xmark"></i></button></div><div id="history-list" class="space-y-1.5 max-h-[62vh] overflow-y-auto pr-1"></div></div></div>

    <div id="publisher-picker-modal" class="fixed inset-0 hidden items-center justify-center p-4 z-[100]"><div class="glass-panel max-w-md w-full"><div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-800/80"><h3 id="publisher-picker-title" class="font-bold">Возвещатель</h3><button onclick="closePicker()" class="square-btn"><i class="fa-solid fa-xmark"></i></button></div><div class="relative mb-2"><i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-[7px] text-slate-300"></i><input id="publisher-picker-search" oninput="renderPicker()" class="w-full pl-8 pr-3" placeholder="Поиск"></div><div id="publisher-picker-list" class="space-y-1.5 max-h-[55vh] overflow-y-auto pr-1"></div></div></div>

    <script type="module" src="./app.js"></script>
</body>
</html>
