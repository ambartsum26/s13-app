<!DOCTYPE html>
<html lang="ru" id="html-root" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Ассистент по участкам</title>
<script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:'class'}</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
.sidebar-btn{display:flex;align-items:center;gap:.65rem;width:100%;min-height:2.75rem;padding:.65rem .8rem;border-radius:.85rem;color:#cbd5e1;font-size:.8rem;font-weight:700;transition:.2s}.sidebar-btn:hover{background:#1e293b;color:#fff}.sidebar-btn.nav-active{background:#4f46e5;color:#fff}.badge{padding:.25rem .6rem;border-radius:.55rem;border-width:1px;font-size:.625rem;font-weight:700}.square-btn{width:2rem;height:2rem;border-radius:.75rem;background:rgba(15,23,42,.65);border:1px solid rgba(255,255,255,.1)}.mini-btn,.action-btn{display:inline-flex;align-items:center;height:2rem;padding:0 .75rem;border-radius:.75rem;background:rgba(15,23,42,.55);border:1px solid rgba(255,255,255,.1);font-size:.75rem;font-weight:600}@media(max-width:1023px){#sidebar.mobile-open{display:block;position:fixed;z-index:60;left:1rem;right:1rem;top:5.5rem;width:auto;max-height:calc(100vh - 7rem);overflow:auto}}
</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans p-4 sm:p-6 md:p-8">
<header class="max-w-7xl mx-auto bg-slate-900/85 border border-slate-800 rounded-3xl p-4 md:p-5 mb-6 shadow-2xl flex items-center justify-between gap-4">
 <div class="flex items-center gap-3"><button onclick="toggleMobileSidebar()" class="lg:hidden w-10 h-10 rounded-xl bg-slate-800 border border-slate-700"><i class="fa-solid fa-bars"></i></button><div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center"><i class="fa-solid fa-location-dot"></i></div><div><h1 id="app-title" class="font-extrabold text-base">АССИСТЕНТ ПО УЧАСТКАМ</h1><p id="db-status" class="text-[11px] text-emerald-400 flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>Подключение к Firebase...</p></div></div>
 <button onclick="toggleLanguage()" class="relative w-24 h-10 bg-slate-950 rounded-xl border border-slate-800 p-1 flex items-center justify-between overflow-hidden"><div id="lang-slider" class="absolute top-1 bottom-1 w-[calc(50%-4px)] bg-emerald-500 rounded-lg transition-all"></div><span class="relative z-10 w-1/2 text-center text-xs font-bold">RU</span><span class="relative z-10 w-1/2 text-center text-xs font-bold">FR</span></button>
</header>
<div class="max-w-7xl mx-auto flex gap-6 items-start">
<aside id="sidebar" class="hidden lg:block w-64 shrink-0 bg-slate-900/85 border border-slate-800 rounded-3xl p-3 shadow-2xl lg:sticky lg:top-4"><nav class="space-y-2">
 <button id="nav-home" onclick="showHomePage()" class="sidebar-btn"><i class="fa-solid fa-house w-5"></i><span id="nav-home-label">Главная</span></button>
 <div><button id="nav-territories" onclick="toggleTerritoriesMenu()" class="sidebar-btn"><i class="fa-solid fa-map-location-dot w-5"></i><span id="nav-territories-label" class="flex-1 text-left">Участки</span><i id="territory-chevron" class="fa-solid fa-chevron-down text-[10px] transition-transform"></i></button><div id="cities-container" class="hidden mt-2 ml-3 pl-3 border-l border-slate-700 space-y-1"></div></div>
 <button id="nav-publishers" onclick="showPublishersPage()" class="sidebar-btn"><i class="fa-solid fa-users w-5"></i><span id="nav-publishers-label">Возвещатели</span></button>
</nav></aside>
<main class="flex-1 min-w-0 space-y-6">
 <section id="home-page" class="min-h-[55vh] bg-slate-900/25 border border-slate-800/60 rounded-3xl"></section>
 <section id="territories-page" class="hidden space-y-6">
  <div id="city-controls" class="hidden bg-slate-900/85 border border-slate-800 rounded-3xl p-4 shadow-2xl flex-wrap items-center justify-between gap-3"><h2 id="active-city-title" class="font-extrabold text-lg"></h2><div class="flex gap-2"><button onclick="addCity()" class="h-10 px-3.5 bg-slate-800 rounded-xl border border-slate-700 text-xs font-semibold"><i class="fa-solid fa-plus text-indigo-400 mr-1.5"></i><span id="btn-add-city-label">Город</span></button><div id="city-menu-wrap" class="relative"><button onclick="editCityMenu()" class="h-10 px-3.5 bg-slate-800 rounded-xl border border-slate-700 text-xs font-semibold"><i class="fa-solid fa-pen mr-1.5"></i><span id="btn-edit-city-label">Изменить город</span></button><div id="city-menu" class="hidden absolute right-0 mt-2 w-56 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl py-2 z-50 text-xs"><button onclick="renameCity();editCityMenu()" class="w-full text-left px-4 py-2.5 hover:bg-slate-800">Изменить название</button><button onclick="editCityMap();editCityMenu()" class="w-full text-left px-4 py-2.5 hover:bg-slate-800">Изменить ссылку на карту</button></div></div></div></div>
  <section class="flex flex-wrap items-center justify-between gap-4 bg-slate-900/75 border border-slate-800 p-4 rounded-3xl shadow-2xl"><div class="flex flex-wrap gap-3 text-xs"><div class="px-3 py-2 rounded-2xl bg-emerald-950/30 border border-emerald-500/20"><span id="stat-free-label" class="text-slate-400 text-[9px] block uppercase">Свободно</span><b id="st-free" class="text-emerald-400">0</b></div><div class="px-3 py-2 rounded-2xl bg-blue-950/30 border border-blue-500/20"><span id="stat-busy-label" class="text-slate-400 text-[9px] block uppercase">В обработке</span><b id="st-busy" class="text-blue-400">0</b></div><div class="px-3 py-2 rounded-2xl bg-rose-950/30 border border-rose-500/20"><span id="stat-overdue-label" class="text-slate-400 text-[9px] block uppercase">Просрочено</span><b id="st-overdue" class="text-rose-400">0</b></div><div class="px-3 py-2 rounded-2xl bg-amber-950/30 border border-amber-500/20"><span id="stat-waiting-label" class="text-slate-400 text-[9px] block uppercase">Ожидание</span><b id="st-waiting" class="text-amber-400">0</b></div></div><div class="flex gap-2"><button onclick="exportOfficialRegister()" class="w-10 h-10 bg-slate-800 rounded-xl border border-slate-700 text-emerald-400"><i class="fa-solid fa-download"></i></button><a id="map-link" href="#" target="_blank" class="h-10 px-4 bg-indigo-600 rounded-xl text-xs font-semibold items-center gap-1.5"><i class="fa-solid fa-map-location-dot"></i><span id="map-label">Карта</span></a><button onclick="addTerritory()" class="h-10 px-4 bg-slate-800 rounded-xl border border-slate-700 text-xs font-semibold"><i class="fa-solid fa-plus text-indigo-400 mr-1.5"></i><span id="add-territory-label">Участок</span></button></div></section>
  <section id="grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4"></section>
 </section>
 <section id="publishers-page" class="hidden space-y-4"><div class="bg-slate-900/85 border border-slate-800 rounded-3xl p-5 shadow-2xl"><div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4"><div><h2 id="publishers-title" class="text-xl font-extrabold">Возвещатели</h2><p class="text-xs text-slate-400"><span id="publishers-count">0</span> <span id="pub-base-label">в базе</span></p></div><button onclick="addPublisher()" class="h-10 px-4 bg-indigo-600 rounded-xl text-xs font-bold"><i class="fa-solid fa-user-plus mr-1.5"></i><span id="publisher-add-label">Добавить возвещателя</span></button></div><input id="publishers-search" oninput="renderPublishers()" class="w-full h-10 bg-slate-950 border border-slate-800 rounded-xl px-3 text-xs focus:outline-none focus:border-indigo-500" placeholder="Поиск по имени"></div><div id="publishers-list" class="space-y-2"></div></section>
</main></div>

<div id="dialog-modal" class="fixed inset-0 bg-slate-950/80 hidden items-center justify-center p-4 z-[70]"><div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-5 shadow-2xl"><div class="flex justify-between mb-4"><h3 id="dialog-title" class="font-bold"></h3><button onclick="closeDialog(false)" class="square-btn"><i class="fa-solid fa-xmark"></i></button></div><div id="dialog-fields" class="space-y-3"></div><div class="flex justify-end gap-2 mt-5"><button onclick="closeDialog(false)" class="h-10 px-4 bg-slate-800 rounded-xl text-xs">Отмена</button><button onclick="closeDialog(true)" class="h-10 px-5 bg-indigo-600 rounded-xl text-xs font-bold">ОК</button></div></div></div>
<div id="confirm-modal" class="fixed inset-0 bg-slate-950/80 hidden items-center justify-center p-4 z-[80]"><div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-sm w-full p-5"><p id="confirm-text" class="text-sm mb-5"></p><div class="flex justify-end gap-2"><button onclick="closeConfirm(false)" class="h-10 px-4 bg-slate-800 rounded-xl text-xs">Отмена</button><button onclick="closeConfirm(true)" class="h-10 px-4 bg-rose-600 rounded-xl text-xs font-bold">Подтвердить</button></div></div></div>
<div id="history-modal" class="fixed inset-0 bg-slate-950/80 hidden items-center justify-center p-4 z-[70]"><div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-lg w-full p-5"><div class="flex justify-between mb-4"><h3 id="history-title" class="font-bold"></h3><button onclick="closeHistory()" class="square-btn"><i class="fa-solid fa-xmark"></i></button></div><div id="history-list" class="space-y-2 max-h-[55vh] overflow-y-auto"></div></div></div>
<div id="publisher-picker-modal" class="fixed inset-0 bg-slate-950/80 hidden items-center justify-center p-4 z-[80]"><div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-5"><div class="flex justify-between mb-4"><h3 id="publisher-picker-title" class="font-bold">Выберите возвещателя</h3><button onclick="closePicker()" class="square-btn"><i class="fa-solid fa-xmark"></i></button></div><input id="publisher-picker-search" oninput="renderPicker()" class="w-full h-10 bg-slate-950 border border-slate-800 rounded-xl px-3 text-xs mb-3 focus:outline-none focus:border-indigo-500" placeholder="Поиск по имени"><div id="publisher-picker-list" class="space-y-2 max-h-[50vh] overflow-y-auto"></div></div></div>
<script type="module" src="./app.js"></script>
</body></html>
