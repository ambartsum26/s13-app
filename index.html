            </div>
        </section>

        <!-- Сетка карточек -->

            {number: "8", history: [{publisher: "Yaroslav Romano", issuedAt: "2025-10-03", returnedAt: "2025-10-11"}]},
            {number: "9", history: [{publisher: "Vitalii Litvinchuk", issuedAt: "2025-10-13", returnedAt: "2025-11-09"}]},
            {number: "10", history: [{publisher: "Brozik Zinaida", issuedAt: "2025-10-13", returnedAt: "2025-11-24"}]},
            {number: "11", history: [{publisher: "Kovalchyk Valerii", issuedAt: "2025-10-19", returnedAt: "2025-10-24"}]},
            {number: "12", history: [{publisher: "Kovalchyk Valerii", issuedAt: "2025-10-19", returnedAt: "2025-10-24"}]},
            {number: "13", history: [{publisher: "Alena Beruso", issuedAt: "2025-10-20", returnedAt: null}]},
            {number: "14", history: [{publisher: "Valentina Ermolayva", issuedAt: "2025-04-22", returnedAt: "2025-05-01"}]},
            {number: "15", history: [{publisher: "Kovalchyk Valerii", issuedAt: "2025-10-19", returnedAt: "2025-10-24"}]},
            {number: "16", history: [{publisher: "Valera", issuedAt: "2025-10-24", returnedAt: "2025-10-27"}]},
            {number: "17", history: [{publisher: "Kravtsov O.", issuedAt: "2025-10-24", returnedAt: "2025-10-24"}]},
            {number: "18", history: [{publisher: "Kravtsov O.", issuedAt: "2025-10-24", returnedAt: "2025-10-24"}]},
            {number: "19", history: [{publisher: "Yaroslav Romanov", issuedAt: "2025-10-24", returnedAt: "2025-11-06"}]},
            {number: "20", history: [{publisher: "Yaroslav Romanov", issuedAt: "2025-10-24", returnedAt: "2025-11-06"}]}
        ];

        function initApp() {
            onSnapshot(collection(db, "cities"), async (snapshot) => {
                citiesData = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                document.getElementById('db-status').innerText = '● Firebase подключен';

                // Проверяем и создаем Валенс, если его нет
                let valenceCity = citiesData.find(c => c.name === "Valence");
                if (!valenceCity) {
                    const valenceRef = await addDoc(collection(db, "cities"), { 
                        name: "Valence",
                        mapUrl: "https://www.google.com/maps/d/edit?mid=1F--67sV9pTds54DmFxs1Lmz7SwRHlsw&ll=44.91635564862983%2C4.904553349999974&z=13"
                    });
                    for (const item of valenceTerritories) {
                        await addDoc(collection(db, "territories"), {
                            cityId: valenceRef.id,
                            number: item.number,
                            isArchived: false,
                            history: item.history
                        });
                    }
                    return; // Сработает повторный снэпшот после добавления
                }

                // Проверяем и создаем Гийеран-Гранж, если его нет
                let guilherandCity = citiesData.find(c => c.name === "Guilherand-Granges");
                if (!guilherandCity) {
                    const guilherandRef = await addDoc(collection(db, "cities"), { 
                        name: "Guilherand-Granges",
                        mapUrl: "https://www.google.com/maps/d/viewer?mid=1HTtzXu4-uTSSwQPb9Ip1xKSrdVB0low"
                    });
                    for (const item of guilherandTerritories) {
                        await addDoc(collection(db, "territories"), {
                            cityId: guilherandRef.id,
                            number: item.number,
                            isArchived: false,
                            history: item.history
                        });
                    }
                    return; // Сработает повторный снэпшот после добавления
                }

                if (!activeCityId || !citiesData.find(c => c.id === activeCityId)) {
                    activeCityId = citiesData[0].id;
                }

                renderCities();
                subscribeToTerritories();
            });
        }

        let unsubscribeTerritories = null;
        function subscribeToTerritories() {
            if (unsubscribeTerritories) unsubscribeTerritories();

            const q = query(
                collection(db, "territories"), 
                where("cityId", "==", activeCityId),
                where("isArchived", "==", false)
            );

            unsubscribeTerritories = onSnapshot(q, (snapshot) => {
                territoriesData = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                territoriesData.sort((a, b) => parseInt(a.number) - parseInt(b.number) || a.number.localeCompare(b.number));
                renderTerritories();
                
                if (currentEditingTerritoryId) {
                    window.showHistory(currentEditingTerritoryId);
                }
            });
        }

        // --- УПРАВЛЕНИЕ ГОРОДАМИ ---
        window.addCity = async () => {
            const name = prompt('Название нового города:');
            if (!name) return;
            const mapLink = prompt('Ссылка на Google My Maps для этого города:', 'https://www.google.com/maps/d/');
            await addDoc(collection(db, "cities"), { 
                name: name.trim(),
                mapUrl: mapLink ? mapLink.trim() : '#'
            });
        };

        window.editCity = async () => {
            const city = citiesData.find(c => c.id === activeCityId);
            if (!city) return;
            const newName = prompt('Новое название города:', city.name);
            if (newName === null) return;

            const newMapUrl = prompt('Ссылка на Google My Maps:', city.mapUrl || '');
            if (newMapUrl === null) return;

            await updateDoc(doc(db, "cities", activeCityId), { 
                name: newName.trim(),
                mapUrl: newMapUrl.trim()
            });
        };

        // --- УПРАВЛЕНИЕ УЧАСТКАМИ ---
        window.addTerritory = async () => {
            const num = prompt('Номер участка (например: 78 или 12-А):');
            if (!num) return;

            await addDoc(collection(db, "territories"), {
                cityId: activeCityId,
                number: num.trim(),
                isArchived: false,
                history: []
            });
        };

        window.editTerritory = async (id) => {
            const t = territoriesData.find(item => item.id === id);
            const newNum = prompt('Новый номер участка:', t.number);
            if (newNum !== null && newNum.trim() !== '') {
                await updateDoc(doc(db, "territories", id), {
                    number: newNum.trim()
                });
            }
        };

        window.archiveTerritory = async (id) => {
            const t = territoriesData.find(item => item.id === id);
            if (confirm(`Архивировать участок №${t.number}?`)) {
                await updateDoc(doc(db, "territories", id), { isArchived: true });
            }
        };

        window.issueTerritory = async (id) => {
            const name = prompt('ФИО возвещателя, которому выдаётся участок:');
            if (!name) return;
            const t = territoriesData.find(item => item.id === id);
            const history = t.history || [];
            history.push({
                publisher: name.trim(),
                issuedAt: new Date().toISOString().split('T')[0],
                returnedAt: null
            });
            await updateDoc(doc(db, "territories", id), { history });
        };

        window.returnTerritory = async (id) => {
            const t = territoriesData.find(item => item.id === id);
            const history = t.history || [];
            if (history.length > 0) {
                history[history.length - 1].returnedAt = new Date().toISOString().split('T')[0];
                await updateDoc(doc(db, "territories", id), { history });
            }
        };

        // --- УПРАВЛЕНИЕ ИСТОРИЕЙ (МОДАЛЬНОЕ ОКНО) ---
        window.showHistory = (id) => {
            currentEditingTerritoryId = id;
            const t = territoriesData.find(item => item.id === id);
            if (!t) return;

            document.getElementById('modal-title').innerText = `История участка №${t.number}`;
            const listContainer = document.getElementById('modal-history-list');
            listContainer.innerHTML = '';

            if (!t.history || t.history.length === 0) {
                listContainer.innerHTML = '<p class="text-xs text-slate-500 italic py-2">История пуста.</p>';
            } else {
                t.history.forEach((h, index) => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'bg-slate-950 border border-slate-800 p-3 rounded-xl flex items-center justify-between gap-2 text-xs';
                    itemDiv.innerHTML = `
                        <div class="space-y-1">
                            <p class="font-bold text-white"><span class="text-indigo-400">#${index + 1}</span> ${h.publisher}</p>
                            <p class="text-slate-400">Выдан: <span class="text-slate-200">${h.issuedAt}</span> | Сдан: <span class="${h.returnedAt ? 'text-emerald-400' : 'text-amber-400 font-semibold'}">${h.returnedAt || 'В ОБРАБОТКЕ'}</span></p>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="editHistoryItem(${index})" title="Редактировать запись" class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button onclick="deleteHistoryItem(${index})" title="Удалить запись" class="p-1.5 bg-slate-800 hover:bg-rose-900/40 text-rose-400 rounded">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    `;
                    listContainer.appendChild(itemDiv);
                });
            }

            document.getElementById('history-modal').classList.remove('hidden');
            document.getElementById('history-modal').classList.add('flex');
        };

        window.closeHistoryModal = () => {
            currentEditingTerritoryId = null;
            document.getElementById('history-modal').classList.add('hidden');
            document.getElementById('history-modal').classList.remove('flex');
        };

        window.editHistoryItem = async (index) => {
            const t = territoriesData.find(item => item.id === currentEditingTerritoryId);
            if (!t || !t.history[index]) return;
            const h = t.history[index];

            const newPub = prompt('ФИО возвещателя:', h.publisher);
            if (newPub === null) return;

            const newIssued = prompt('Дата выдачи (ГГГГ-ММ-ДД):', h.issuedAt);
            if (newIssued === null) return;

            const newReturned = prompt('Дата возврата (ГГГГ-ММ-ДД или оставьте пустым, если в обработке):', h.returnedAt || '');
            if (newReturned === null) return;

            t.history[index] = {
                publisher: newPub.trim(),
                issuedAt: newIssued.trim(),
                returnedAt: newReturned.trim() !== '' ? newReturned.trim() : null
            };

            await updateDoc(doc(db, "territories", t.id), { history: t.history });
        };

        window.deleteHistoryItem = async (index) => {
            const t = territoriesData.find(item => item.id === currentEditingTerritoryId);
            if (!t || !t.history[index]) return;

            if (confirm(`Удалить запись #${index + 1} (${t.history[index].publisher})?`)) {
                t.history.splice(index, 1);
                await updateDoc(doc(db, "territories", t.id), { history: t.history });
            }
        };

        // --- ОТРИСОВКА ---
        function renderCities() {
            const container = document.getElementById('cities-container');
            container.innerHTML = '';
            citiesData.forEach(c => {
                const btn = document.createElement('button');
                btn.className = `px-3 py-1.5 rounded-lg text-xs font-medium transition ${c.id === activeCityId ? 'bg-indigo-600 text-white font-semibold' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`;
                btn.innerText = c.name;
                btn.onclick = () => { activeCityId = c.id; renderCities(); subscribeToTerritories(); };
                container.appendChild(btn);

                // Обновляем ссылку на карту для активного города
                if (c.id === activeCityId) {
                    const mapLinkBtn = document.getElementById('map-link');
                    if (c.mapUrl) {
                        mapLinkBtn.href = c.mapUrl;
                        mapLinkBtn.style.display = 'flex';
                    } else {
                        mapLinkBtn.style.display = 'none';
                    }
                }
            });
        }

        function renderTerritories() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            let free = 0, busy = 0, overdue = 0;

            territoriesData.forEach(t => {
                const lastRec = t.history && t.history.length > 0 ? t.history[t.history.length - 1] : null;
                const isBusy = lastRec && !lastRec.returnedAt;
                
                let days = 0, isOverdue = false;
                if (isBusy) {
                    days = Math.floor((new Date() - new Date(lastRec.issuedAt)) / (1000 * 60 * 60 * 24));
                    if (days > 120) isOverdue = true;
                }

                if (!isBusy) free++; else if (isOverdue) overdue++; else busy++;

                let badge = '<span class="px-2 py-0.5 rounded text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Свободен</span>';
                if (isBusy && !isOverdue) badge = `<span class="px-2 py-0.5 rounded text-[10px] bg-blue-500/10 text-blue-400 border border-blue-500/20">В обработке (${days} дн.)</span>`;
                if (isOverdue) badge = `<span class="px-2 py-0.5 rounded text-[10px] bg-rose-500/10 text-rose-400 border border-rose-500/20">Просрочен (${days} дн.)</span>`;

                const card = document.createElement('div');
                card.className = 'bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col justify-between space-y-3';
                card.innerHTML = `
                    <div class="flex items-start justify-between">
                        <div>
                            <span class="text-[10px] text-indigo-400 font-bold uppercase">Участок</span>
                            <h3 class="text-lg font-bold text-white">№ ${t.number}</h3>
                        </div>
                        ${badge}
                    </div>
                    <div class="text-xs text-slate-400 min-h-[32px]">
                        ${isBusy ? `<p><i class="fa-solid fa-user text-slate-500 mr-1"></i> <strong>${lastRec.publisher}</strong></p>` : '<p class="text-slate-600 italic">Никому не выдан</p>'}
                    </div>
                    <div class="pt-2 border-t border-slate-800 flex items-center justify-between gap-1">
                        <div class="flex space-x-1">
                            <button onclick="editTerritory('${t.id}')" title="Редактировать" class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button onclick="showHistory('${t.id}')" title="История" class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-xs">
                                <i class="fa-solid fa-clock-rotate-left"></i>
                            </button>
                            <button onclick="archiveTerritory('${t.id}')" title="В архив" class="p-1.5 bg-slate-800 hover:bg-rose-900/40 text-rose-400 rounded text-xs">
                                <i class="fa-solid fa-box-archive"></i>
                            </button>
                        </div>
                        ${!isBusy 
                            ? `<button onclick="issueTerritory('${t.id}')" class="px-3 py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded text-xs font-semibold">Выдать</button>`
                            : `<button onclick="returnTerritory('${t.id}')" class="px-3 py-1 bg-slate-800 hover:bg-emerald-600 text-slate-200 hover:text-white rounded text-xs font-semibold">Сдать</button>`
                        }
                    </div>
                `;
                grid.appendChild(card);
            });

            document.getElementById('st-free').innerText = free;
            document.getElementById('st-busy').innerText = busy;
            document.getElementById('st-overdue').innerText = overdue;
        }

        initApp();
    </script>
</body>
</html>
