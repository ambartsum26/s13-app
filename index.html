<!DOCTYPE html>
<html lang="ru" id="html-root" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ассистент по участкам</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; }
        html { background: #020617; }
        body { overflow-x: hidden; }

        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            opacity: 0;
            animation: fadeInUp .42s ease forwards;
        }

        .glass-panel {
            background: linear-gradient(145deg, rgba(15,23,42,.92), rgba(15,23,42,.72));
            border: 1px solid rgba(51,65,85,.78);
            box-shadow: 0 22px 60px rgba(2,6,23,.28);
            backdrop-filter: blur(20px);
        }

        .sidebar-btn {
            display: flex;
            align-items: center;
            gap: .7rem;
            width: 100%;
            min-height: 2.9rem;
            padding: .68rem .85rem;
            border-radius: .95rem;
            color: #cbd5e1;
            font-size: .8rem;
            font-weight: 700;
            transition: all .2s ease;
            border: 1px solid rgba(71,85,105,.5);
            background: transparent !important;
            box-shadow: none !important;
        }

        .sidebar-btn.nav-active {
            background: transparent !important;
            color: #6ee7b7 !important;
            border-color: rgba(16,185,129,.72) !important;
            box-shadow: none !important;
        }

        #cities-container button { transition: all .2s ease; }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: .28rem .65rem;
            border-radius: .65rem;
            border-width: 1px;
            font-size: .625rem;
            line-height: 1;
            font-weight: 700;
            white-space: nowrap;
        }

        .square-btn,
        .mini-btn,
        .action-btn,
        .copy-map-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(100,116,139,.65) !important;
            background: transparent !important;
            color: #e2e8f0 !important;
            box-shadow: none !important;
            transition: background-color .2s ease, border-color .2s ease, color .2s ease, transform .2s ease, box-shadow .2s ease;
        }

        .square-btn,
        .copy-map-btn {
            width: 2rem;
            height: 2rem;
            border-radius: .75rem;
        }

        .mini-btn,
        .action-btn {
            height: 2rem;
            padding: 0 .78rem;
            border-radius: .78rem;
            font-size: .75rem;
            font-weight: 650;
        }

        /* ЕДИНЫЙ СТИЛЬ ВСЕХ КНОПОК, КРОМЕ ПЕРЕКЛЮЧАТЕЛЯ ЯЗЫКА */
        button:not([data-language-toggle]),
        a#map-link,
        a.mini-btn {
            background: transparent !important;
            border: 1px solid rgba(100,116,139,.65) !important;
            color: #e2e8f0 !important;
            box-shadow: none !important;
            transition: background-color .2s ease, border-color .2s ease, color .2s ease, transform .2s ease, box-shadow .2s ease !important;
        }

        button:not([data-language-toggle]):not(:disabled):hover,
        a#map-link:hover,
        a.mini-btn:hover,
        .copy-map-btn:hover {
            background: #10b981 !important;
            border-color: #34d399 !important;
            color: #ffffff !important;
            box-shadow: 0 10px 26px rgba(16,185,129,.24) !important;
            transform: translateY(-1px);
        }

        button:not([data-language-toggle]):focus-visible,
        a#map-link:focus-visible,
        a.mini-btn:focus-visible {
            outline: 2px solid rgba(52,211,153,.85);
            outline-offset: 2px;
        }

        button:disabled {
            opacity: .42 !important;
            cursor: not-allowed !important;
        }

        #cities-container button.bg-indigo-600 {
            background: transparent !important;
            color: #6ee7b7 !important;
            border: 1px solid rgba(16,185,129,.72) !important;
        }

        #cities-container button:hover {
            background: #10b981 !important;
            color: #fff !important;
            border-color: #34d399 !important;
            transform: translateX(2px);
        }

        #grid > article {
            position: relative;
            overflow: hidden;
            min-height: 248px;
            backdrop-filter: blur(18px);
            transition: transform .24s ease, border-color .24s ease, box-shadow .24s ease;
        }

        #grid > article::before {
            content: '';
            position: absolute;
            inset: 0 0 auto 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.22), transparent);
            pointer-events: none;
        }

        #grid > article:hover {
            transform: translateY(-3px);
            box-shadow: 0 24px 55px rgba(2,6,23,.36);
        }

        #publishers-list > div {
            background: linear-gradient(145deg, rgba(15,23,42,.86), rgba(15,23,42,.62));
            border-color: rgba(51,65,85,.8);
            box-shadow: 0 12px 30px rgba(2,6,23,.18);
            transition: border-color .2s, transform .2s, background-color .2s;
        }

        #publishers-list > div:hover {
            border-color: rgba(16,185,129,.4);
            transform: translateY(-1px);
        }

        input { color-scheme: dark; }

        @media (max-width: 1023px) {
            #sidebar.mobile-open {
                display: block;
                position: fixed;
                z-index: 60;
                left: 1rem;
                right: 1rem;
                top: 5.75rem;
                width: auto;
                max-height: calc(100vh - 7rem);
                overflow: auto;
                box-shadow: 0 24px 80px rgba(2,6,23,.72);
            }
        }
    </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-indigo-500 selection:text-white p-3 sm:p-5 md:p-7">

    <header class="max-w-[1600px] mx-auto glass-panel rounded-3xl p-4 md:p-5 mb-5 md:mb-6 flex items-center justify-between gap-4">
        <div class="flex items-center gap-3 min-w-0">
            <button onclick="toggleMobileSidebar()"
                    class="lg:hidden w-10 h-10 shrink-0 rounded-xl border text-slate-200">
                <i class="fa-solid fa-bars"></i>
            </button>

            <div class="w-10 h-10 shrink-0 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-lg shadow-indigo-600/25">
                <i class="fa-solid fa-location-dot"></i>
            </div>

            <div class="min-w-0">
                <h1 id="app-title" class="font-extrabold text-sm sm:text-base tracking-tight text-white truncate">АССИСТЕНТ ПО УЧАСТКАМ</h1>
                <p id="db-status" class="text-[11px] text-emerald-400 font-medium flex items-center gap-1.5 mt-0.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>Подключение к Firebase...
                </p>
            </div>
        </div>

        <button data-language-toggle onclick="toggleLanguage()"
                title="Сменить язык / Changer de langue"
                class="relative w-24 h-10 shrink-0 bg-slate-950/80 rounded-xl border border-slate-800 p-1 flex items-center justify-between overflow-hidden shadow-inner">
            <div id="lang-slider" class="absolute top-1 bottom-1 w-[calc(50%-4px)] bg-emerald-500 rounded-lg transition-all duration-300"></div>
            <span class="relative z-10 w-1/2 text-center text-xs font-bold">RU</span>
            <span class="relative z-10 w-1/2 text-center text-xs font-bold text-slate-300">FR</span>
        </button>
    </header>

    <div class="max-w-[1600px] mx-auto flex gap-5 md:gap-6 items-start">
        <aside id="sidebar" class="hidden lg:block w-64 xl:w-72 shrink-0 glass-panel rounded-3xl p-3.5 lg:sticky lg:top-4">
            <nav class="space-y-2">
                <button id="nav-home" onclick="showHomePage()" class="sidebar-btn"><i class="fa-solid fa-house w-5 text-center"></i><span id="nav-home-label">Главная</span></button>
                <div>
                    <button id="nav-territories" onclick="toggleTerritoriesMenu()" class="sidebar-btn"><i class="fa-solid fa-map-location-dot w-5 text-center"></i><span id="nav-territories-label" class="flex-1 text-left">Участки</span><i id="territory-chevron" class="fa-solid fa-chevron-down text-[10px] transition-transform"></i></button>
                    <div id="cities-container" class="hidden mt-2 ml-3 pl-3 border-l border-slate-700/80 space-y-1"></div>
                </div>
                <button id="nav-publishers" onclick="showPublishersPage()" class="sidebar-btn"><i class="fa-solid fa-users w-5 text-center"></i><span id="nav-publishers-label">Возвещатели</span></button>
            </nav>
        </aside>

        <main class="flex-1 min-w-0 space-y-5 md:space-y-6">
            <section id="home-page" class="min-h-[62vh] glass-panel rounded-3xl"></section>

            <section id="territories-page" class="hidden space-y-5 md:space-y-6">
                <div id="city-controls" class="hidden glass-panel rounded-3xl p-4 md:p-5 flex-wrap items-center justify-between gap-3">
                    <div class="min-w-0"><p class="text-[10px] uppercase tracking-[.16em] text-indigo-300/70 font-bold mb-1">Текущий город</p><h2 id="active-city-title" class="font-extrabold text-lg md:text-xl text-white truncate"></h2></div>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="addCity()" class="h-10 px-3.5 rounded-xl border text-xs font-semibold"><i class="fa-solid fa-plus mr-1.5"></i><span id="btn-add-city-label">Город</span></button>
                        <div id="city-menu-wrap" class="relative">
                            <button onclick="editCityMenu()" class="h-10 px-3.5 rounded-xl border text-xs font-semibold"><i class="fa-solid fa-pen mr-1.5"></i><span id="btn-edit-city-label">Изменить город</span></button>
                            <div id="city-menu" class="hidden absolute right-0 mt-2.5 w-60 bg-slate-900/95 backdrop-blur-xl border border-slate-800 rounded-2xl shadow-2xl py-2 z-50 text-xs overflow-hidden">
                                <button onclick="renameCity();editCityMenu()" class="w-full text-left px-4 py-2.5 transition"><i class="fa-solid fa-signature w-5 mr-1"></i>Изменить название</button>
                                <button onclick="editCityMap();editCityMenu()" class="w-full text-left px-4 py-2.5 transition"><i class="fa-solid fa-earth-americas w-5 mr-1"></i>Изменить ссылку на карту</button>
                            </div>
                        </div>
                    </div>
                </div>

                <section class="glass-panel rounded-3xl p-4 md:p-5 flex flex-wrap items-center justify-between gap-4">
                    <div class="flex flex-wrap items-center gap-2.5 md:gap-3 text-xs">
                        <div class="h-11 flex items-center gap-2.5 bg-emerald-950/30 px-3.5 rounded-2xl border border-emerald-500/20 shadow-inner"><div class="w-6 h-6 rounded-lg bg-emerald-500/15 text-emerald-400 flex items-center justify-center"><i class="fa-solid fa-circle-check text-[10px]"></i></div><div><span id="stat-free-label" class="text-slate-400 text-[9px] block uppercase tracking-wider font-semibold">Свободно</span><b id="st-free" class="text-emerald-400 text-sm">0</b></div></div>
                        <div class="h-11 flex items-center gap-2.5 bg-blue-950/30 px-3.5 rounded-2xl border border-blue-500/20 shadow-inner"><div class="w-6 h-6 rounded-lg bg-blue-500/15 text-blue-400 flex items-center justify-center"><i class="fa-solid fa-clock text-[10px]"></i></div><div><span id="stat-busy-label" class="text-slate-400 text-[9px] block uppercase tracking-wider font-semibold">В обработке</span><b id="st-busy" class="text-blue-400 text-sm">0</b></div></div>
                        <div class="h-11 flex items-center gap-2.5 bg-rose-950/30 px-3.5 rounded-2xl border border-rose-500/20 shadow-inner"><div class="w-6 h-6 rounded-lg bg-rose-500/15 text-rose-400 flex items-center justify-center"><i class="fa-solid fa-triangle-exclamation text-[10px]"></i></div><div><span id="stat-overdue-label" class="text-slate-400 text-[9px] block uppercase tracking-wider font-semibold">Просрочено</span><b id="st-overdue" class="text-rose-400 text-sm">0</b></div></div>
                        <div class="h-11 flex items-center gap-2.5 bg-amber-950/30 px-3.5 rounded-2xl border border-amber-500/20 shadow-inner"><div class="w-6 h-6 rounded-lg bg-amber-500/15 text-amber-400 flex items-center justify-center"><i class="fa-solid fa-hourglass-half text-[10px]"></i></div><div><span id="stat-waiting-label" class="text-slate-400 text-[9px] block uppercase tracking-wider font-semibold">Ожидание</span><b id="st-waiting" class="text-amber-400 text-sm">0</b></div></div>
                    </div>
                    <div class="flex flex-wrap items-center gap-2">
                        <button onclick="exportOfficialRegister()" title="Télécharger le registre officiel (S-13)" class="w-10 h-10 rounded-xl border"><i class="fa-solid fa-download"></i></button>
                        <a id="map-link" href="#" target="_blank" class="h-10 px-4 rounded-xl text-xs font-semibold items-center gap-1.5"><i class="fa-solid fa-map-location-dot"></i><span id="map-label">Карта</span></a>
                        <button onclick="addTerritory()" class="h-10 px-4 rounded-xl border text-xs font-semibold"><i class="fa-solid fa-plus mr-1.5"></i><span id="add-territory-label">Участок</span></button>
                    </div>
                </section>

                <section id="grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-4 md:gap-5"></section>
            </section>

            <section id="publishers-page" class="hidden space-y-4">
                <div class="glass-panel rounded-3xl p-4 md:p-5">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
                        <div><p class="text-[10px] uppercase tracking-[.16em] text-indigo-300/70 font-bold mb-1">База данных</p><h2 id="publishers-title" class="text-xl font-extrabold text-white">Возвещатели</h2><p class="text-xs text-slate-400 mt-0.5"><span id="publishers-count">0</span> <span id="pub-base-label">в базе</span></p></div>
                        <button onclick="addPublisher()" class="h-10 px-4 rounded-xl border text-xs font-bold"><i class="fa-solid fa-user-plus mr-1.5"></i><span id="publisher-add-label">Добавить возвещателя</span></button>
                    </div>
                    <div class="relative"><i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i><input id="publishers-search" oninput="renderPublishers()" class="w-full h-11 bg-slate-950/80 border border-slate-800 rounded-xl pl-9 pr-3 text-xs focus:outline-none focus:border-emerald-500 transition shadow-inner" placeholder="Поиск по имени"></div>
                </div>
                <div id="publishers-list" class="space-y-2.5"></div>
            </section>
        </main>
    </div>

    <div id="dialog-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-xl hidden items-center justify-center p-4 z-[70]"><div class="glass-panel rounded-3xl max-w-md w-full p-5 md:p-6"><div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-800/80"><h3 id="dialog-title" class="font-bold text-white"></h3><button onclick="closeDialog(false)" class="square-btn"><i class="fa-solid fa-xmark"></i></button></div><div id="dialog-fields" class="space-y-3"></div><div class="flex justify-end gap-2 mt-5 pt-4 border-t border-slate-800/80"><button onclick="closeDialog(false)" class="h-10 px-4 rounded-xl text-xs">Отмена</button><button onclick="closeDialog(true)" class="h-10 px-5 rounded-xl text-xs font-bold">ОК</button></div></div></div>

    <div id="confirm-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-xl hidden items-center justify-center p-4 z-[80]"><div class="glass-panel rounded-3xl max-w-sm w-full p-5 md:p-6"><div class="w-10 h-10 rounded-2xl bg-rose-500/10 border border-rose-500/20 text-rose-400 flex items-center justify-center mb-4"><i class="fa-solid fa-triangle-exclamation"></i></div><p id="confirm-text" class="text-sm text-slate-200 mb-5 leading-relaxed"></p><div class="flex justify-end gap-2"><button onclick="closeConfirm(false)" class="h-10 px-4 rounded-xl text-xs">Отмена</button><button onclick="closeConfirm(true)" class="h-10 px-4 rounded-xl text-xs font-bold">Подтвердить</button></div></div></div>

    <div id="history-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-xl hidden items-center justify-center p-4 z-[70]"><div class="glass-panel rounded-3xl max-w-lg w-full p-5 md:p-6"><div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-800/80"><h3 id="history-title" class="font-bold text-white"></h3><button onclick="closeHistory()" class="square-btn"><i class="fa-solid fa-xmark"></i></button></div><div id="history-list" class="space-y-2 max-h-[55vh] overflow-y-auto pr-1"></div></div></div>

    <div id="publisher-picker-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-xl hidden items-center justify-center p-4 z-[80]"><div class="glass-panel rounded-3xl max-w-md w-full p-5 md:p-6"><div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-800/80"><h3 id="publisher-picker-title" class="font-bold text-white">Выберите возвещателя</h3><button onclick="closePicker()" class="square-btn"><i class="fa-solid fa-xmark"></i></button></div><div class="relative mb-3"><i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i><input id="publisher-picker-search" oninput="renderPicker()" class="w-full h-11 bg-slate-950/80 border border-slate-800 rounded-xl pl-9 pr-3 text-xs focus:outline-none focus:border-emerald-500 transition" placeholder="Поиск по имени"></div><div id="publisher-picker-list" class="space-y-2 max-h-[50vh] overflow-y-auto pr-1"></div></div></div>

    <script type="module" src="./app.js"></script>

    <script>
        (function () {
            const grid = document.getElementById('grid');
            if (!grid) return;

            async function copyText(text) {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return;
                }
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();
                document.execCommand('copy');
                textarea.remove();
            }

            function enhanceTerritoryCards() {
                const cards = [...grid.querySelectorAll(':scope > article')];
                cards.forEach((card, index) => {
                    if (!card.classList.contains('animate-fade-in')) {
                        card.classList.add('animate-fade-in');
                        card.style.animationDelay = `${Math.min(index * 0.055, 0.65)}s`;
                    }
                });

                grid.querySelectorAll('a.mini-btn[href]').forEach(anchor => {
                    const wrapper = anchor.parentElement;
                    if (!wrapper) return;
                    wrapper.classList.add('flex', 'items-center', 'gap-1.5', 'flex-wrap');
                    let button = wrapper.querySelector('.copy-map-btn');
                    if (!button) {
                        button = document.createElement('button');
                        button.type = 'button';
                        button.className = 'copy-map-btn';
                        button.innerHTML = '<i class="fa-solid fa-copy text-xs"></i>';
                        wrapper.appendChild(button);
                        button.addEventListener('click', async () => {
                            try {
                                await copyText(anchor.href);
                                button.innerHTML = '<i class="fa-solid fa-check text-xs"></i>';
                                setTimeout(() => { button.innerHTML = '<i class="fa-solid fa-copy text-xs"></i>'; }, 1200);
                            } catch (error) {
                                console.error('Copy link error:', error);
                            }
                        });
                    }
                    button.title = document.documentElement.lang === 'fr' ? 'Copier le lien de la carte' : 'Скопировать ссылку на карту';
                });
            }

            const observer = new MutationObserver(enhanceTerritoryCards);
            observer.observe(grid, { childList: true, subtree: true });
            enhanceTerritoryCards();
        })();
    </script>
</body>
</html>
