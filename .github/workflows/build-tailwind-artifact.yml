name: Build production assets

on:
  push:
    branches:
      - hardening/repo-10-of-10

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: hardening/repo-10-of-10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pinned build dependencies
        run: npm install --no-save --package-lock=false esbuild@0.28.2 firebase@10.8.0

      - name: Build static Tailwind CSS
        run: npx --yes tailwindcss@3.4.17 -c tailwind.config.cjs -i tailwind.input.css -o tailwind.generated.css --minify

      - name: Build local production JavaScript
        run: node scripts/build-production.mjs

      - name: Vendor Font Awesome solid assets
        run: |
          mkdir -p vendor/fontawesome/css vendor/fontawesome/webfonts
          curl --fail --location --retry 3 --silent --show-error https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/fontawesome.min.css -o vendor/fontawesome/css/fontawesome.min.css
          curl --fail --location --retry 3 --silent --show-error https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/solid.min.css -o vendor/fontawesome/css/solid.min.css
          curl --fail --location --retry 3 --silent --show-error https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/webfonts/fa-solid-900.woff2 -o vendor/fontawesome/webfonts/fa-solid-900.woff2
          curl --fail --location --retry 3 --silent --show-error https://raw.githubusercontent.com/FortAwesome/Font-Awesome/6.4.0/LICENSE.txt -o vendor/fontawesome/LICENSE.txt
          (
            cd vendor/fontawesome
            sha256sum css/fontawesome.min.css css/solid.min.css webfonts/fa-solid-900.woff2 LICENSE.txt > SHA256SUMS
          )

      - name: Switch production HTML to local assets
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          source = path.read_text()
          old_tailwind = '''    <script src="https://cdn.tailwindcss.com"></script>\n    <script>\n        tailwind.config = { darkMode: 'class' };\n    </script>'''
          if old_tailwind in source:
              source = source.replace(old_tailwind, '    <link rel="stylesheet" href="./tailwind.generated.css">', 1)
          if 'tailwind.generated.css' not in source:
              raise SystemExit('Static Tailwind stylesheet is not linked')
          source = source.replace(
              '    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">',
              '    <link rel="stylesheet" href="./vendor/fontawesome/css/fontawesome.min.css">\n    <link rel="stylesheet" href="./vendor/fontawesome/css/solid.min.css">'
          )
          if 'vendor/fontawesome/css/solid.min.css' not in source:
              raise SystemExit('Local Font Awesome stylesheet is not linked')
          source = source.replace('<script type="module" src="./app.js"></script>', '<script type="module" src="./app.bundle.js"></script>')
          if 'app.bundle.js' not in source:
              raise SystemExit('Production bundle is not linked')
          path.write_text(source)
          PY

      - name: Verify production assets
        run: |
          test -s tailwind.generated.css
          test -s app.bundle.js
          test -s vendor/fontawesome/css/fontawesome.min.css
          test -s vendor/fontawesome/css/solid.min.css
          test -s vendor/fontawesome/webfonts/fa-solid-900.woff2
          test -s vendor/fontawesome/LICENSE.txt
          (cd vendor/fontawesome && sha256sum -c SHA256SUMS)
          grep -q 'tailwind.generated.css' index.html
          grep -q 'app.bundle.js' index.html
          grep -q 'vendor/fontawesome/css/solid.min.css' index.html
          ! grep -q 'cdn.tailwindcss.com' index.html
          ! grep -q 'cdnjs.cloudflare.com' index.html
          ! grep -q 'gstatic.com/firebasejs' app.bundle.js

      - name: Commit generated production assets
        shell: bash
        run: |
          if git diff --quiet -- index.html tailwind.generated.css app.bundle.js vendor/fontawesome && git ls-files --error-unmatch tailwind.generated.css >/dev/null 2>&1 && git ls-files --error-unmatch app.bundle.js >/dev/null 2>&1 && git ls-files --error-unmatch vendor/fontawesome/SHA256SUMS >/dev/null 2>&1; then
            echo "Production assets are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tailwind.generated.css app.bundle.js vendor/fontawesome
          git commit -m "Build self-contained production assets"
          git push origin HEAD:hardening/repo-10-of-10
