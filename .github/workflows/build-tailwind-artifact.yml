name: Build Tailwind artifact

on:
  push:
    branches:
      - hardening/repo-10-of-10

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: hardening/repo-10-of-10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build static Tailwind CSS
        run: npx --yes tailwindcss@3.4.17 -c tailwind.config.cjs -i tailwind.input.css -o tailwind.generated.css --minify

      - name: Verify generated stylesheet
        run: |
          test -s tailwind.generated.css
          ! grep -q "cdn.tailwindcss.com" tailwind.generated.css

      - name: Commit generated stylesheet
        shell: bash
        run: |
          if git diff --quiet -- tailwind.generated.css && git ls-files --error-unmatch tailwind.generated.css >/dev/null 2>&1; then
            echo "Generated stylesheet is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tailwind.generated.css
          git commit -m "Build static Tailwind stylesheet"
          git push origin HEAD:hardening/repo-10-of-10
