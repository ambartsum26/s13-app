name: Build Tailwind artifact

on:
  push:
    branches:
      - hardening/repo-10-of-10

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: hardening/repo-10-of-10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build static Tailwind CSS
        run: npx --yes tailwindcss@3.4.17 -c tailwind.config.cjs -i tailwind.input.css -o tailwind.generated.css --minify

      - name: Replace production Play CDN with local CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          source = path.read_text()
          old = '''    <script src="https://cdn.tailwindcss.com"></script>\n    <script>\n        tailwind.config = { darkMode: 'class' };\n    </script>'''
          new = '    <link rel="stylesheet" href="./tailwind.generated.css">'
          if old in source:
              source = source.replace(old, new, 1)
              path.write_text(source)
          elif 'tailwind.generated.css' not in source:
              raise SystemExit('Expected Tailwind CDN block not found')
          PY

      - name: Verify production assets
        run: |
          test -s tailwind.generated.css
          grep -q 'tailwind.generated.css' index.html
          ! grep -q 'cdn.tailwindcss.com' index.html
          ! grep -q 'cdn.tailwindcss.com' tailwind.generated.css

      - name: Commit generated production assets
        shell: bash
        run: |
          if git diff --quiet -- index.html tailwind.generated.css && git ls-files --error-unmatch tailwind.generated.css >/dev/null 2>&1; then
            echo "Production assets are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tailwind.generated.css
          git commit -m "Use static Tailwind stylesheet in production"
          git push origin HEAD:hardening/repo-10-of-10
