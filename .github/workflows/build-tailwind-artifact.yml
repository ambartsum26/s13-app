name: Build Tailwind artifact

on:
  push:
    branches:
      - hardening/repo-10-of-10

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build static Tailwind CSS
        run: npx --yes tailwindcss@3.4.17 -c tailwind.config.cjs -i tailwind.input.css -o tailwind.generated.css --minify

      - name: Verify generated stylesheet
        run: |
          test -s tailwind.generated.css
          ! grep -q "cdn.tailwindcss.com" tailwind.generated.css

      - name: Upload generated stylesheet
        uses: actions/upload-artifact@v4
        with:
          name: tailwind-generated
          path: tailwind.generated.css
          if-no-files-found: error
          retention-days: 1
