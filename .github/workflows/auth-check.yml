name: Application regression checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check JavaScript syntax
        run: |
          for file in *.js; do node --input-type=module --check < "$file" || exit 1; done
          node --check scripts/build-production.mjs
          for test in tests/*.test.cjs; do node --check "$test" || exit 1; done

      - name: Install pinned build dependencies
        run: npm install --no-save --package-lock=false esbuild@0.28.2 firebase@10.8.0

      - name: Verify reproducible production assets
        run: |
          cp tailwind.generated.css /tmp/tailwind.generated.css.expected
          cp app.bundle.js /tmp/app.bundle.js.expected
          npx --yes tailwindcss@3.4.17 -c tailwind.config.cjs -i tailwind.input.css -o tailwind.generated.css --minify
          node scripts/build-production.mjs
          cmp --silent /tmp/tailwind.generated.css.expected tailwind.generated.css
          cmp --silent /tmp/app.bundle.js.expected app.bundle.js
          (cd vendor/fontawesome && sha256sum -c SHA256SUMS)
          grep -q 'tailwind.generated.css' index.html
          grep -q 'app.bundle.js' index.html
          grep -q 'vendor/fontawesome/css/solid.min.css' index.html
          ! grep -q 'cdn.tailwindcss.com' index.html
          ! grep -q 'cdnjs.cloudflare.com' index.html
          ! grep -q 'gstatic.com/firebasejs' app.bundle.js

      - name: Compile Firestore rules in emulator
        run: npx --yes firebase-tools@15.29.0 emulators:exec --only firestore --project demo-s13-app "echo Firestore rules compiled"

      - name: Run all regression tests
        run: |
          for test in tests/*.test.cjs; do
            echo "==> $test"
            node "$test"
          done
