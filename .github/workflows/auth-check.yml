name: Application regression checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  auth-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check module syntax
        run: |
          for file in *.js; do node --input-type=module --check < "$file" || exit 1; done

      - name: Run regression tests
        run: |
          node tests/auth.test.cjs
          node tests/data.test.cjs
          node tests/export.test.cjs
          node tests/publisher-sort.test.cjs
