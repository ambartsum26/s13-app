name: Application regression checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check module syntax
        run: |
          for file in *.js; do node --input-type=module --check < "$file" || exit 1; done

      - name: Compile Firestore rules in emulator
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-s13-app "echo Firestore rules compiled"

      - name: Run all regression tests
        run: |
          for test in tests/*.test.cjs; do
            echo "==> $test"
            node "$test"
          done
