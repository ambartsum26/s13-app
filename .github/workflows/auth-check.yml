name: Regression checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        run: |
          node --check app-auth.js
          node --check app-core.js
          node --check app-ui.js
          node --check app-popups.js
          node --check app-cards.js
          node --check s13-export.js
          node --check app.js

      - name: Run auth tests
        run: node tests/auth.test.cjs
